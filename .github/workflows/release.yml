name: Release

on:
  push:
    tags:
      - '[0-9]*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify version sync
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          MF_VER=$(node -p "require('./manifest.json').version")
          echo "package.json: $PKG_VER | manifest.json: $MF_VER"
          if [ "$PKG_VER" != "$MF_VER" ]; then
            echo "::error::package.json 版本($PKG_VER) 与 manifest.json 版本($MF_VER) 不一致。请先同步两者，否则 webapp 版本守卫会误判，导致标准安装用户重复自举下载。"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build webapp (内联 CSS + 内联 bundle 生成自包含 webapp/app.html)
        run: node scripts/bundle-webapp.mjs

      - name: Check webapp load matrix (防漂移)
        run: node scripts/check-load-matrix.mjs

      # 消息契约闸门：协议注册表镜像同步 / 路由键唯一 / 入站前缀合规（三道确定性检查，零误报）
      - name: Check message contract (协议镜像 / 路由唯一 / 前缀合规)
        run: node scripts/check-message-contract.mjs

      # window 全局挂载点清单闸门：docs/window-globals.md 的自动生成区块必须与源码一致
      # （webapp 依赖「文件尾挂 window」的隐式契约；清单失真等于契约不可审计）
      - name: Check window globals (全局挂载点清单未漂移)
        run: node scripts/check-window-globals.mjs

      # 死代码闸门（防再次堆积）：docs/dead-css-candidates.md / docs/dead-exports.md 的自动生成区块
      # 必须与源码一致。任何新增的「未评审死 CSS 类」或「零消费者运行时导出」都会触发漂移而阻断发布。
      - name: Check dead CSS candidates (死 CSS 清单未漂移)
        run: node scripts/check-dead-css.mjs

      - name: Check dead exports (零消费者导出清单未漂移)
        run: node scripts/check-dead-exports.mjs

      # Obsidian 官方 Source review 规则的本地闸门（3.32.0 被退回 1 Error + 1 Warning 后落地）：
      # 禁止屏蔽 no-console / disable 必须带 -- 描述 / 禁止硬编码 .obsidian
      - name: Check Obsidian review rules (审核规则本地自检)
        run: node scripts/check-review-rules.mjs

      # webapp/ 被 .eslintrc.cjs 排除在 ESLint 之外，属性上下文转义无任何 lint 保护。
      # 闸门失败即阻断发布：属性值未转义可被闭合后注入任意事件处理器。
      - name: Check HTML attribute escaping (防 XSS 回归)
        run: node scripts/check-html-escape.mjs

      - name: Self-test the escaping gate (闸门自身可靠性)
        run: node scripts/check-html-escape.mjs --self-test

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (host)
        run: npm run test:host

      - name: Test (webapp)
        run: npm run test

      # 覆盖率门禁（防回归）：「已覆盖语句数」低于 coverage-baseline.json 基线即失败，阻断 Release。
      # 用绝对数而非百分比：给未覆盖的大文件补测会拉低百分比（逆向激励），绝对数只对真实退步敏感。
      # 基线只升不降，抬升需显式执行 npm run coverage:baseline。
      # 注：webapp 测试经 loadModule 用 new Function 求值，jest 原生 --coverage 恒为 0/0，
      # 必须走 COVERAGE_EVAL=1 的插桩路径才有真实数据。
      - name: Coverage gate (webapp 已覆盖语句数防回归)
        run: npm run test:coverage

      - name: Build main.js
        run: node esbuild.config.mjs production

      - name: Package webapp
        run: |
          cd webapp
          zip -r ../webapp.zip . -x "*.DS_Store"
          cd ..

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            webapp.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
            author-avatar.jpg
            webapp.zip
          generate_release_notes: true
