name: release

on:
  push:
    tags:
      - "[0-9]*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          # 仓库现分两份 lockfile：根（仅扫描器需要的极小依赖）+ dev/（构建/测试/lint 工具链）
          cache-dependency-path: |
            package-lock.json
            dev/package-lock.json

      # 根 npm ci 只装 fflate + obsidian + @types/node + typescript（扫描器类型检查要的最小集）；
      # dev/ 工具链单独装，扫描器不会触碰 dev/，从而把根安装体积从 ~493 包降到极小。
      - name: Install root (minimal) + dev toolchain
        run: npm ci && npm --prefix dev ci

      - name: Build webapp bundle
        run: npm --prefix dev run build:webapp

      - name: Type check
        run: npm --prefix dev run typecheck

      - name: Lint
        run: npm --prefix dev run lint

      - name: Host tests (vitest)
        run: npm --prefix dev run test:host
        env:
          CI: "true"

      - name: Webapp tests (jest)
        run: npm --prefix dev run test

      - name: Build main.js (production)
        run: npm --prefix dev run build:main

      - name: Zip webapp
        run: cd webapp && zip -r ../webapp.zip . -x "*.map" "node_modules/*"

      - name: Verify manifest/package version match
        run: |
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./manifest.json').version")
          if [ "$PKG" != "$MAN" ]; then echo "version mismatch: $PKG vs $MAN"; exit 1; fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            main.js
            manifest.json
            styles.css
            webapp.zip
            author-avatar.jpg
