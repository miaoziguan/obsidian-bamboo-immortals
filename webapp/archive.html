<!DOCTYPE html>

<head>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%232D5A27' width='32' height='32' rx='6'/><path d='M16 6v20M16 10l-4 2M16 10l4 2M16 16l-3 1.5M16 16l3 1.5' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232D5A27' width='180' height='180' rx='40'/><path d='M90 40v100M90 60l-20 10M90 60l20 10M90 90l-15 7.5M90 90l15 7.5' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'/></svg>">
<title>目标归档 - Bamboo Immortals</title>
<style data-src="assets/styles/variables.css">
/* ========== 全局变量（竹林中国风 - 亮色模式） ==========
 *
 * 命名规范（三层架构）：
 *   基础色板层  --{palette}-{shade}       例：--bamboo-deep, --bm-primary
 *   语义层      --{semantic}-{variant}     例：--text-primary, --status-danger
 *   组件层      --{component}-{property}   例：--tag-execute-bg, --kpi-up-bg
 *   RGB 通道    --{name}-rgb                例：--bm-primary-rgb, --danger-rgb
 *   动效/间距/圆角/字体  --{category}-{step}  例：--space-3, --radius-md, --type-sm
 *
 * 规范前缀（Task 8 统一命名空间）：
 *   新增自定义属性必须使用 --bm-* 或 --bamboo-* 前缀（lint R10 强制）。
 *   以下旧名保留为兼容别名（定义见下方，新代码禁止使用）：
 *     --primary-rgb          → 用 --bm-primary-rgb
 *     --primary-alt-rgb      → 用 --bm-primary-alt-rgb
 *     --bamboo-primary       → 用 --bm-primary
 *     --bamboo-primary-light → 用 --bm-primary-light
 *     --bamboo-primary-dark  → 用 --bamboo-dark（已废弃）
 *
 * 禁止：裸写 #fff / #000 / white / black / rgb(255,255,255) — 必须走令牌
 * 禁止：裸写 px 圆角 / px 字号 — 必须走 --radius-* / --type-*
 * 废弃别名（保留兼容，新代码禁止使用）：
 *   --font-size-* → 用 --type-*
 *   --bamboo-text-muted → 用 --text-tertiary
 *   --bamboo-text-secondary → 用 --text-secondary
 *   --bamboo-primary-dark → 用 --bamboo-dark
 *   --tag-execute-bg → 用 --bamboo-primary（亮色）/ --bamboo-light（暗色）
 *   --tag-miss-bg → 用 --ink-pale
 *   --bamboo-success → 用 --bamboo-primary（当前同值）
 *   --status-success → 用 --bamboo-primary（当前同值）
 * ======================================================== */
:host {
    /* === 主题色相（可变）=== */
    --accent-hue: 120;  /* 默认竹青绿，可通过 DisplayManager 色相滑块调整 */

    /* === 明度偏移（可变）=== */
    --accent-lightness-offset: 0%;  /* 默认 0%，可通过 DisplayManager 明度滑块调整（范围 ~-15% ~ +15%）*/

    /* === z-index 层级体系（全局统一，禁止再写裸数字）=== */
    --z-layer-below: -2;       /* 装饰层/背景装饰 */
    --z-layer-behind: -1;      /* 背景伪元素/装饰 */
    --z-layer-base: 0;         /* 正常流 */
    --z-layer-raised: 1;       /* 轻微抬起（card hover 等）*/
    --z-layer-floating: 2;     /* 浮动（日期悬浮、toolbar）*/
    --z-layer-dropdown: 100;   /* 下拉菜单/颜色面板 */
    --z-layer-keyboard-hint: 900;     /* 键盘快捷键提示 */
    --z-layer-tooltip: 9999;          /* tooltip / 悬浮预览 / KPI 悬浮 */
    --z-layer-overlay: 10000;         /* 通用遮罩层（FAB 背景 / skip-link / modal-overlay / 弹层底部）*/
    --z-layer-modal: 10001;           /* 模态容器 / widget 覆盖 */
    --z-layer-toast: 10010;           /* Toast 全屏通知 */
    --z-layer-max: 11000;             /* 最顶层（搜索/日期选择）*/

    /* === 基础色彩系统（HSL 动态生成）=== */
    --bamboo-deep: hsl(calc(var(--accent-hue) - 7), 40%, calc(25% + var(--accent-lightness-offset)));
    --bamboo-deep-rgb: 45, 90, 39;
    --bamboo-dark: hsl(calc(var(--accent-hue) - 8), 39%, calc(34% + var(--accent-lightness-offset)));
    --bm-primary: hsl(var(--accent-hue), 27%, calc(48% + var(--accent-lightness-offset)));
    --bamboo-primary: var(--bm-primary); /* alias — 新代码请用 --bm-primary */
    --bamboo-light: hsl(var(--accent-hue), 33%, calc(61% + var(--accent-lightness-offset)));
    --bamboo-pale: hsl(var(--accent-hue), 35%, calc(75% + var(--accent-lightness-offset)));
    --bm-primary-light: hsl(var(--accent-hue), 39%, calc(80% + var(--accent-lightness-offset)));
    --bamboo-primary-light: var(--bm-primary-light); /* alias — 新代码请用 --bm-primary-light */
    --bm-primary-rgb: 90, 154, 90;
    --primary-rgb: var(--bm-primary-rgb); /* alias — 新代码请用 --bm-primary-rgb */
    --deep-rgb: 45, 90, 39;
    --danger-rgb: 201, 72, 59;
    --gold-rgb: 212, 175, 55;
    /* 中性通道（禁止再写裸 255,255,255 / 0,0,0，统一走令牌） */
    --white-rgb: 255, 255, 255;
    --black-rgb: 0, 0, 0;
    --rice-paper-rgb: 250, 248, 240;
    /* 纯色实色通道（禁止再写裸 #fff / #000，统一走令牌；暗色下白仍是白，无需重定义） */
    --white: #ffffff;
    --black: #000000;
    /* 纯色不透明表面（亮色纯白 / 暗色深表面，随主题自适应） */
    --surface-solid: #ffffff;
    --pale-rgb: 168, 213, 168;
    --sky-azure-rgb: 135, 206, 235;
    --health-success-rgb: 126, 211, 33;
    --ticket-stub-bg-rgb: 148, 198, 148;
    --dark-surface-mid-rgb: 30, 50, 32;
    --dark-surface-rgb: 20, 38, 22;
    --gray-rgb: 149, 165, 166;
    --danger-alt-rgb: 231, 76, 60;
    --warning-yellow-rgb: 251, 191, 36;
    --warning-orange-rgb: 245, 166, 35;
    --info-blue-rgb: 66, 133, 244;
    --teal-rgb: 26, 167, 106;
    --danger-bright-rgb: 239, 68, 68;
    --amber-rgb: 230, 162, 60;
    --purple-rgb: 154, 90, 154;
    --purple-pale-rgb: 196, 138, 196;
    --mint-rgb: 168, 230, 207;
    --gold-bright-rgb: 255, 215, 0;
    --pale-green-rgb: 245, 250, 245;
    --pale-green-alt-rgb: 248, 252, 248;
    --surface-deep-rgb: 20, 35, 20;
    --surface-deep-alt-rgb: 25, 40, 25;
    --bm-primary-alt-rgb: 107, 174, 107;
    --primary-alt-rgb: var(--bm-primary-alt-rgb); /* alias — 新代码请用 --bm-primary-alt-rgb */
    --danger-soft-rgb: 220, 100, 100;
    --red-pale-rgb: 255, 240, 240;
    --amber-brown-rgb: 180, 140, 100;
    --gray-mid-rgb: 90, 90, 90;
    --green-pale-rgb: 200, 224, 200;
    --green-bright-rgb: 143, 216, 143;
    --amber-deep-rgb: 245, 158, 11;
    --orange-pale-rgb: 252, 191, 73;
    --blue-alt-rgb: 74, 144, 217;
    --danger-deep-rgb: 220, 38, 38;
    --gray-alt-rgb: 107, 114, 128;
    --red-bright-rgb: 200, 80, 80;
    --green-alt-rgb: 180, 220, 165;
    --green-very-bright-rgb: 200, 255, 150;
    --overdue-bg-rgb: 255, 240, 240;
    --overdue-bg-mid-rgb: 255, 235, 235;
    --overdue-bg-light-rgb: 255, 230, 230;
    --ticket-gold: #B8860B;
    --bamboo-text-muted: var(--ink-pale); /* DEPRECATED: 用 --text-tertiary */
    --bamboo-text-secondary: var(--ink-light); /* DEPRECATED: 用 --text-secondary */
    --bamboo-border: rgba(var(--primary-rgb), 0.25);
    --bamboo-background: rgba(var(--primary-rgb), 0.06);
    --bamboo-primary-dark: var(--bamboo-dark); /* DEPRECATED: 用 --bamboo-dark */
    --bamboo-success: var(--bamboo-primary); /* DEPRECATED: 用 --bamboo-primary */
    --bamboo-warning: #c9a227;
    --bamboo-warning-pale: #fff59d;
    --bamboo-error: #dc3545;
    --bamboo-card: var(--card-bg);
    --sky-azure: #87CEEB;
    --sky-pale: #B8E2F8;
    --sky-mist: #E8F6FC;
    --leaf-green: #6B8E23;
    --leaf-light: #8FBC3A;
    --rice-paper: #FAF8F0;
    --ivory: #FFFFF0;
    --cinnabar: #C9483B;
    --gold: #D4AF37;

    /* === 健康评分色彩系统 === */
    --health-danger: #EF4444;
    --health-warning: #F59E23;
    --health-success-clr: #7ED321;
    --health-info: #4A90D9;
    --health-neutral: #95A5A6;
    --health-pink: #E91E63;
    --health-purple: #9C27B0;
    --health-orange: #FF9800;
    --health-gold-clr: #D97706;

    /* === 文字色彩系统 === */
    --ink-dark: #1A1A1A;
    --ink-medium: #404040;
    --ink-light: #555555;
    --ink-pale: #707070;

    /* === 背景色彩系统 - 重新设计：淡雅意境 === */
    --bg-gradient-start: hsl(var(--accent-hue), 18%, calc(96% + var(--accent-lightness-offset)));
    --bg-gradient-mid1: hsl(var(--accent-hue), 21%, calc(94% + var(--accent-lightness-offset)));
    --bg-gradient-mid2: hsl(var(--accent-hue), 17%, calc(90% + var(--accent-lightness-offset)));
    --bg-gradient-end: hsl(var(--accent-hue), 20%, calc(95% + var(--accent-lightness-offset)));
    --card-bg: rgba(var(--white-rgb), 0.60);
    --card-glass: rgba(var(--white-rgb), 0.55);
    /* 玻璃拟态 fallback：当 backdrop-filter 不被支持或背景过透时，切回不透明表面色 */
    --card-bg-fallback: var(--surface-solid);

    /* === 文字语义变量 === */
    --text-primary: var(--ink-dark);
    --text-secondary: var(--ink-light);
    --text-tertiary: var(--ink-pale);
    --text-on-accent: var(--white); /* 强调色背景上的文字（tooltip / 选中按钮 / 状态徽标） */

    /* === 边框与阴影 === */
    --border-light: rgba(var(--primary-rgb), 0.25);
    --shadow: 0 20px 40px rgba(var(--deep-rgb), 0.12);
    
    /* === 统一过渡动画曲线 === */
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    
    /* === 点击反馈缩放比例 === */
    --scale-click: scale(0.96);
    --scale-tiny: scale(0.98);
    --scale-small: scale(0.95);
    
    /* === 阴影深度系统 === */
    --shadow-surface: 0 2px 8px rgba(var(--deep-rgb), 0.06), 0 1px 2px rgba(var(--deep-rgb), 0.04);    /* 表层 — 卡片内元素/微小投影 */
    --shadow-card: 0 4px 16px rgba(var(--deep-rgb), 0.08), 0 2px 4px rgba(var(--deep-rgb), 0.04);      /* 中层 — 可悬停卡片/基础面板 */
    --shadow-elevated: 0 8px 28px rgba(var(--deep-rgb), 0.12), 0 4px 8px rgba(var(--deep-rgb), 0.06);  /* 高层 — 下拉菜单/弹出层/悬停态 */
    --shadow-floating: 0 16px 48px rgba(var(--deep-rgb), 0.16), 0 8px 16px rgba(var(--deep-rgb), 0.08); /* 浮层 — 模态框/FAB/浮动面板 */
    
    /* === 按钮样式系统 === */
    --btn-primary-bg: linear-gradient(135deg, var(--bamboo-dark) 0%, var(--bamboo-primary) 100%);
    --btn-primary-hover: linear-gradient(135deg, var(--bamboo-primary) 0%, var(--bamboo-light) 100%);
    --btn-secondary-bg: rgba(var(--primary-rgb), 0.1);
    --btn-secondary-hover: rgba(var(--primary-rgb), 0.2);
    --btn-outline-border: 2px solid var(--bamboo-primary);
    --btn-outline-hover: rgba(var(--primary-rgb), 0.1);

    /* === 渐变变量 === */
    --section-title-gradient: linear-gradient(135deg, rgba(var(--deep-rgb), 0.45) 0%, rgba(var(--primary-rgb), 0.4) 50%, rgba(var(--primary-rgb), 0.35) 100%);
    --action-bg: linear-gradient(135deg, rgba(var(--primary-rgb), 0.55) 0%, rgba(var(--primary-rgb), 0.5) 100%);

    /* === 表格样式 === */
    --table-header-bg: rgba(var(--primary-rgb), 0.1);
    --table-border: rgba(var(--primary-rgb), 0.1);

    /* === 诊断卡片样式 === */
    --diagnosis-bg: rgba(var(--rice-paper-rgb), 0.8);
    --diagnosis-border: rgba(var(--primary-rgb), 0.1);
    --diagnosis-text: var(--ink-dark);
    --diagnosis-card-good-bg: rgba(var(--primary-rgb), 0.08);
    --diagnosis-card-warn-bg: rgba(var(--gold-rgb), 0.08);

    /* === 时间线样式 === */
    --timeline-stat-bg: rgba(var(--primary-rgb), 0.1);
    --progress-bg: rgba(var(--primary-rgb), 0.1);

    /* === KPI 卡片样式 === */
    --kpi-up-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--danger-rgb), 0.1) 100%);
    --kpi-down-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--primary-rgb), 0.1) 100%);
    --kpi-neutral-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--gold-rgb), 0.1) 100%);
    --kpi-break-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--sky-azure-rgb), 0.1) 100%);
    --kpi-up-border: rgba(var(--danger-rgb), 0.3);
    --kpi-up-delta-color: var(--cinnabar);

    /* === 呼吸动画 === */
    --breath-color: rgba(var(--primary-rgb), 0.4);

    /* === 标签样式 === */
    --tag-execute-bg: var(--bamboo-primary);
    --tag-miss-bg: var(--ink-pale);
    --tag-text-light: white;

    /* === 波浪与毛玻璃 === */
    --wave-color: rgba(var(--primary-rgb), 0.5);
    --glass-blur: 20px;
    --glass-highlight-strong: rgba(var(--white-rgb), 0.6);
    --glass-highlight-medium: rgba(var(--white-rgb), 0.4);
    --glass-highlight-soft: rgba(var(--white-rgb), 0.2);
    --glass-highlight-subtle: rgba(var(--white-rgb), 0.1);
    --glass-highlight-faint: rgba(var(--white-rgb), 0.04);
    --glass-highlight-wash: rgba(var(--white-rgb), 0.08);
    /* 预渲染渐变组合：避免浏览器在每帧重新计算 linear-gradient */
    --glass-card-gradient: linear-gradient(135deg, rgba(var(--white-rgb), 0.25) 0%, rgba(var(--white-rgb), 0.08) 50%, rgba(var(--white-rgb), 0.15) 100%), linear-gradient(45deg, rgba(var(--bamboo-deep-rgb),0.12) 0%, transparent 60%);

    /* === 圆角系统（统一为 2px 倍数，覆盖现网所有取值） ===
       映射约定（代码禁止再写裸 px 圆角）：
         2px→--radius-3xs   6px→--radius-2xs   8px→--radius-xs   10px→--radius-sm
         12px→--radius-md   14px→--radius-lg   16px→--radius-xl   18px→--radius-2xl
         20px→--radius-3xl  24px→--radius-4xl  28px→--radius-5xl
    */
    --radius-3xs: 2px;
    --radius-2xs: 6px;
    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius-md: 12px;
    --radius-lg: 14px;
    --radius-xl: 16px;
    --radius-2xl: 18px;
    --radius-3xl: 20px;
    --radius-4xl: 24px;
    --radius-5xl: 28px;
    /* 补充散落档位（代码禁止再用裸 px 圆角） */
    --radius-1: 1px;
    --radius-2-5: 2.5px;
    --radius-3: 3px;
    --radius-4: 4px;
    --radius-5: 5px;
    --radius-26: 26px;
    --radius-38: 38px;
    --radius-pill: 9999px;

    /* === 圆角语义层（组件级映射，代码应优先使用语义层而非裸 --radius-* 数值） ===
       数值层 --radius-* 定义于上方，语义层在此映射；暗色 :host(.dark) 继承同名变量，
       无需重复定义（数值层未在暗色覆写，语义层同样不需要）。 */
    --radius-card: var(--radius-lg);      /* 14px — 标准卡片圆角 (.bamboo-card / .item-card / .empty-state-card) */
    --radius-panel: var(--radius-xl);     /* 16px — 面板/区块圆角 (.fab-panel / section panel) */
    --radius-modal: var(--radius-2xl);    /* 18px — 模态框圆角 (.modal-content) */
    --radius-control: var(--radius-sm);   /* 10px — 表单控件圆角 (input / select / textarea) */
    --radius-tooltip: var(--radius-xs);   /* 8px — tooltip / 徽标圆角 */

    /* === 间距系统（统一为 8px 网格） === */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 28px;
    --space-8: 32px;

    /* === 字体系统 ===
       唯一标准：流体 --type-*（带 clamp，自适应视口）。
       下方 --font-size-* 仅为兼容别名，已映射到 --type-*，新代码禁止直接使用。
    */
    --font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-size-scale: 1;
    --section-gap-scale: 0.8;
    --font-size-xs: var(--type-xs);
    --font-size-sm: var(--type-sm);
    --font-size-base: var(--type-base);
    --font-size-md: var(--type-md);
    --font-size-lg: var(--type-lg);
    --font-size-xl: var(--type-xl);
    --font-size-2xl: var(--type-2xl);
    --line-height-tight: 1.3;
    --line-height-base: 1.5;
    --line-height-relaxed: 1.75;

    /* === 触控尺寸系统 === */
    --touch-min: 44px;
    --touch-comfortable: 48px;
    --touch-target: 44px;

    /* === Focus 样式系统（统一使用 box-shadow 格式） === */
    --focus-ring: 0 0 0 2px var(--bamboo-primary);
    --focus-ring-offset: 0 0 0 4px rgba(var(--primary-rgb), 0.25);
    --focus-ring-danger: 0 0 0 2px var(--cinnabar);
    --focus-transition: box-shadow 0.15s ease;

    /* === 状态色系统 === */
    --status-success: var(--bamboo-primary); /* DEPRECATED: 用 --bamboo-primary */
    --status-warning: var(--gold);
    --status-danger: var(--cinnabar);
    --status-info: #4FC3F7;
    --status-success-bg: rgba(var(--primary-rgb), 0.1);
    --status-warning-bg: rgba(var(--gold-rgb), 0.1);
    --status-danger-bg: rgba(var(--danger-rgb), 0.1);
    --status-info-bg: rgba(var(--info-rgb), 0.1);
    --info-rgb: 79, 195, 247;
    /* === 竹林绿辉光阴影（自适应暗色模式） === */
    --bamboo-glow-sm: 0 2px 8px rgba(var(--primary-rgb), 0.4);
    --bamboo-glow-xs: 0 1px 4px rgba(var(--primary-rgb), 0.3);

    /* === 浮层设计令牌（Toast / Confirm / 选择器统一语言：留白素笺） === */
    --overlay-surface: var(--card-bg);
    --overlay-border-width: 1px;
    --overlay-border-style: solid;
    --overlay-border-color: var(--bamboo-border);
    --overlay-border: var(--overlay-border-width) var(--overlay-border-style) var(--overlay-border-color);
    --overlay-shadow: 0 6px 28px rgba(26, 40, 24, 0.12);
    --overlay-shadow-soft: 0 2px 12px rgba(26, 40, 24, 0.08);
    --ease-cn: cubic-bezier(0.22, 0.61, 0.36, 1);

    /* === 内容宽度系统（用户可调） === */
    --content-max: 1200px;            /* 标准内容最大宽度（响应式容器基准） */
    --content-max-wide: 1100px;       /* 宽屏内容最大宽度 */
    --content-max-width: var(--content-max);
    --content-max-width-wide: var(--content-max-wide);  /* 宽屏默认，用户设置后此值同步更新 */

    /* === 动效时长系统 === */
    --duration-instant: 100ms;
    --duration-fast: 200ms;
    --duration-normal: 300ms;
    --duration-slow: 500ms;
    --duration-slower: 800ms;
}

/* ========== 暗色模式（竹林星光暗色，完整覆盖所有变量） ========== */
:host(.dark) {
    /* 竹林星光 — 深邃、高级、有层次感的暗色背景 */
    --bm-primary-rgb: 130, 195, 130;
    --primary-rgb: var(--bm-primary-rgb); /* alias */
    --deep-rgb: 45, 90, 53;
    --bamboo-deep-rgb: 45, 90, 53;
    --danger-rgb: 255, 107, 107;
    --danger-alt-rgb: 255, 107, 107;
    --gold-rgb: 255, 217, 61;

/* ============================================================

   ============================================================
   Usage convention across ALL CSS files:

     @media (max-width: 480px)    → mobile       (--bp-sm, PRIMARY)

     @media (min-width: 1025px)   → wide desktop (--bp-xl-min)

     360  → 360  (kept as --bp-xxs, rare)
     400  → 480  (merged into mobile)
     420  → 360  (tiny-phone fallback)
     480  → 480  (PRIMARY mobile breakpoint)
     500  → 480  (merged into mobile)
     560  → 480  (merged into mobile)
     600  → 600  (kept as --bp-md-narrow, wallet/shop modal only)
     700  → 768  (merged into tablet)
     768  → 768  (PRIMARY tablet breakpoint)
     960  → 768  (merged into tablet)
     961+ → 1025+ (wide desktop)

       cannot use custom properties, so use the literal pixel values above
       in @media conditions consistently across all files). */

    --bp-sm: 480px;        /* PRIMARY mobile breakpoint */
    --bp-md-narrow: 600px; /* wallet/shop modal only — do NOT use for general layout */
    --bp-md: 768px;        /* PRIMARY tablet breakpoint */
    --bp-lg: 1024px;       /* standard desktop breakpoint */
    --bp-xl-min: 1025px;   /* min for wide desktop */

    /* Canonical breakpoint aliases — Task 6 responsive breakpoint system */

    --bm-bp-md: 768px;     /* tablet / narrow Obsidian sidebar */
    --bm-bp-lg: 1024px;    /* desktop */

    --type-base: calc(clamp(13px, 2.8vw, 15px) * var(--font-size-scale));      /* primary :host text */
    --type-md: calc(clamp(14px, 3.2vw, 17px) * var(--font-size-scale));        /* interactive, buttons, section titles */
    --type-lg: calc(clamp(15px, 3.8vw, 20px) * var(--font-size-scale));        /* subtitles */
    --type-xl: calc(clamp(18px, 4.8vw, 24px) * var(--font-size-scale));        /* smaller headings */
    --type-2xl: calc(clamp(20px, 5.5vw, 28px) * var(--font-size-scale));       /* main h1 / hero title */
    --type-display: calc(clamp(24px, 7vw, 36px) * var(--font-size-scale));     /* hero numbers, display */

       Use these instead of `font-size: XXpx` anywhere a fixed pixel size is used

    --type-micro:   calc(clamp(9px, 2.0vw, 11px) * var(--font-size-scale));
    --type-caption: calc(clamp(11px, 2.4vw, 13px) * var(--font-size-scale));

    display: inline-flex;
    align-items: center;
    transition: top 0.15s ease-out;
}
.skip-link:focus-visible {
    top: 8px;
    outline: 3px solid var(--white);
    outline-offset: 2px;
    box-shadow: 0 0 0 6px var(--bamboo-deep);
}

:focus-visible {
    outline: 2px solid var(--bamboo-primary);
    outline-offset: 3px;
    box-shadow: var(--focus-ring-offset);
}

/* 裸标签 focus-visible 降为 0 权重默认值，组件级焦点环可轻松覆写 */
:where(button:focus-visible, a:focus-visible) {
    outline: 2px solid var(--bamboo-primary);
    outline-offset: 3px;
    box-shadow: var(--focus-ring-offset);
}

:focus:not(:focus-visible) {
    outline: none;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* === 滚动行为优化 === */
:host {
    scroll-behavior: smooth;
    /* 隐藏滚动条 — 保留滚动功能，仅视觉隐藏 */
    -ms-overflow-style: none;
    scrollbar-width: none;
}
:host::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

/* === 主题切换过渡 — 限定在需要平滑过渡的组件级元素，避免 :host * 全局性能开销 === */
.container,
.header,
.date-nav,
.bamboo-card,
.goal-row,
.kpi-card,
.section-title,
.bamboo-garden-section,
.timeline-entry,
.todo-item,
.fab-action-btn,
[class*="-card"],
[class*="-section"],
[class*="-panel"] {
    transition: 
        background-color var(--transition-smooth),
        color var(--transition-smooth),
        border-color var(--transition-smooth),
        box-shadow var(--transition-smooth);
}

/* 排除不需要过渡的元素 */
.modal-overlay,
.modal-content,
.fab-container,
.toast-container,
.loading::after {
    transition: none;
}
.fab-actions,
.fab-action-btn,
.fab-main,
.fab-main-icon {
    transition: transform, opacity, box-shadow, border-color, background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === 性能优化：全局动画控制 === */
:host(.animations-paused) *,
:host(.animations-paused) *::before,
:host(.animations-paused) *::after {
    animation-play-state: paused;
}

/* 离屏动效容器暂停 - 替代逐元素 style 设置 */
.effect-offscreen,
.effect-offscreen *,
.effect-offscreen *::before,
.effect-offscreen *::after {
    animation-play-state: paused;
}

:host {
    font-family: var(--font-family);
    font-size: var(--type-base);
    line-height: var(--line-height-base);
    color: var(--text-primary);
    min-height: var(--viewport-height);
    padding: 0;
    margin: 0;
    overflow-x: hidden;
    /* 隔离滚动边界：滚动到主容器顶部/底部时不把滚动传递给 Obsidian 宿主页面（scroll chaining） */
    overscroll-behavior-y: contain;
    /* 隐藏滚动条 — 保留滚动功能，仅视觉隐藏 */
    -ms-overflow-style: none;
    scrollbar-width: none;
}

/* 整页页面级渐变背景：用固定定位的 ::after 承载，而非 :host 的 background +
   background-attachment: fixed。后者在 shadow 滚动容器（host 同时 position:fixed
   且 overflow-y:auto）下于部分 webview 不绘制，导致暗色模式直接透出白底。
   position:fixed 的伪元素背景可稳定绘制，且视觉上同样铺满视口、不随内容滚动。 */
:host::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background: linear-gradient(165deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid1) 20%, var(--bg-gradient-mid2) 40%, var(--bg-gradient-mid1) 60%, var(--bg-gradient-end) 80%, var(--bg-gradient-start) 100%);
}


:host::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

#main-container {
    width: 100%;
    min-height: var(--viewport-height);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px var(--space-6);
    box-sizing: border-box;
}

:host::before {
    content: '';
    position: fixed;
    inset: 0;
    /* 重新设计的光影：多层漫反射效果 */
    background: 
        radial-gradient(circle at 10% 10%, rgba(var(--white-rgb), 0.8) 0%, transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(var(--primary-rgb), 0.05) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(var(--white-rgb), 0.5) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(var(--pale-rgb), 0.1) 0%, transparent 40%);
    opacity: 0.8;
    pointer-events: none;
    z-index: -1;
}

/* 黑暗模式下重新设计高级感光影 - 增加亮度与对比度 */
:host(.dark.bamboo-immortals-root)::before {
    display: block;
    background: 
        radial-gradient(circle at 50% 0%, rgba(var(--primary-rgb), 0.18) 0%, transparent 55%),
        radial-gradient(circle at 20% 25%, rgba(var(--primary-rgb), 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 15%, rgba(var(--primary-rgb), 0.06) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 85%, rgba(var(--deep-rgb), 0.22) 0%, transparent 70%);
    opacity: 0.85;
}

@media (prefers-reduced-motion: no-preference) {
    :host::before {
        animation: bgFloat 20s ease-in-out infinite;
    }
}

@keyframes bgFloat {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.6; }
}

:host(.motion-reduced) * { animation: none; transition: none; }

@media (prefers-reduced-motion: reduce) {
    :host(.motion-reduced) *,
    :host(.motion-reduced) *::before,
    :host(.motion-reduced) *::after {
        animation-duration: 0.01ms;
        animation-iteration-count: 1;
        transition-duration: 0.01ms;
        scroll-behavior: auto;
    }

    .breathePink, .breatheSky, .heartbeat {
        animation: none;
    }

    .empty-state::before {
        animation: none;
        opacity: 0;
    }

    .onboarding-highlight {
        animation: none;
        box-shadow: 0 0 0 9999px rgba(var(--black-rgb), 0.7);
    }

    .fadeInUp, .slideUp, .fadeIn {
        animation: none;
        opacity: 1;
        transform: none;
    }

    .loading-spinner::before {
        animation: none;
        border-color: rgba(var(--primary-rgb), 0.3);
        border-top-color: var(--bamboo-primary);
    }

    .chart-canvas {
        transition: none;
    }

    .fab-main, .fab-action-btn {
        transition: none;
    }

    .modal-overlay, .modal-content {
        transition: none;
    }
}

:host(.loading) .container { opacity: 0; }
.container { transition: opacity 0.3s ease; }

@media print {
    :host { background: var(--white); }
    .fab-container { display: none; }
    .period-content.collapsed { max-height: none; opacity: 1; display: block; }
    /* 隐藏字体行的显示逻辑由非打印态控制，打印时直接跳过；移除 !important 对 inline style 的覆盖 */
}

.container {
    width: 95%;
    max-width: min(100% - 2rem, var(--content-max));
    margin: 0 auto;
    background: var(--card-glass);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    /* translateZ(0) 强制 GPU 合成层，避免 Chromium 暗色模式 backdrop-filter 伪影 */
    transform: translateZ(0);
    border-radius: var(--radius-3xl);
    padding: var(--space-7) var(--space-6);
    box-shadow: var(--shadow);
    position: relative;
    word-wrap: break-word;
    overflow-wrap: break-word;
    border: 1px solid rgba(var(--white-rgb), 0.3);
}

/* === 性能优化：动画元素 GPU 合成层提示 ===
 * will-change 白名单策略（UI Audit 4.2.3）：禁止在静态组件上常驻 will-change。
 * 仅在动画活跃态声明 —— :hover / .expanded（components-interaction.css、goals-map.css）
 * 或 date-transitioning / date-enter（本文件日期切换动画，类名由 renderScheduler
 * 在动画前后添加/移除）。动画结束 → 类名移除 → will-change 随之失效，合成层释放。
 * contain: layout style 为廉价 containment，常驻安全，予以保留。 */
.bamboo-node,
.goal-row,
section[data-section-id] {
    contain: layout style;
}

/* === 精细化骨架屏 === */
.skeleton-section {
    background: var(--card-glass);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-radius: var(--radius-2xl);
    padding: var(--space-4);
    margin-bottom: var(--space-4);
    border: 1px solid var(--card-border);
    opacity: 0;
    transform: translateY(12px);
    animation: skeletonFadeIn 0.5s ease forwards;
}

.skeleton-section:nth-child(1) { animation-delay: 0.05s; }
.skeleton-section:nth-child(2) { animation-delay: 0.12s; }
.skeleton-section:nth-child(3) { animation-delay: 0.19s; }
.skeleton-section:nth-child(4) { animation-delay: 0.26s; }

@keyframes skeletonFadeIn {
    to { opacity: 1; transform: translateY(0); }
}

/* === 玻璃拟态 fallback：backdrop-filter 不被支持或背景过透时使用不透明底色 ===
   保持玻璃效果在受支持浏览器下不变；仅在 @supports not 时切换，避免文字透底导致对比度不足。 */
@supports not (backdrop-filter: blur(1px)) {
    .container,
    .bamboo-card,
    .modal-content,
    .skeleton-section {
        background: var(--card-bg-fallback);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
    }
}

.skeleton-header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-3);
}

.skeleton-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-lg);
    background: linear-gradient(90deg, var(--card-border) 25%, rgba(var(--primary-rgb), 0.1) 50%, var(--card-border) 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.5s infinite;
}

.skeleton-title-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.skeleton-line {
    height: 14px;
    border-radius: var(--radius-md);
    background: linear-gradient(90deg, var(--card-border) 25%, rgba(var(--primary-rgb), 0.08) 50%, var(--card-border) 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.5s infinite;
}

.skeleton-line.short { width: 40%; }
.skeleton-line.medium { width: 70%; }
.skeleton-line.long { width: 100%; }

.skeleton-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: var(--space-2);
    border-top: 1px solid var(--card-border);
}

.skeleton-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
}

.skeleton-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--card-border);
    flex-shrink: 0;
}

@keyframes skeletonShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* === 渐进渲染占位（UI Audit 4.5.1）===
   firstPaintProgressive 第二帧才渲染的区块（goals 等）在第一帧插入占位元素，
   预留 min-height 避免布局抖动（CLS）；第二帧 _doPartialRender 用真实 section 替换。
   视觉沿用骨架屏 shimmer，保持加载态连贯。 */
.section-placeholder {
    min-height: var(--bm-placeholder-min-h, 160px);
    margin-bottom: var(--space-4);
    border-radius: var(--radius-2xl);
    border: 1px solid var(--card-border);
    background: var(--card-glass);
    -webkit-backdrop-filter: blur(var(--glass-blur));
    backdrop-filter: blur(var(--glass-blur));
    position: relative;
    overflow: hidden;
}

.section-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 25%, rgba(var(--bm-primary-rgb), 0.06) 50%, transparent 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.5s infinite;
}

@media (prefers-reduced-motion: reduce) {
    .section-placeholder::before {
        animation: none;
        display: none;
    }
}

/* === 日期切换过渡动画 === */
#sectionsContainer {
    position: relative;
}

#sectionsContainer.date-transitioning section[data-section-id] {
    will-change: transform, opacity;
    animation: sectionSlideOutLeft 0.22s ease forwards;
    animation-delay: calc(var(--section-index, 0) * 0.03s);
}

#sectionsContainer.date-transitioning.next section[data-section-id] {
    animation-name: sectionSlideOutLeft;
}

#sectionsContainer.date-transitioning.prev section[data-section-id] {
    animation-name: sectionSlideOutRight;
}

@keyframes sectionSlideOutLeft {
    to {
        opacity: 0;
        transform: translateX(-18px);
    }
}

@keyframes sectionSlideOutRight {
    to {
        opacity: 0;
        transform: translateX(18px);
    }
}

#sectionsContainer.date-enter section[data-section-id] {
    will-change: transform, opacity;
    opacity: 0;
    animation: sectionSlideInFromRight 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    animation-delay: calc(var(--section-index, 0) * 0.05s);
}

#sectionsContainer.date-enter.next section[data-section-id] {
    animation-name: sectionSlideInFromRight;
}

#sectionsContainer.date-enter.prev section[data-section-id] {
    animation-name: sectionSlideInFromLeft;
}

@keyframes sectionSlideInFromRight {
    from {
        opacity: 0;
        transform: translateX(20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes sectionSlideInFromLeft {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

section[data-section-id] {
    --section-index: 0;
}

section[data-section-id]:nth-child(1) { --section-index: 0; }
section[data-section-id]:nth-child(2) { --section-index: 1; }
section[data-section-id]:nth-child(3) { --section-index: 2; }
section[data-section-id]:nth-child(4) { --section-index: 3; }
section[data-section-id]:nth-child(5) { --section-index: 4; }
section[data-section-id]:nth-child(6) { --section-index: 5; }
section[data-section-id]:nth-child(7) { --section-index: 6; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-6);
    flex-wrap: wrap;
    gap: var(--space-3);
    min-height: 24px;
}
.header-left {
    flex: 1 1 200px;
    min-width: 0;
    display: flex;
    align-items: center;
}
.header-right {
    flex: 1 1 200px;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--space-3);
}
h1 {
    font-size: var(--type-2xl);
    color: var(--bamboo-light);
    font-weight: 700;
    letter-spacing: 0.05em;
}
.subtitle {
    font-size: var(--type-xs);
    color: var(--text-secondary);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: var(--space-1);
}

/* ============================================================
   RESPONSIVE — Canonical breakpoints
   NOTE: @media conditions use literal pixel values (CSS does not
   permit custom properties inside @media conditions).
   Keep these in sync with variables.css:
     ≤480px  → mobile
     ≤768px  → tablet / narrow Obsidian sidebar
     ≤1024px → small desktop
     ≥1025px → wide desktop
     ≤360px  → tiny phone (rare, emergency only)
   ============================================================ */

/* Touch targets — global minimum for ALL sizes (WCAG 2.5.8).
   Mobile rule below bumps to comfortable 48px on small screens.
   裸标签（button/a/input/select/textarea）用 :where() 降为 0 权重默认值，
   组件类（.fab-action-btn 等）保持原权重；任一组件类均可无竞赛覆写最小触控尺寸。 */
:where(button,
[role="button"],
a,
input,
select,
textarea),
.fab-action-btn,
.quick-nav-btn,
.goal-row-main,
.goal-row,
.bamboo-card,
.bamboo-card-header,
.todo-item-action,
.section-title,
.section-toggle,
.date-nav-btn,
.edit-btn,
.view-toggle-btn,
.wallet-action,
.history-close,
.modal-close,
.tooltip-close,
.kpi-card,
.history-item,
.empty-state-card,
.expand-btn {
    min-height: var(--touch-target);
    min-width: var(--touch-target);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* 伪元素扩展热区：固定小尺寸且布局敏感的交互元素保持视觉尺寸不变 */
.touch-target-sm,
.flip-stub-btn,
.drp-close-btn,
.drp-nav-btn,
.display-panel-close,
.sm-btn,
.view-toggle-btn-sm,
.shop-history-arrow {
    position: relative;
}
.touch-target-sm::before,
.flip-stub-btn::before,
.drp-close-btn::before,
.drp-nav-btn::before,
.display-panel-close::before,
.sm-btn::before,
.view-toggle-btn-sm::before,
.shop-history-arrow::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--touch-target);
    height: var(--touch-target);
    transform: translate(-50%, -50%);
}

/* === MOBILE (≤480px): phone in portrait, tiny Obsidian sidebar === */
@media (max-width: 480px) {
    /* Larger comfortable touch targets on mobile */
    :where(button,
    [role="button"]),
    .fab-action-btn {
        min-height: var(--touch-comfortable);
        min-width: var(--touch-comfortable);
    }

    /* Minimum card heights for reliable tap */
    .bamboo-card {
        min-height: 88px;
    }

    /* Body & container: tighter padding, smaller radii */
    :host {
        padding: var(--space-4) var(--space-3);
    }

    #main-container {
        padding: var(--space-4) var(--space-3);
    }

    .container {
        padding: var(--fluid-gutter);
        border-radius: var(--radius-2xl);
        width: 100%;
        max-width: 100%;
    }

    /* Header: stacked on mobile instead of inline */
    .header {
        flex-direction: column;
        align-items: stretch;
        gap: var(--fluid-stack);
    }
    .header-left {
        justify-content: flex-start;
        flex: 0 0 auto;
    }
    .header-right {
        justify-content: flex-start;
        flex: 0 0 auto;
    }

    /* Date nav: compact gap + sizing */
    .date-nav-center {
        gap: 6px;
    }
    .date-display-main {
        font-size: var(--type-md);
    }
}

/* === TABLET / NARROW SIDEBAR (≤768px)
   Rules here ALSO apply to ≤480px due to cascade. */
@media (max-width: 768px) {
    #main-container {
        padding: 24px var(--space-4);
    }

    .bamboo-card-header {
        padding: var(--space-4) var(--space-5);
    }

    /* Ensure text doesn't overflow card edges */
    .ticket-body,
    .goal-row-main,
    .timeline-entry {
        overflow-wrap: anywhere;
        word-break: break-word;
    }
}


/* === WIDE DESKTOP (≥1025px): ensure comfortable reading width === */
@media (min-width: 1025px) {
    .container {
        max-width: min(100% - 2rem, var(--content-max-wide));
    }
}

/* === TINY VIEWPORT (≤360px): Obsidian 窄侧边栏 / 最小手机。
   紧急压缩层。避免视觉破坏 — 它应该只是 ≤480px 设计的紧凑版本。
   目标：ZERO 水平滚动。 */
@media (max-width: 360px) {
    :host {
        padding: var(--space-2) var(--space-1);
    }

    .container {
        padding: var(--space-3) var(--space-2);
        border-radius: var(--radius-xl);
        max-width: 100%;
        width: 100%;
    }

    /* 头部：紧凑堆叠 */
    .header {
        gap: var(--space-2);
    }

    /* 票根时间数值：再紧凑一点 */
    .ticket-time-value {
        font-size: var(--type-lg);
    }

    /* 日期导航：更小的间距 */
    .date-nav {
        gap: var(--space-1);
    }
    .date-nav-btn {
        padding: 6px;
        min-height: var(--touch-comfortable);
    }
    .date-display-main {
        font-size: var(--type-sm);
    }

    /* 段标题：更紧凑 */
    .section-title {
        font-size: var(--type-sm);
        padding: 6px 10px;
        min-height: var(--touch-comfortable);
    }
}

/* 防止iOS上的高亮 */
* {
    -webkit-tap-highlight-color: transparent;
}

/* === 装饰性 Emoji 隐藏于屏幕阅读器 === */
.emoji-decorative {
    font-style: normal;
}

.emoji-decorative::before {
    content: attr(data-emoji);
}

[aria-label*="查看成就"] .emoji-decorative::before { 
    content: '';
    display: inline-block;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: var(--space-2);
    padding: 20px 8px 8px;
    position: relative;
    z-index: 2;
    pointer-events: none;
}

.ticket-stub-content > * {
    pointer-events: none;
}

.ticket-stub-title-box {
    pointer-events: auto;
    cursor: pointer;
    background: var(--glass-card-gradient);
    /* backdrop-filter 由父 .designer-ticket 提供 */
    border-radius: var(--radius-md);
    padding: 14px 12px;
    text-align: center;
    border: 1px solid rgba(var(--white-rgb), 0.35);
    width: min(120px, 33vw);
    min-height: 70px;
    height: auto;
    box-shadow: 
        0 4px 16px rgba(var(--bamboo-deep-rgb),0.15),
        inset 0 2px 0 rgba(var(--white-rgb), 0.5),
        inset 0 -2px 0 rgba(var(--bamboo-deep-rgb),0.12),
        inset 2px 0 0 rgba(var(--white-rgb), 0.2),
        inset -2px 0 0 rgba(var(--white-rgb), 0.2);
    position: relative;
    z-index: 100;
    overflow: hidden;
}

.ticket-stub-title-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 60%;
    background: linear-gradient(180deg, rgba(var(--white-rgb), 0.2) 0%, transparent 100%);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    pointer-events: none;
}

.ticket-stub-title-box::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 2px,
            rgba(var(--white-rgb), 0.04) 2px,
            rgba(var(--white-rgb), 0.04) 4px
        );
    border-radius: var(--radius-lg);
    pointer-events: none;
}

.stub-title-cn {
    font-size: var(--type-md);
    font-weight: 800;
    color: var(--bamboo-deep);
    letter-spacing: 3px;
    line-height: 1.3;
}

.stub-title-en {
    font-size: var(--type-mini);
    color: rgba(var(--bamboo-deep-rgb), 0.55);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
}

.ticket-stub-date {
    font-size: var(--type-mini);
    color: rgba(var(--bamboo-deep-rgb), 0.55);
    letter-spacing: 1px;
    text-align: center;
}

.ticket-slogan {
    font-size: var(--type-mini);
    color: rgba(var(--bamboo-deep-rgb), 0.4);
    letter-spacing: 4px;
    text-align: center;
    font-weight: 400;
    flex-shrink: 0;
}

.ticket-decorations {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
}

.ticket-decoration {
    flex: 1;
    height: 40px;
    position: relative;
    display: flex;
    align-items: center;
}

.ticket-decoration.left {
    justify-content: flex-start;
    height: auto;
    flex: 0 0 auto;
    width: auto;
}

.ticket-decoration.right {
    justify-content: flex-end;
    height: auto;
    flex: 0 0 auto;
    width: auto;
}

.ticket-decoration::before,
.ticket-decoration::after {
    display: none;
}

.ticket-decoration.left::before,
.ticket-decoration.right::before {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(var(--bamboo-deep-rgb), 0.25);
    position: relative;
}

.ticket-decoration.left::before {
    margin-left: 20px;
    box-shadow: 
        16px 0 0 rgba(var(--bamboo-deep-rgb), 0.15),
        32px 0 0 rgba(var(--bamboo-deep-rgb), 0.1);
}

.ticket-decoration.right::before {
    margin-right: 20px;
    box-shadow: 
        -16px 0 0 rgba(var(--bamboo-deep-rgb), 0.15),
        -32px 0 0 rgba(var(--bamboo-deep-rgb), 0.1);
}

@media (prefers-reduced-motion: no-preference) {
    .ticket-highlight-value {
        animation: glowPulse 2s ease-in-out infinite;
    }
}

@keyframes glowPulse {
    0%, 100% {
        text-shadow: 0 0 20px rgba(var(--primary-rgb), 0.4);
    }
    50% {
        text-shadow: 0 0 30px rgba(var(--primary-rgb), 0.7), 0 0 50px rgba(var(--primary-rgb), 0.3);
    }
}


/* ========== 星光竹林暗色模式 ========== */

/* --- 文字色彩 --- */
:host(.dark) .ticket-time-name              { color: var(--ink-light); }
:host(.dark) .ticket-time-value             { color: var(--bamboo-pale-hover); }
:host(.dark) .ticket-highlight-label        { color: var(--ink-medium); }
:host(.dark) .ticket-highlight-value        { color: var(--bamboo-light); text-shadow: 0 0 12px rgba(var(--primary-rgb), 0.3); }
:host(.dark) .stub-title-cn                 { color: var(--bamboo-pale-hover); }
:host(.dark) .stub-title-en                 { color: var(--ink-light); }
:host(.dark) .ticket-slogan                 { color: var(--ink-light); }
:host(.dark) .ticket-stub-date              { color: var(--ink-light); }

/* --- 票体背景与边框 --- */
:host(.dark) .ticket-highlight {
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.1) 0%, rgba(var(--primary-rgb),0.04) 100%),
                linear-gradient(45deg, rgba(var(--deep-rgb), 0.12) 0%, transparent 60%);
    border: 1px solid rgba(var(--primary-rgb), 0.2);
    box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.1);
}
:host(.dark) .designer-ticket {
    background: rgba(var(--primary-rgb), 0.06);
    border-color: rgba(var(--primary-rgb), 0.12);
}
:host(.dark) .ticket-main::before {
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.12) 0%, rgba(var(--primary-rgb),0.04) 50%, rgba(var(--primary-rgb),0.08) 100%),
                linear-gradient(45deg, rgba(var(--deep-rgb), 0.12) 0%, transparent 60%);
    box-shadow: 0 4px 20px rgba(var(--black-rgb), 0.3),
                inset 0 2px 0 rgba(var(--primary-rgb),0.2),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.2),
                inset 2px 0 0 rgba(var(--primary-rgb),0.12),
                inset -2px 0 0 rgba(var(--primary-rgb),0.12);
}
:host(.dark) .ticket-stub {
    background: rgba(var(--primary-rgb), 0.15);
    border-left-color: rgba(var(--primary-rgb), 0.25);
    box-shadow: inset 1px 0 0 rgba(var(--primary-rgb),0.15);
}
:host(.dark) .ticket-stub-title-box {
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.15) 0%, rgba(var(--primary-rgb),0.06) 50%, rgba(var(--primary-rgb),0.1) 100%),
                linear-gradient(45deg, rgba(var(--deep-rgb), 0.12) 0%, transparent 60%);
    box-shadow: 0 4px 16px rgba(var(--black-rgb), 0.2),
                inset 0 2px 0 rgba(var(--primary-rgb),0.2),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.15),
                inset 2px 0 0 rgba(var(--primary-rgb),0.12),
                inset -2px 0 0 rgba(var(--primary-rgb),0.12);
}
:host(.dark) .ticket-stub-title-box:hover {
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.22) 0%, rgba(var(--primary-rgb),0.1) 50%, rgba(var(--primary-rgb),0.16) 100%),
                linear-gradient(45deg, rgba(var(--deep-rgb), 0.12) 0%, transparent 60%);
    box-shadow: 0 4px 16px rgba(var(--black-rgb), 0.3),
                inset 0 2px 0 rgba(var(--primary-rgb),0.3),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.2),
                inset 2px 0 0 rgba(var(--primary-rgb),0.2),
                inset -2px 0 0 rgba(var(--primary-rgb),0.2);
}

/* --- 装饰 --- */
:host(.dark) .ticket-decoration.left::before {
    background: rgba(var(--primary-rgb), 0.5);
    box-shadow: 16px 0 0 rgba(var(--primary-rgb), 0.35), 32px 0 0 rgba(var(--primary-rgb), 0.2);
}
:host(.dark) .ticket-decoration.right::before {
    background: rgba(var(--primary-rgb), 0.5);
    box-shadow: -16px 0 0 rgba(var(--primary-rgb), 0.35), -32px 0 0 rgba(var(--primary-rgb), 0.2);
}

/* --- 高级克制光效 --- */
:host(.dark) .designer-ticket {
    -webkit-mask-image: radial-gradient(circle 12px at 68% 0, transparent 100%, black 100%),
                        radial-gradient(circle 12px at 68% 100%, transparent 100%, black 100%);
    -webkit-mask-composite: source-in;
    mask-image: radial-gradient(circle 12px at 68% 0, transparent 100%, black 100%),
                radial-gradient(circle 12px at 68% 100%, transparent 100%, black 100%);
    mask-composite: intersect;
    box-shadow: 0 0 50px rgba(var(--primary-rgb), 0.1),
                0 0 100px rgba(var(--primary-rgb), 0.05),
                0 8px 32px rgba(var(--black-rgb), 0.4),
                inset 0 1px 0 rgba(var(--white-rgb), 0.1);
}
:host(.dark) .ticket-main { min-height: 120px; }
:host(.dark) .designer-ticket::after {
    background: linear-gradient(90deg, transparent 0%, rgba(var(--primary-rgb),0.05) 30%, rgba(var(--primary-rgb),0.1) 50%, rgba(var(--primary-rgb),0.05) 70%, transparent 100%);
}
:host(.dark) .ticket-main::before {
    box-shadow: 0 4px 20px rgba(var(--black-rgb), 0.3),
                inset 0 2px 0 rgba(var(--primary-rgb),0.2),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.2),
                inset 2px 0 0 rgba(var(--primary-rgb),0.12),
                inset -2px 0 0 rgba(var(--primary-rgb),0.12),
                0 0 40px rgba(var(--primary-rgb), 0.08);
}
:host(.dark) .ticket-stub {
    box-shadow: inset 1px 0 0 rgba(var(--primary-rgb),0.15),
                inset 0 0 25px rgba(var(--primary-rgb), 0.06);
}
:host(.dark) .ticket-stub-title-box {
    box-shadow: 0 4px 16px rgba(var(--black-rgb), 0.2),
                inset 0 2px 0 rgba(var(--primary-rgb),0.2),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.15),
                inset 2px 0 0 rgba(var(--primary-rgb),0.12),
                inset -2px 0 0 rgba(var(--primary-rgb),0.12),
                0 0 25px rgba(var(--primary-rgb), 0.08);
}
:host(.dark) .ticket-highlight {
    box-shadow: 0 0 25px rgba(var(--primary-rgb), 0.15),
                0 0 50px rgba(var(--primary-rgb), 0.08),
                0 4px 16px rgba(var(--black-rgb), 0.2),
                inset 0 2px 0 rgba(var(--primary-rgb),0.25),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.15);
}

/* --- 活跃度点阵 --- */
:host(.dark) .ticket-dot { background: rgba(var(--primary-rgb), 0.1); box-shadow: inset 0 1px 2px rgba(var(--black-rgb), 0.15); }
:host(.dark) .ticket-dot.has-data { background: rgb(var(--primary-rgb)); box-shadow: inset 0 1px 2px rgba(var(--black-rgb), 0.1), 0 0 4px rgba(var(--primary-rgb), 0.35); }
:host(.dark) .ticket-dot.current { background: var(--bamboo-light); box-shadow: inset 0 1px 2px rgba(var(--black-rgb), 0.1), 0 0 6px rgba(var(--primary-rgb), 0.45); }
:host(.dark) .ticket-dot::after {
    color: var(--bamboo-pale-hover);
    background: rgba(var(--surface-deep-rgb), 0.92);
    border-color: rgba(var(--primary-rgb), 0.12);
    box-shadow: 0 2px 8px rgba(var(--black-rgb), 0.4);
}

/* --- 翻转按钮 --- */
:host(.dark) .flip-stub-btn { color: rgba(var(--primary-rgb), 0.35); }
:host(.dark) .flip-stub-btn:hover { color: var(--bamboo-pale-highlight); background: rgba(var(--primary-rgb), 0.12); }

/* --- 背面面板 --- */
:host(.dark) .stub-back-title-box {
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.15) 0%, rgba(var(--primary-rgb),0.06) 50%, rgba(var(--primary-rgb),0.1) 100%),
                linear-gradient(45deg, rgba(var(--deep-rgb), 0.12) 0%, transparent 60%);
    box-shadow: 0 4px 16px rgba(var(--black-rgb), 0.2),
                inset 0 2px 0 rgba(var(--primary-rgb),0.2),
                inset 0 -2px 0 rgba(var(--primary-rgb), 0.15),
                inset 2px 0 0 rgba(var(--primary-rgb),0.12),
                inset -2px 0 0 rgba(var(--primary-rgb),0.12);
}
:host(.dark) .stub-back-divider { background: rgba(var(--primary-rgb), 0.1); }
:host(.dark) .stub-back-stat svg { color: rgba(var(--primary-rgb), 0.4); }
:host(.dark) .stub-back-ring { background: conic-gradient(rgb(var(--primary-rgb)) 0deg, rgb(var(--primary-rgb)) calc(var(--ring-pct) * 3.6deg), rgba(var(--primary-rgb),0.08) calc(var(--ring-pct) * 3.6deg)); }
:host(.dark) .stub-back-ring-text { color: var(--bamboo-pale-highlight); }
:host(.dark) .stub-back-caption { color: rgba(var(--bamboo-pale-highlight-rgb), 0.5); }
:host(.dark) .stub-back-stat-value { color: rgba(var(--bamboo-pale-hover-rgb), 0.65); }


/* ========== 暗色模式 — 动画 ========== */

/* 减少动画偏好适配 */
@media (prefers-reduced-motion: reduce) {
    :host(.dark) .designer-ticket::after,
    :host(.dark) .ticket-highlight {
        animation: none;
    }
}

.timeline-bamboo-path { position: relative; padding-left: 40px; }
.timeline-bamboo-path::before {
    content: '';
    position: absolute;
    left: 19px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: repeating-linear-gradient(to bottom, var(--bamboo-primary) 0px, var(--bamboo-primary) 8px, transparent 8px, transparent 16px);
    opacity: 0.4;
    border-radius: var(--radius-3xs);
}

.bamboo-node {
    position: relative;
    margin-bottom: var(--space-4);
}

@media (prefers-reduced-motion: no-preference) {
    .bamboo-node {
        animation: fadeInUp 0.5s ease forwards;
        opacity: 0;
    }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.bamboo-node:nth-child(1) { animation-delay: 0.1s; }
.bamboo-node:nth-child(2) { animation-delay: 0.2s; }
.bamboo-node:nth-child(3) { animation-delay: 0.3s; }
.bamboo-node:nth-child(4) { animation-delay: 0.4s; }
.bamboo-node:nth-child(5) { animation-delay: 0.5s; }
.bamboo-node::before {
    content: '';
    position: absolute;
    left: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: linear-gradient(135deg, var(--bamboo-light), var(--bamboo-primary));
    border-radius: 50%;
    border: 2px solid var(--card-bg);
    box-shadow: 0 0 0 2px var(--bamboo-pale), 0 2px 6px rgba(var(--primary-rgb), 0.3);
    z-index: 2;
    margin-left: 13px;
}
.bamboo-node.focus-now::before {
    box-shadow: 0 0 0 2px var(--bamboo-primary), 0 0 16px rgba(var(--primary-rgb), 0.5);
}

@media (prefers-reduced-motion: no-preference) {
    .bamboo-node.focus-now::before {
        animation: nodeGlow 2s ease-in-out infinite;
    }
}

@keyframes nodeGlow {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-50%) scale(1.1); }
}

.bamboo-card {
    background: var(--card-bg);
    backdrop-filter: blur(var(--glass-blur));
    border-radius: var(--radius-card);
    overflow: clip; /* 允许 tooltip/focus ring 溢出，仅裁切子元素几何溢出 */
    transition: transform, opacity, box-shadow, border-color, background-color 0.3s ease;
    box-shadow: var(--shadow-surface);
}
.bamboo-card:hover { transform: translateX(8px); box-shadow: var(--shadow-card); }
.bamboo-card-header {
    padding: var(--space-3) var(--space-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    min-height: var(--touch-target);
    /* backdrop-filter 由父 .bamboo-card 提供 */
    border-bottom: 1px solid rgba(var(--white-rgb), 0.28);
    overflow: hidden;
}

.bamboo-card-header::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(var(--white-rgb), 0.18) 0%, transparent 55%);
    pointer-events: none;
}

.bamboo-left {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.bamboo-info {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 36px;
}

.bamboo-right {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex-shrink: 0;
}

.bamboo-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 1px 2px rgba(var(--black-rgb), 0.08));
    flex-shrink: 0;
    color: var(--bamboo-deep);
}

.bamboo-title {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.bamboo-name {
    font-size: var(--type-base);
    font-weight: 700;
    color: var(--bamboo-deep);
}

.bamboo-time {
    font-size: var(--type-xs);
    color: var(--bamboo-dark);
    opacity: 0.75;
}

.bamboo-count {
    font-size: var(--type-xs);
    font-weight: 600;
    color: var(--bamboo-primary);
    background: rgba(var(--primary-rgb), 0.06);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(var(--primary-rgb), 0.15);
    min-width: min(22px, 6vw);
    text-align: center;
    line-height: 1.2;
    opacity: 0.7;
    cursor: default;
}

.bamboo-count:hover {
    opacity: 0.9;
}

.bamboo-count:empty,
.bamboo-count[data-count="0"] {
    opacity: 0.3;
}

.bamboo-chevron {
    font-size: var(--type-micro);
    color: var(--bamboo-primary);
    transition: transform 0.3s ease;
    opacity: 0.6;
}

.bamboo-chevron.collapsed {
    transform: rotate(-90deg);
}

/* === 竹林色阶 — 九段时段系统渐变 === */
/* 深夜（中绿）→ 黎明 → 正午（白绿）→ 傍晚 → 深夜（中绿）*/
/* 每段纯色底色 + ::after 玻璃高光叠加，九段合为 V 形色阶 */

/* 深夜 0-4h — 中绿，色阶最深 */
.bamboo-card.lateNight .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.24);
  transition: background 0.4s ease-out;
}
/* 黎明 4-5.5h — 向白绿过渡 */
.bamboo-card.dawn .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.16);
  transition: background 0.4s ease-out;
}
/* 清晨 5.5-7h — 轻绿 */
.bamboo-card.earlyMorning .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.10);
  transition: background 0.4s ease-out;
}
/* 上午 7-12h — 微绿 */
.bamboo-card.morning .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.06);
  transition: background 0.4s ease-out;
}
/* 中午 12-13h — 白绿，色阶最淡 */
.bamboo-card.midday .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.03);
  transition: background 0.4s ease-out;
}
/* 下午 13-17h — 微绿回升 */
.bamboo-card.afternoon .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.06);
  transition: background 0.4s ease-out;
}
/* 傍晚 17-18.5h — 向中绿过渡 */
.bamboo-card.dusk .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.13);
  transition: background 0.4s ease-out;
}
/* 晚上 18.5-22h — 渐深 */
.bamboo-card.evening .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.18);
  transition: background 0.4s ease-out;
}
/* 深夜 22-24h — 中绿，回归最深 */
.bamboo-card.night .bamboo-card-header {
  background: rgba(var(--primary-rgb), 0.24);
  transition: background 0.4s ease-out;
}

/* === 悬停光晕（亮色模式）=== */
.bamboo-card.lateNight .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.32) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.24);
}
.bamboo-card.dawn .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.24) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.16);
}
.bamboo-card.earlyMorning .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.18) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.10);
}
.bamboo-card.morning .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.12) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.06);
}
.bamboo-card.midday .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.08) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.03);
}
.bamboo-card.afternoon .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.12) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.06);
}
.bamboo-card.dusk .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.20) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.13);
}
.bamboo-card.evening .bamboo-card-header:hover {
  background:
    radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(var(--primary-rgb), 0.26) 0%, transparent 60%),
    rgba(var(--primary-rgb), 0.18);
}
.bamboo-card.night .bamboo-card-header:hover {

.bamboo-eval {
    font-size: var(--type-xs);
    font-weight: 600;
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-3xl);
    white-space: nowrap;
}

.bamboo-eval.good {
    background: rgba(var(--primary-rgb), 0.15);
    color: var(--bamboo-primary);
    border: 1px solid rgba(var(--primary-rgb), 0.3);
}

.bamboo-eval.warn {
    background: rgba(var(--warning-orange-rgb), 0.12);
    color: var(--bamboo-warning);
    border: 1px solid rgba(var(--warning-orange-rgb), 0.3);
}

.bamboo-eval.bad {
    background: rgba(var(--danger-rgb), 0.12);
    color: var(--cinnabar);
    border: 1px solid rgba(var(--danger-rgb), 0.3);
}

:host(.dark) .bamboo-eval.good {
    color: var(--bamboo-light);
    background: rgba(var(--primary-rgb), 0.2);
    border-color: rgba(var(--primary-rgb), 0.4);
}

:host(.dark) .bamboo-eval.warn {
    color: rgba(var(--amber-rgb), 0.9);
    background: rgba(var(--warning-orange-rgb), 0.2);
    border-color: rgba(var(--warning-orange-rgb), 0.4);
}

:host(.dark) .bamboo-eval.bad {
    color: rgba(var(--danger-bright-rgb), 0.85);
    background: rgba(var(--danger-rgb), 0.2);
    border-color: rgba(var(--danger-rgb), 0.4);
}

/* 暗色模式：抬头元素用亮绿，与深色玻璃底色区分 */
:host(.dark) .bamboo-icon {
    color: var(--bamboo-light);
    filter: drop-shadow(0 1px 2px rgba(var(--black-rgb), 0.2));
}

:host(.dark) .bamboo-name {
    color: var(--bamboo-light);
}

:host(.dark) .bamboo-time {
    color: var(--bamboo-pale);
    opacity: 0.75;
}

:host(.dark) .bamboo-count {
    color: rgba(var(--green-bright-rgb), 0.8);
    background: rgba(var(--primary-rgb), 0.12);
    border-color: rgba(var(--primary-rgb), 0.25);
    opacity: 0.6;
}

:host(.dark) .bamboo-count:empty,
:host(.dark) .bamboo-count[data-count="0"] {
    opacity: 0.25;
}

:host(.dark) .bamboo-chevron {
    color: var(--bamboo-pale);
}

/* Custom Tooltip */
.bamboo-tooltip {
    position: fixed;
    background: var(--bamboo-primary);
    color: var(--text-on-accent);
    padding: 5px 10px;
    border-radius: var(--radius-2xs);
    font-size: var(--type-mini);
    font-weight: 400;
    white-space: nowrap;
    pointer-events: none;
    z-index: var(--z-layer-tooltip);
    line-height: 1.3;
    box-shadow: 0 3px 8px rgba(var(--black-rgb), 0.12), 0 1px 4px rgba(var(--black-rgb), 0.06);
    opacity: 0;
    transition: opacity 0.1s ease;
}

.bamboo-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--bamboo-primary);
}

:host(.dark) .bamboo-tooltip {
    background: var(--bamboo-primary);
    color: var(--text-on-accent);
}
:host(.dark) .bamboo-tooltip::after {
    border-top-color: var(--bamboo-primary);
}

.bamboo-card-content {
    max-height: 500px;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s ease;
}

.bamboo-card-content.collapsed {
    max-height: 0;
    opacity: 0;
}

.bamboo-items {
    padding: var(--space-3) var(--space-4);
    border-top: 1px dashed var(--border-light);
}

.bamboo-item {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    padding: var(--space-2) 0;
    border-bottom: 1px solid rgba(var(--primary-rgb), 0.08);
}

.bamboo-item:last-child {
    border-bottom: none;
}

.bamboo-item-time {
    font-size: var(--type-sm);
    font-weight: 600;
    color: var(--text-secondary);
    min-width: min(50px, 14vw);
    flex-shrink: 0;
}

.bamboo-item-content {
    flex: 1;
}

.bamboo-item-task {
    font-size: var(--type-base);
    color: var(--text-primary);
    line-height: 1.5;
}

.bamboo-item-eval {
    font-size: var(--type-xs);
    color: var(--bamboo-primary);
    margin-top: 3px;
    font-style: italic;
}

.bamboo-item-eval.warn {
    color: var(--bamboo-primary);
}

.bamboo-leaf {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    font-size: var(--type-md);
    opacity: 0;
    transition: opacity 0.3s;
}

.bamboo-card:hover .bamboo-leaf {
    opacity: 0.6;
}

/* =============================================
   响应式 — 票根布局
   Canonical breakpoints: 480px (mobile), 768px (tablet), 1024px (desktop)
   ============================================= */

/* ≤768px: 票体+票根上下堆叠，票根内容横向排列 */
@media (max-width: 768px) {
    .designer-ticket,
    :host(.dark) .designer-ticket,
    :host(.dark) .designer-ticket {
        flex-direction: column;
        -webkit-mask-image: none;
        -webkit-mask-composite: initial;
        mask-image: none;
        mask-composite: initial;
        border-radius: var(--radius-xl);
    }

    .ticket-main {
        flex: auto;
        width: 100%;
        padding: 20px 14px 10px;
    }

    .ticket-main::before {
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 6px;
        border-radius: var(--radius-md);
    }

    .ticket-main::after {
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .ticket-body {
        gap: 10px;
    }

    .ticket-time-value { font-size: var(--type-xl); }

    .ticket-highlight {
        width: 110px;
        height: auto;
        padding: 8px 10px;
        border-radius: var(--radius-md);
    }

    .ticket-highlight-value { font-size: var(--type-lg); }

    .ticket-highlight-label { font-size: var(--type-mini); letter-spacing: 1.5px; }

    .ticket-stub {
        flex: auto;
        width: 100%;
        border-left: none;
        border-top: none;
        box-shadow: none;
        height: auto;
        min-height: 84px;
        perspective: 1000px;
    }

    .ticket-stub.playing {
        box-shadow: 0 0 0 2px rgba(var(--primary-rgb), 0.45),
                    0 4px 20px rgba(var(--primary-rgb), 0.3);
    }

    .ticket-stub-content {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        padding: 10px 12px;
    }

    .ticket-stub-content > * { pointer-events: auto; }

    .ticket-stub-title-box {
        width: min(110px, 30vw);
        min-height: auto;
        height: auto;
        padding: 12px 8px;
        font-size: 0;
        text-align: center;
        display: block;
    }

    .stub-title-cn { display: inline; font-size: var(--type-sm); letter-spacing: 2px; line-height: 1.4; }

    .ticket-stub-date { display: block; font-size: var(--type-mini); line-height: 1.4; }

    .stub-noise-ctrl { height: auto; }

    .flip-stub-btn { top: 6px; right: 10px; }

    .ticket-flip-container {
        width: 100%;
        min-height: 84px;
    }

    .ticket-flip-container.flipped {
        transform: none;
    }

    .ticket-flip-front {
        position: relative;
        inset: auto;
        min-height: 84px;
        backface-visibility: visible;
    }

    .ticket-flip-back {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        min-height: 84px;
        backface-visibility: visible;
        transform: none;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .ticket-flip-container.flipped .ticket-flip-front {
        opacity: 0;
        pointer-events: none;
    }

    .ticket-flip-container.flipped .ticket-flip-back {
        opacity: 1;
        pointer-events: auto;
    }

    .stub-back-content {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        padding: 10px 12px;
    }

    .stub-back-title-box { width: 200px; }

    .stub-back-row { gap: var(--space-3); }

    .ticket-decorations { gap: var(--space-2); }

    .ticket-slogan { letter-spacing: 3px; }
}

/* ≤480px: 三块一行横排，紧凑字号 */
@media (max-width: 480px) {
    .ticket-main {
        padding: 14px 8px 6px;
    }

    .ticket-main::before {
        top: 6px;
        left: 6px;
        right: 6px;
        bottom: 3px;
        border-radius: var(--radius-sm);
    }

    .ticket-main::after {
        top: 6px;
        left: 6px;
        right: 6px;
    }

    .ticket-body {
        gap: 3px;
    }

    .ticket-time-block { flex: 1; }

    .ticket-end-block {
        flex-direction: row;
        justify-content: center;
        align-items: baseline;
        gap: 3px;
    }

    .ticket-time-name {
        font-size: var(--type-mini);
        margin-bottom: 0;
        letter-spacing: 0.5px;
    }

    .ticket-time-value { font-size: var(--type-lg); }

    .ticket-highlight {
        width: auto;
        height: auto;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        flex: 0 0 auto;
        animation: none;
    }

    .ticket-highlight-value { font-size: var(--type-md); }

    .ticket-highlight-label {
        font-size: var(--type-mini);
        letter-spacing: 1.5px;
    }

    .ticket-stub { min-height: 68px; }

    .ticket-flip-container { min-height: 68px; }

    .ticket-flip-front { min-height: 68px; }

    .ticket-flip-back { min-height: 68px; }

    .ticket-stub-content {
        gap: var(--space-2);
        padding: 6px 8px;
    }

    .ticket-stub-title-box {
        width: min(96px, 28vw);
        min-height: auto;
        height: auto;
        padding: 10px 4px;
        font-size: 0;
        text-align: center;
        display: block;
    }

    .stub-title-cn { display: inline; font-size: var(--type-sm); letter-spacing: 1px; line-height: 1.4; }

    .ticket-stub-date { display: block; font-size: var(--type-mini); line-height: 1.4; }

    .stub-nc-icon {
        width: 10px;
        height: 10px;
    }

    .stub-nc-name { font-size: var(--type-mini); }

    .stub-back-content {
        gap: var(--space-2);
        padding: 6px 8px;
    }

    .stub-back-title-box {
        width: min(170px, 50vw);
        padding: 5px 6px;
    }

    .stub-back-row { gap: var(--space-2); }

        width: 28px;
        height: 28px;
    }

    .stub-back-ring-text { font-size: var(--type-mini); }

    .stub-back-caption { font-size: var(--type-mini); }

    .stub-back-divider { height: 36px; }

    .stub-back-stat-value { font-size: var(--type-mini); }

    .ticket-period-dots {
        gap: 6px;
        padding: 4px 0 6px;
    }

    .ticket-decorations { gap: 6px; }

    .ticket-slogan {
        font-size: var(--type-mini);
        letter-spacing: 2px;
    }

    .ticket-decoration.left::before,
    .ticket-decoration.right::before {
        width: 6px;
        height: 6px;
    }

    .ticket-decoration.left::before {
        margin-left: 14px;
        box-shadow: 12px 0 0 rgba(var(--bamboo-deep-rgb),0.15), 24px 0 0 rgba(var(--bamboo-deep-rgb),0.1);
    }

    .ticket-decoration.right::before {
        margin-right: 14px;
        box-shadow: -12px 0 0 rgba(var(--bamboo-deep-rgb),0.15), -24px 0 0 rgba(var(--bamboo-deep-rgb),0.1);
    }

    .flip-stub-btn {
        top: 4px;
        right: 6px;
        width: 18px;
        height: 18px;
    }
}
