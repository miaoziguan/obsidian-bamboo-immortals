    cursor: pointer;
    position: relative;
    transition: transform, opacity, box-shadow, border-color, background-color 0.2s;
}
.fab-panel-tab:hover {
    color: var(--text-secondary);
}
.fab-panel-tab.active {
    color: var(--bamboo-primary);
}
.fab-panel-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--bamboo-primary);
    box-shadow: 0 -1px 4px var(--bamboo-primary-light);
}
.fab-tab-content {
    display: none;
    animation: fadeIn 0.3s ease;
}
.fab-tab-content.active {
    display: block;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========== 白噪音浮层容器 ========== */
/* 固定定位的透明浮层，避免 position:fixed 被父级 transform/overflow 影响 */
.bamboo-floating-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: var(--z-layer-overlay);
}

/* ========== 白噪音面板 ========== */
.wn-panel {
    position: absolute;
    bottom: 80px;
    right: 16px;
    width: min(300px, 92vw);
    max-height: 70vh;
    pointer-events: auto;
    background: var(--card-glass);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-radius: var(--radius-panel);
    border: 1px solid rgba(var(--white-rgb), 0.3);
    box-shadow: var(--shadow-floating);
    z-index: var(--z-layer-modal);
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px) scale(0.97);
    transition: transform, opacity, box-shadow, border-color, background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.wn-panel.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}
.wn-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
}
.wn-header-left {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--type-base);
    font-weight: 600;
    color: var(--bamboo-primary);
}
.wn-header-left svg {
    color: var(--bamboo-primary);
}
.wn-close-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: var(--space-1);
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform, opacity, box-shadow, border-color, background-color 0.2s;
}
.wn-close-btn:hover {
    background: rgba(var(--black-rgb), 0.06);
    color: var(--text-primary);
}
.wn-body {
    padding: 12px 16px 16px;
    overflow-y: auto;
    flex: 1;
    overscroll-behavior: contain;
}
.wn-section {
    margin-bottom: 8px;
}
.wn-section:last-child {
    margin-bottom: 0;
}
.wn-section-header {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--type-mini);
    font-weight: 600;
    color: var(--bamboo-primary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
    padding-left: 2px;
}
.wn-section-header svg {
    color: var(--bamboo-primary);
    opacity: 0.7;
}
.wn-type-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-1);
}
.wn-type-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 4px 4px;
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: color 0.15s, font-weight 0.15s;
    color: var(--text-secondary);
    font-size: var(--type-sm);
    font-weight: 500;
    letter-spacing: 0.3px;
}
.wn-type-btn:hover {
    color: var(--bamboo-primary);
}
.wn-type-btn.active {
    color: var(--bamboo-primary);
    font-weight: 600;
}

/* 自定义音源内容：文字在上，图标组在下 */
.wn-btn-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}
.wn-type-btn span {
    white-space: nowrap;
}
.wn-add-custom-btn {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--bamboo-primary);
    cursor: pointer;
    padding: 2px;
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: transform, opacity, box-shadow, border-color, background-color 0.2s;
}
.wn-add-custom-btn:hover {
    background: rgba(var(--primary-rgb), 0.1);
    transform: scale(1.1);
}
/* 自定义音源操作按钮组 — 内联显示，hover 时可见 */
.wn-btn-group {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s;
}
.wn-type-btn:hover .wn-btn-group {
    opacity: 1;
}
.wn-rename-btn,
.wn-delete-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 2px;
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    border-radius: var(--radius-4);
    transition: transform, opacity, box-shadow, border-color, background-color 0.15s;
    color: var(--text-faint);
}
.wn-rename-btn:hover {
    color: var(--bamboo-primary);
    background: rgba(var(--primary-rgb), 0.12);
}
.wn-delete-btn:hover {
    color: #ff4d4f;
    background: rgba(255, 77, 79, 0.12);
}

/* ========== 音量控制 ========== */
.wn-volume-section {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border-light);
}

.wn-volume-control {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: 4px 0;
}

.wn-volume-slider {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border-light);
    border-radius: var(--radius-3xs);
    cursor: pointer;
}

.wn-volume-slider:focus {
    outline: none;
}

.wn-volume-slider:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
}

.wn-volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: var(--touch-target);
    height: var(--touch-target);
    border-radius: 50%;
    background: var(--bamboo-primary);
    cursor: pointer;
    transition: transform 0.15s;
    border: 15px solid transparent;
    background-clip: padding-box;
    box-sizing: border-box;
}

.wn-volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
}

.wn-volume-slider::-moz-range-thumb {
    width: var(--touch-target);
    height: var(--touch-target);
    border-radius: 50%;
    background: var(--bamboo-primary);
    cursor: pointer;
    border: 15px solid transparent;
    background-clip: padding-box;
    box-sizing: border-box;
}

.wn-volume-label {
    font-size: var(--type-xs);
    color: var(--text-secondary);
    min-width: 32px;
    text-align: right;
}

/* ========== 定时控制 ========== */
.wn-timer-section {
    margin-top: 4px;
    padding-top: 6px;
    border-top: 1px solid var(--border-light);
}

.wn-timer-control {
    display: flex;
    align-items: center;
    gap: var(--space-1);
}

.wn-timer-btn {
    flex: 1;
    padding: 5px 8px;
    min-height: var(--touch-target);
    font-size: var(--type-sm);
    font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-5);
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color 0.15s;
    text-align: center;
}

.wn-timer-btn:hover {
    border-color: var(--bamboo-primary);
    color: var(--bamboo-primary);
    background: rgba(var(--bamboo-primary-rgb, 62, 179, 112), 0.06);
}

.wn-timer-btn.wn-timer-active {
    color: var(--bamboo-primary);
    border-color: rgba(var(--bamboo-primary-rgb, 62, 179, 112), 0.4);
    background: rgba(var(--bamboo-primary-rgb, 62, 179, 112), 0.08);
    font-weight: 600;
}

.wn-timer-change-btn {
    position: relative;
    width: 24px;
    height: 28px;
    padding: 0;
    font-size: var(--type-md);
    font-weight: 500;
    line-height: 1;
    color: var(--text-tertiary);
    background: transparent;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-5);
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.wn-timer-change-btn:hover {
    border-color: var(--bamboo-primary);
    color: var(--bamboo-primary);
    background: rgba(var(--bamboo-primary-rgb, 62, 179, 112), 0.06);
}
.wn-timer-change-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: var(--touch-target);
    height: var(--touch-target);
    min-width: var(--touch-target);
    min-height: var(--touch-target);
}

/* 暗色模式 */
:host(.dark) .wn-timer-section {
    border-top-color: rgba(var(--border-dark-rgb, 60, 70, 60), 0.25);
}

:host(.dark) .wn-timer-btn {
    border-color: rgba(var(--border-dark-rgb, 60, 70, 60), 0.3);
}

:host(.dark) .wn-timer-change-btn {
    border-color: rgba(var(--border-dark-rgb, 60, 70, 60), 0.3);
}

@media (max-width: 480px) {
    .wn-panel {
        width: calc(100vw - 24px);
        right: 12px;
    }
}

/* ========== 日期选择器样式 (适配 fab-panel) ========== */

/* 日历区块分隔 - 限定在日期选择器面板内 */
#panel-date-picker .wn-section {
    padding: 0;
}

#panel-date-picker .wn-section:not(:last-child) {
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
}

#panel-date-picker .wn-section:last-child {
    padding-top: 12px;
}

/* 日历头部导航 */
.wn-date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.wn-date-nav {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px;
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    border-radius: var(--radius-sm);
    transition: transform, opacity, box-shadow, border-color, background-color 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.wn-date-nav:hover {
    background: rgba(var(--black-rgb), 0.06);
    color: var(--bamboo-primary);
    transform: scale(1.1);
}

.wn-date-title {
    font-size: var(--type-md);
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.5px;
}

/* 星期标题行 - 添加背景区分 */
.wn-date-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 8px;
    padding: 6px 0;
    background: rgba(var(--black-rgb), 0.03);
    border-radius: var(--radius-sm);
}

.wn-date-weekdays span {
    text-align: center;
    font-size: var(--type-micro);
    color: var(--text-secondary);
    font-weight: 600;
}

/* 日历网格 */
.wn-date-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
}

/* 日期单元格 - 优化交互 */
.wn-date-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: var(--type-sm);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: transform, opacity, box-shadow, border-color, background-color 0.15s ease;
    color: var(--text-primary);
    position: relative;
}
.wn-date-day::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: var(--touch-target);
    height: var(--touch-target);
    min-width: var(--touch-target);
    min-height: var(--touch-target);
}
.wn-date-empty::before {
    display: none;
}

.wn-date-day:hover:not(.wn-date-empty):not(.wn-date-today) {
    background: rgba(var(--primary-rgb), 0.1);
    transform: scale(1.05);
}

.wn-date-empty {
    cursor: default;
    color: transparent;
}

/* 今日日期 - 极简样式 */
.wn-date-today {
    background: transparent;
    color: var(--bamboo-primary);
    font-weight: 700;
    border: none;
}

.wn-date-today:hover {
    transform: scale(1.08);
    background: rgba(var(--primary-rgb), 0.08);
}

/* 选中日期 - 添加视觉提示 */
.wn-date-selected:not(.wn-date-today) {
    background: rgba(var(--primary-rgb), 0.15);
    border: 2px solid var(--bamboo-primary);
    font-weight: 600;
}

/* 有任务日期的标记点 - 优化位置和样式 */
.wn-date-has-task {
    position: relative;
}

.wn-date-num {
    display: block;
    line-height: 1;
}

.wn-date-dot {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-primary);
    opacity: 0.85;
    box-shadow: 0 0 2px rgba(var(--black-rgb), 0.2);
}

/* 今日有任务时，标记点更明显 */
.wn-date-today .wn-date-dot {
    background: var(--white);
    opacity: 1;
    width: 6px;
    height: 6px;
}

/* 选中日期有任务时，标记点调整 */
.wn-date-selected:not(.wn-date-today) .wn-date-dot {
    background: var(--bamboo-primary);
    opacity: 1;
}

/* 快捷选择按钮区域 - 添加背景 (限定在日期选择器面板内) */
#panel-date-picker .wn-section:last-child {
    background: rgba(var(--black-rgb), 0.02);
    border-radius: var(--radius-sm);
    margin-top: 8px;
}

/* 快捷选择按钮 - 简洁样式 (限定在日期选择器面板内) */
#panel-date-picker .wn-type-btn {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    padding: 10px 8px;
    min-height: var(--touch-target);
    font-size: var(--type-sm);
    border-radius: var(--radius-sm);
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color 0.2s ease;
}

#panel-date-picker .wn-type-btn:hover {
    background: rgba(var(--primary-rgb), 0.08);
    color: var(--bamboo-primary);
    transform: translateY(-1px);
}

#panel-date-picker .wn-type-btn.active {
    background: transparent;
    color: var(--bamboo-primary);
    font-weight: 700;
    border: none;
}

#panel-date-picker .wn-type-btn span {
    font-size: var(--type-sm);
}

/* 小屏幕适配 */
@media (max-width: 360px) {
    #panel-date-picker {
        width: 280px;
    }
    
    .wn-date-day {
        font-size: var(--type-micro);
    }
    
    .wn-date-weekdays span {
        font-size: var(--type-mini);
    }
    
    #panel-date-picker .wn-type-btn {
        padding: 8px 6px;
        font-size: var(--type-micro);
    }
}

/* ========== 编辑器模态框样式 ========== */

/* ========== 主题动效选择面板 ========== */
.theme-panel-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 4px 0;
}

.theme-panel-card {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
    border: 1.5px solid var(--border-light);
    background: var(--btn-secondary-bg);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color 0.2s ease;
    min-height: var(--touch-target);
    position: relative;
}

.theme-panel-card:hover {
    background: var(--btn-secondary-hover);
    border-color: var(--bamboo-primary);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(var(--primary-rgb), 0.1);
}

.theme-panel-card.active {
    background: rgba(var(--primary-rgb), 0.1);
    border-color: var(--bamboo-primary);
    box-shadow: 0 0 0 1px var(--bamboo-primary);
}

.theme-panel-card-name {
    font-size: var(--type-sm);
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.5px;
}

/* 主题颜色微调区 */
.theme-panel-tune {
    margin-top: 12px;
    padding: var(--space-3);
    background: rgba(var(--primary-rgb), 0.03);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
}

.theme-tune-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.theme-tune-header-label {
    font-size: var(--type-xs);
    font-weight: 600;
    color: var(--text-secondary);
}

.theme-tune-reset-all-btn {
    font-size: var(--type-2xs);
    color: var(--text-quaternary);
    background: none;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-xs);
    cursor: pointer;
    padding: 2px 8px;
    min-height: var(--touch-target);
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}

.theme-tune-reset-all-btn:hover {
    color: var(--bamboo-primary);
    border-color: rgba(var(--primary-rgb), 0.2);
    background: rgba(var(--primary-rgb), 0.04);
}

.theme-tune-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: 8px;
}

.theme-tune-row:last-of-type {
    margin-bottom: 0;
}

.theme-tune-name {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    flex-shrink: 0;
    min-width: 32px;
    cursor: default;
}

.theme-tune-val {
    font-size: var(--type-2xs);
    color: var(--text-quaternary);
    flex-shrink: 0;
    min-width: 36px;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.theme-tune-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: var(--radius-3xs);
    background: var(--border-light);
    cursor: pointer;
    min-width: 0;
}

.theme-tune-slider:focus {
    outline: none;
}

.theme-tune-slider:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
}

.theme-tune-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bamboo-primary, hsl(var(--accent-hue), 35%, 45%));
    cursor: pointer;
    border: 2px solid var(--white);
    box-shadow: 0 1px 4px rgba(var(--black-rgb), 0.15);
    transition: transform var(--transition-fast);
}

.theme-tune-slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
}

.theme-tune-reset {
    flex-shrink: 0;
    font-size: var(--type-2xs);
    color: var(--text-quaternary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    border-radius: var(--radius-xs);
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}

.theme-tune-reset:hover {
    color: var(--bamboo-primary);
    background: rgba(var(--primary-rgb), 0.06);
}

.theme-tune-reset-all-btn:hover {
    color: var(--bamboo-primary);
    background: rgba(var(--primary-rgb), 0.06);
}

/* 主题面板底部帮助入口 */
.theme-panel-help {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border-light);
}

.theme-panel-help-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 8px 0;
    min-height: var(--touch-target);
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    font-size: var(--type-xs);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}

.theme-panel-help-btn:hover {
    color: var(--bamboo-primary);
    background: rgba(var(--primary-rgb), 0.06);
}

/* 主题开发指南面板 */
.theme-guide {
    font-size: var(--type-sm);
    line-height: 1.7;
    color: var(--text-secondary);

    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}
.color-option:hover {
    transform: scale(1.1);
}
.color-option.selected {
    border-color: var(--bamboo-primary);
}

/* ========== 设置模态框样式 ========== */
.settings-section {
    margin-bottom: var(--space-5);
}
.settings-section-title {
    font-size: var(--type-md);
    font-weight: 700;
    color: var(--white);
    margin: var(--space-4) 0 var(--space-3);
    padding: var(--space-2) var(--space-4);
    background: var(--section-title-gradient);
    border-radius: var(--radius-pill);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    box-shadow: 0 4px 10px rgba(var(--deep-rgb), 0.15);
    position: relative;
}
.settings-section-title::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(var(--white-rgb), 0.12);
    border-radius: var(--radius-pill);
    pointer-events: none;
}
.settings-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-4);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-2);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-surface);
    transition: transform, opacity, box-shadow, border-color, background-color 0.3s ease;
}
.settings-item:hover {
    border-color: var(--bamboo-primary);
    box-shadow: var(--shadow-card);
    transform: translateY(-1px);
}
.settings-item-info {
    flex: 1;
    min-width: 0;
    margin-right: var(--space-3);
}
.settings-item-label {
    font-size: var(--type-base);
    font-weight: 600;
    color: var(--text-primary);
}
.settings-item-desc {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    margin-top: 4px;
    line-height: 1.4;
}
.settings-clear-row {
    display: flex;
    gap: var(--space-2);
    align-items: center;
}
.settings-date-input {
    flex: 1;
    padding: 8px 12px;
    min-height: var(--touch-target);
    font-size: var(--type-base);
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    transition: border-color var(--transition-fast);
}
.settings-date-input:focus {
    outline: none;
    border-color: var(--bamboo-primary);
}

.settings-date-input:focus-visible {
    outline: none;
    border-color: var(--bamboo-primary);
    box-shadow: var(--focus-ring);
}

/* ========== Toggle Switch ========== */
.toggle-switch {
    position: relative;
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    min-width: 48px;
    min-height: var(--touch-target);
}
.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.toggle-slider {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 28px;
    background: var(--btn-secondary-bg);
    border-radius: var(--radius-lg);
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}
.toggle-slider::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: var(--shadow-surface);
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}
.toggle-switch input:checked + .toggle-slider {
    background: var(--bamboo-primary);
}
.toggle-switch input:checked + .toggle-slider::after {
    left: 24px;
}
.toggle-switch input:focus-visible + .toggle-slider {
    outline: 2px solid var(--bamboo-primary);
    outline-offset: 2px;
}

/* ========== 设置面板增强样式 ========== */
.settings-select-sm {
    max-width: 100px;
    padding: 4px 8px;
    font-size: var(--type-micro);
    min-height: var(--touch-target);
}
.settings-backup-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0 2px;
    font-size: var(--type-xs);
    color: var(--text-secondary);
    gap: var(--space-2);
}
.settings-theme-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-2);
}
.settings-theme-card {
    display: flex;
    flex-direction: column;
    border-radius: var(--radius-lg);
    border: 2px solid var(--border-light);
    overflow: hidden;
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}
.settings-theme-card:hover {
    border-color: var(--bamboo-primary);
    transform: translateY(-1px);
    box-shadow: var(--shadow-card);
}
.settings-theme-card.active {
    border-color: var(--bamboo-primary);
    box-shadow: 0 0 0 1px var(--bamboo-primary);
}
.settings-theme-preview {
    height: 48px;
    width: 100%;
}
.settings-theme-name {
    padding: 6px 8px;
    font-size: var(--type-xs);
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: var(--space-1);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
}
.settings-action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2);
}
.settings-about-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-3) var(--space-4);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    font-size: var(--type-base);
    font-weight: 600;
}
.settings-about-version {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    font-weight: 400;
}

/* 插件简介 */
.about-description {
    padding: var(--space-4) var(--space-5);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    font-size: var(--type-sm);
    line-height: 1.7;
    color: var(--text-secondary);
}

/* 作者介绍卡片 */
.about-author {
    padding: var(--space-4) var(--space-5);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: var(--space-3);

    background-size: cover;
    background-position: center;
    background-color: var(--ink-dark);
    flex-shrink: 0;
    border: 1px solid var(--border-light);
}
.about-author-name {
    font-size: var(--type-md);
    font-weight: 600;
    line-height: 1.3;
}
.about-author-role {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    margin-top: 2px;
}
.about-works {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
}
.about-work-tag {
    padding: 6px 12px;
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    font-size: var(--type-sm);
    font-weight: 500;
}
.settings-stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-2);
}
.settings-stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-3);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
}
.settings-stat-value {
    font-size: var(--type-large);
    font-weight: 700;
    color: var(--bamboo-primary);
    line-height: 1.2;
}
.settings-stat-label {
    font-size: var(--type-xs);
    color: var(--text-secondary);
    margin-top: 4px;
}

/* ========== 快捷键列表 ========== */
.shortcuts-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-2);
}
.shortcut-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-4);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
    font-size: var(--type-sm);
    box-shadow: var(--shadow-surface);
}
.shortcut-key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 var(--space-2);
    background: var(--section-title-gradient);
    color: var(--white);
    border-radius: var(--radius-sm);
    font-size: var(--type-xs);
    font-weight: 700;
    font-family: inherit;
    box-shadow: 0 4px 10px rgba(var(--deep-rgb), 0.15);
}
.shortcut-desc {
    color: var(--text-secondary);
    margin-left: auto;
    font-size: var(--type-xs);
}

/* ========== 时间输入 ========== */
.time-input,
.settings-time-input {
    padding: var(--space-2) var(--space-3);
    min-height: var(--touch-target);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    /* backdrop-filter 由 .modal-overlay 提供 */
    font-size: var(--type-sm);
    color: var(--text-primary);
    font-family: inherit;
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-normal);
    box-shadow: var(--shadow-surface);
}
.time-input:focus,
.settings-time-input:focus {
    outline: none;
    border-color: var(--bamboo-primary);
    box-shadow: var(--shadow-card), 0 0 0 3px rgba(var(--primary-rgb), 0.12);
}

/* ========== Badge ========== */
.badge {
    display: inline-flex;
    align-items: center;
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-3xl);
    font-size: var(--type-xs);
    font-weight: 600;
}
.badge-info {
    background: rgba(var(--primary-rgb), 0.12);
    color: var(--bamboo-primary);
}

/* ========== 数据 Tab 升级样式 (导入/导出) ========== */

/* 区域标题：带图标的强视觉锚点 */
.data-section-header {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--type-md);
    font-weight: 700;
    color: var(--text-primary);
    margin: var(--space-4) 0 var(--space-3);
    padding-left: var(--space-1);
}
.data-section-header svg {
    width: var(--bm-icon-lg);
    height: var(--bm-icon-lg);
    color: var(--bamboo-primary);
    flex-shrink: 0;
}

/* 卡片容器：把整组操作包成一个有边界的"区块" */
.data-action-card {

/* ===========================================================

   由 goals-dark.css + modal-dark.css + components-dark.css 合并
   =========================================================== */

/* ==========================================================================
   暗色性能降级 - 全局关闭 backdrop-filter 毛玻璃
   暗色背景不透明，无"透出亮底"需求；Chronium 下 backdrop-filter 在
   暗色滚动/阴影叠加时会频繁重采样导致掉帧。原实现仅把 --glass-blur
   从 20px 降到 12px，模糊仍全程运行。此处统一兜底关闭，不影响任何
   视觉结构（背景色/边框/阴影均保留）。
   =========================== */
:host(.dark) * {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

/* ==========================================================================
   暗色性能降级 - 竹林背景动效静态化
   暗色下竹林容器（.bamboo-garden-container 300px 高、contain:paint）内的
   迷雾/远山/江面/月亮/舟 全部持续运行 animation + blur + mix-blend-mode
   screen，是暗色最重的重绘来源。此处统一：关闭动画、去除高斯模糊与
   drop-shadow、弱化 mix-blend-mode，保留静态外观（背景渐变/形状/透明度
   不变），滚动与渲染开销大幅下降。
   =========================== */
:host(.dark) .mist-layer-1,
:host(.dark) .mist-layer-2,
:host(.dark) .mist-layer-3,
:host(.dark) .mountain-mist,
:host(.dark) .foreground-haze,
:host(.dark) .mountain-1,
:host(.dark) .mountain-2,
:host(.dark) .mountain-3,
:host(.dark) .river-surface,
:host(.dark) .boat-container,
:host(.dark) .moon {

}

:host(.dark) .mountain-1,
:host(.dark) .mountain-2,
:host(.dark) .mountain-3,
:host(.dark) .river-surface,
:host(.dark) .boat {

}

    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.stats-section-primary {
    padding: var(--space-5);
    margin-bottom: 22px;
    border-color: rgba(var(--primary-rgb), 0.18);
    box-shadow: 
        0 6px 24px rgba(var(--deep-rgb), 0.08);
}

.stats-section-warning {
    padding: var(--space-5);
    margin-bottom: 22px;
    border-color: rgba(var(--warning-orange-rgb), 0.18);
    background: linear-gradient(145deg, rgba(255,250,245,0.95), rgba(255,248,240,0.9));
    box-shadow: 
        0 6px 24px rgba(var(--warning-orange-rgb), 0.08);
}

.stats-section:hover {
    transform: translateY(-2px);
    box-shadow: 
        0 1px 0 rgba(var(--white-rgb), 0.8) inset,
        0 8px 30px rgba(var(--deep-rgb), 0.1),
        0 0 0 1px rgba(var(--white-rgb), 0.6);
}

.stats-section-title {
    font-size: var(--type-md);
    font-weight: 700;
    color: var(--bamboo-deep);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: -0.3px;
    opacity: 0.9;
}

.stats-section-primary .stats-section-title {
    font-size: var(--type-md);
    font-weight: 900;
    color: var(--bamboo-primary);
    padding-left: 12px;
    border-left: 3px solid var(--bamboo-primary);
}

.stats-section-warning .stats-section-title {
    font-size: var(--type-md);
    font-weight: 800;
    color: var(--health-warning);
    padding-left: 12px;
    border-left: 3px solid var(--health-warning);
}

/* 核心指标 */
.core-metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-2);
}

.core-metric-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 10px;
    background: rgba(var(--white-rgb), 0.6);
    border-radius: var(--radius-md);
    border: 1px solid rgba(var(--primary-rgb), 0.1);
    box-shadow: 0 2px 8px rgba(var(--deep-rgb), 0.04);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    min-height: 68px;
}

.core-metric-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(var(--deep-rgb), 0.08);
    border-color: rgba(var(--primary-rgb), 0.16);
    background: rgba(var(--white-rgb), 0.75);
}

.stat-value {
    font-size: var(--type-large);
    font-weight: 800;
    color: var(--bamboo-deep);
    line-height: 1;
    margin-bottom: 4px;
}

.stat-label {
    font-size: var(--type-micro);
    color: var(--text-secondary);
    text-align: center;
    font-weight: 600;
    letter-spacing: -0.2px;
}

/* 预警项目 */
.time-alerts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-3);
}

.alert-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: 16px 12px;
    background: linear-gradient(145deg, rgba(var(--white-rgb), 0.95), rgba(var(--pale-green-alt-rgb), 0.9));
    border-radius: var(--radius-lg);
    border: 1px solid rgba(var(--primary-rgb), 0.1);
    box-shadow: 0 2px 8px rgba(var(--deep-rgb), 0.04);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    text-align: center;
}

.alert-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 16px rgba(var(--deep-rgb), 0.08);
    border-color: rgba(var(--primary-rgb), 0.18);
}

.alert-icon-wrapper {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-md);
    flex-shrink: 0;
}

.alert-icon-wrapper.urgent {
    background: linear-gradient(145deg, rgba(var(--danger-bright-rgb), 0.18), rgba(var(--danger-bright-rgb), 0.12));
    border: 1px solid rgba(var(--danger-bright-rgb), 0.25);
    box-shadow: 0 2px 10px rgba(var(--danger-bright-rgb), 0.12);
}

.alert-icon-wrapper.warning {
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.18), rgba(var(--warning-orange-rgb), 0.12));
    border: 1px solid rgba(var(--warning-orange-rgb), 0.25);
    box-shadow: 0 2px 10px rgba(var(--warning-orange-rgb), 0.12);
}

.alert-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-1);
}

.alert-title {
    font-size: var(--type-base);
    font-weight: 700;
    color: var(--bamboo-deep);
}

.alert-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--type-micro);
    color: var(--text-secondary);
}

.alert-days {
    font-weight: 800;
    font-size: var(--type-heading);
    padding: 4px 10px;
    border-radius: var(--radius-2xs);
}

.alert-item.urgent .alert-days {
    background: rgba(var(--danger-bright-rgb), 0.12);
    color: var(--health-danger);
}

.alert-item.warning .alert-days {
    background: rgba(var(--warning-orange-rgb), 0.12);
    color: var(--health-warning);
}

/* 进度梯队 */
.progress-tiers-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: var(--space-3);
}

.tier-card {
    padding: 12px 10px;
    background: rgba(var(--white-rgb), 0.55);
    border-radius: var(--radius-md);
    border: 1px solid rgba(var(--primary-rgb), 0.1);
    box-shadow: 0 2px 8px rgba(var(--deep-rgb), 0.04);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.tier-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(var(--deep-rgb), 0.08);
    border-color: rgba(var(--primary-rgb), 0.16);
    background: rgba(var(--white-rgb), 0.7);
}

.tier-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.tier-label {
    font-size: var(--type-micro);
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: -0.2px;
}

.tier-count {
    font-size: var(--type-heading);
    font-weight: 800;
}

.tier-bar {
    height: 5px;
    background: rgba(var(--primary-rgb), 0.08);
    border-radius: var(--radius-2-5);
    overflow: hidden;
}

.tier-bar-fill {
    height: 100%;
    border-radius: var(--radius-2-5);
    transition: width 0.4s ease;
}

.tier-card.high .tier-count {
    color: var(--bamboo-primary);
}

.tier-card.high .tier-bar-fill {
    background: var(--bamboo-primary);
}

.tier-card.medium .tier-count {
    color: var(--health-warning);
}

.tier-card.medium .tier-bar-fill {
    background: var(--health-warning);
}

.tier-card.low .tier-count {
    color: var(--health-neutral);
}

.tier-card.low .tier-bar-fill {
    background: #BDC3C7;
}

/* 优先级分布 */
.priority-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
}

.priority-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: 16px 12px;
    background: linear-gradient(145deg, rgba(var(--white-rgb), 0.95), rgba(var(--pale-green-alt-rgb), 0.9));
    border-radius: var(--radius-lg);
    border: 1px solid rgba(var(--primary-rgb), 0.1);
    box-shadow: 0 2px 8px rgba(var(--deep-rgb), 0.04);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.priority-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 16px rgba(var(--deep-rgb), 0.08);
}

.priority-card.high:hover {
    border-color: rgba(var(--danger-bright-rgb), 0.2);
}

.priority-card.medium:hover {
    border-color: rgba(var(--warning-orange-rgb), 0.2);
}

.priority-card.low:hover {
    border-color: rgba(var(--gray-rgb), 0.2);
}

.priority-header {
    display: flex;
    align-items: center;
    gap: var(--space-2);
}

.priority-indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
}

.priority-card.high .priority-indicator {
    background: var(--health-danger);
    box-shadow: 0 0 0 5px rgba(var(--danger-bright-rgb), 0.18);
}

.priority-card.medium .priority-indicator {
    background: var(--health-warning);
    box-shadow: 0 0 0 5px rgba(var(--warning-orange-rgb), 0.18);
}

.priority-card.low .priority-indicator {
    background: var(--health-neutral);
    box-shadow: 0 0 0 5px rgba(var(--gray-rgb), 0.18);
}

.priority-label {
    font-size: var(--type-base);
    font-weight: 700;
    color: var(--bamboo-deep);
}

.priority-value {
    font-size: var(--type-hero);
    font-weight: 900;
}

.priority-card.high .priority-value {
    color: var(--health-danger);
}

.priority-card.medium .priority-value {
    color: var(--health-warning);
}

.priority-card.low .priority-value {
    color: var(--health-neutral);
}

/* 成就卡片 */
.achievement-icon-wrapper {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.15), rgba(var(--warning-orange-rgb), 0.1));
    border-radius: var(--radius-md);
    border: 1px solid rgba(var(--warning-orange-rgb), 0.2);
}

.achievement-icon-wrapper-horizontal {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.15), rgba(var(--warning-orange-rgb), 0.1));
    border-radius: var(--radius-sm);
    border: 1px solid rgba(var(--warning-orange-rgb), 0.2);
    flex-shrink: 0;
    margin-bottom: 10px;
}

/* 成就页面样式 */
.achievements-container {
    padding: var(--space-2) 0;
}

.achievements-grid-full {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: var(--space-4);
}

.achievement-card-full {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    padding: 18px;
    background: linear-gradient(135deg, rgba(var(--warning-orange-rgb), 0.08), rgba(255, 250, 205, 0.06));
    border: 1px solid rgba(var(--warning-orange-rgb), 0.2);
    border-radius: var(--radius-lg);
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}

.achievement-card-full:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(var(--warning-orange-rgb), 0.18);
    background: linear-gradient(135deg, rgba(var(--warning-orange-rgb), 0.12), rgba(255, 250, 205, 0.09));
}

.achievement-icon-wrapper-full {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.2), rgba(var(--warning-orange-rgb), 0.12));
    border-radius: var(--radius-lg);
    border: 1px solid rgba(var(--warning-orange-rgb), 0.25);
    flex-shrink: 0;
}

.achievement-content-full {
    flex: 1;

}

.achievement-title-full {

}

.achievement-desc-full {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    line-height: 1.5;
    display: block;
}

.achievement-unlock-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.15), rgba(var(--primary-rgb), 0.1));
    border-radius: 50%;

}

.achievements-summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
}

.achievement-summary-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px;
    background: var(--card-bg);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.achievement-summary-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(var(--black-rgb), 0.08);
    border-color: rgba(var(--warning-orange-rgb), 0.25);
}

.achievement-summary-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.15), rgba(var(--warning-orange-rgb), 0.08));
    border-radius: var(--radius-sm);
}

.achievement-summary-value {
    font-size: var(--type-hero);
    font-weight: 700;
    color: var(--text-primary);

}

.achievement-summary-label {
    font-size: var(--type-sm);
    color: var(--text-secondary);
}

.achievements-empty-state {
    text-align: center;

}

.achievements-empty-icon {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.08), rgba(var(--warning-orange-rgb), 0.04));
    border-radius: var(--radius-3xl);
    border: 1px dashed rgba(var(--warning-orange-rgb), 0.2);
}

.achievements-empty-title {
    font-size: var(--type-heading);
    font-weight: 700;
    color: var(--text-primary);

}

.achievements-empty-desc {
    font-size: var(--type-base);
    color: var(--text-secondary);
    margin-bottom: 16px;
}

.achievements-empty-hint {
    font-size: var(--type-sm);
    color: var(--text-tertiary);

/* 暗色模式成就页面适配 */

    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.2), rgba(var(--warning-orange-rgb), 0.1));
}

}

    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.12), rgba(var(--warning-orange-rgb), 0.06));

}

:host(.dark) .achievements-empty-hint {
    background: rgba(var(--warning-orange-rgb), 0.1);
}

}

.achievement-rule-card {

.achievement-rule-card:hover {

}

.achievement-rule-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, rgba(var(--warning-orange-rgb), 0.15), rgba(var(--warning-orange-rgb), 0.08));

.achievement-rule-title {

.achievement-rule-desc {

}

/* 暗色模式成就规则适配 */

:host(.dark) .achievement-rule-icon {

}

.rw-768 .achievements-summary-grid {

/* 停滞卡片样式 */

/* 一切顺利卡片 */

/* === 新设计：状态分布 === */
.status-distribution-new {
    display: flex;
    gap: var(--space-4);
    align-items: stretch;
}

.pie-container {
    width: 160px;
    flex-shrink: 0;
    position: relative;
    border-radius: var(--radius-3xl);
    background: linear-gradient(145deg, 
        rgba(var(--white-rgb), 0.95), 
        rgba(var(--pale-green-alt-rgb), 0.9)
    );
    padding: 14px;
    border: 1px solid rgba(var(--primary-rgb), 0.12);
    box-shadow: 0 4px 16px rgba(var(--deep-rgb), 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
}

.pie-container::before {
    content: '';
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    background: radial-gradient(circle, rgba(var(--health-success-rgb), 0.15), transparent);
    border-radius: 50%;
}

.status-legend-new {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
}

.legend-item-new {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: 14px 16px;
    border-radius: var(--radius-lg);
    background: linear-gradient(145deg, 
        rgba(var(--white-rgb), 0.95), 
        rgba(var(--pale-green-alt-rgb), 0.9)
    );
    border: 1px solid rgba(var(--primary-rgb), 0.1);
    cursor: pointer;
    overflow: clip; /* 允许 tooltip/focus ring 溢出 */
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.legend-item-new::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    transition: width 0.3s ease;
}

.legend-item-new:hover {
    transform: translateX(6px);
    box-shadow: 0 6px 20px rgba(var(--deep-rgb), 0.08);
}

.legend-item-new:hover::before {
    width: 6px;
}

.legend-dot-new {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 0 6px rgba(var(--health-success-rgb), 0.12);
    transition: transform 0.3s ease;
}

.legend-item-new:hover .legend-dot-new {
    transform: scale(1.15);
}

.legend-text-new {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
}

.legend-label-new {
    font-size: var(--type-base);
    font-weight: 700;
    color: var(--bamboo-deep);
}

.legend-value-new {
    font-size: var(--type-hero);
    font-weight: 900;
    line-height: 1;
    transition: transform 0.3s ease;
}

.legend-item-new:hover .legend-value-new {
    transform: scale(1.1);
}

/* 已完成图例 */

    border-color: rgba(var(--health-success-rgb), 0.2);
}

.legend-item-new.completed-legend::before {
    background: linear-gradient(180deg, var(--health-success-clr), var(--bamboo-primary));
}

.legend-item-new.completed-legend .legend-dot-new {
    background: linear-gradient(145deg, var(--health-success-clr), var(--bamboo-primary));
    box-shadow: 0 0 0 6px rgba(var(--health-success-rgb), 0.18);
}

.legend-item-new.completed-legend .legend-value-new {
    color: var(--health-success-clr);

    background: linear-gradient(145deg, var(--health-warning), var(--health-gold-clr));

.legend-item-new.inprogress-legend .legend-value-new {
    color: var(--health-warning);
}

/* 未开始图例 */

    border-color: rgba(var(--gray-rgb), 0.2);
}

.legend-item-new.notstarted-legend::before {
    background: linear-gradient(180deg, var(--health-neutral), var(--health-neutral));
}

.legend-item-new.notstarted-legend .legend-dot-new {
    background: linear-gradient(145deg, var(--health-neutral), var(--health-neutral));
    box-shadow: 0 0 0 6px rgba(var(--gray-rgb), 0.18);
}

.legend-item-new.notstarted-legend .legend-value-new {
    color: var(--health-neutral);

/* === 新设计：优先级分布 === */
.priority-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
}

.priority-card-new {
    position: relative;
    padding: 20px 14px;
    border-radius: var(--radius-3xl);
    border: 1px solid rgba(var(--primary-rgb), 0.12);
    background: linear-gradient(145deg, 
        rgba(var(--white-rgb), 0.95), 
        rgba(var(--pale-green-alt-rgb), 0.9)
    );
    text-align: center;
    cursor: pointer;
    overflow: clip; /* 允许 tooltip/focus ring 溢出 */
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.priority-card-new::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(var(--white-rgb), 0.4), transparent 60%);
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.priority-card-new:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 
        0 16px 40px rgba(var(--deep-rgb), 0.15),
        0 6px 16px rgba(var(--deep-rgb), 0.08);
}

.priority-card-new:hover::before {
    opacity: 1;
    transform: scale(1);
}

.priority-card-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: var(--radius-xl);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.4s ease;
}

.priority-card-new:hover .priority-card-icon {
    transform: rotate(8deg) scale(1.08);
}

.priority-card-number {
    font-size: var(--type-mega);
    font-weight: 900;
    line-height: 1;
    margin-bottom: 6px;
    transition: transform 0.3s ease;
}

.priority-card-new:hover .priority-card-number {
    transform: scale(1.15);
}

.priority-card-label {
    font-size: var(--type-sm);
    font-weight: 700;
    letter-spacing: 0.3px;
}

/* 高优先级卡片 */
.priority-card-new.high-priority {
    border-color: rgba(var(--danger-bright-rgb), 0.25);
}

.priority-card-new.high-priority .priority-card-icon {
    background: linear-gradient(145deg, 
        rgba(var(--danger-bright-rgb), 0.22), 
        rgba(var(--danger-bright-rgb), 0.14)
    );
    color: var(--health-danger);
    box-shadow: 0 6px 20px rgba(var(--danger-bright-rgb), 0.22);
}

.priority-card-new.high-priority .priority-card-number {
    color: var(--health-danger);
}

.priority-card-new.high-priority .priority-card-label {
    color: var(--health-danger);
}

/* 中优先级卡片 */
.priority-card-new.medium-priority {
    border-color: rgba(var(--warning-orange-rgb), 0.25);
}

.priority-card-new.medium-priority .priority-card-icon {
    background: linear-gradient(145deg, 
        rgba(var(--warning-orange-rgb), 0.22), 
        rgba(var(--warning-orange-rgb), 0.14)
    );
    color: var(--health-warning);
    box-shadow: 0 6px 20px rgba(var(--warning-orange-rgb), 0.2);
}

.priority-card-new.medium-priority .priority-card-number {
    color: var(--health-warning);
}

.priority-card-new.medium-priority .priority-card-label {
    color: var(--health-gold-clr);
}

/* 低优先级卡片 */
.priority-card-new.low-priority {
    border-color: rgba(var(--gray-rgb), 0.25);
}

.priority-card-new.low-priority .priority-card-icon {
    background: linear-gradient(145deg, 
        rgba(var(--gray-rgb), 0.22), 
        rgba(var(--gray-rgb), 0.14)
    );
    color: var(--health-neutral);
    box-shadow: 0 6px 20px rgba(var(--gray-rgb), 0.18);
}

.priority-card-new.low-priority .priority-card-number {
    color: var(--health-neutral);
}

.priority-card-new.low-priority .priority-card-label {
    color: #4B5563;
}

:host(.dark) .goal-priority-dot.high { background: rgba(var(--danger-bright-rgb), 0.75); } /* 柔和红色 */
:host(.dark) .goal-priority-dot.medium { background: var(--gold); }
:host(.dark) .goal-priority-dot.low { background: var(--bamboo-light); }

:host(.dark) .goal-row-bar {
    background: linear-gradient(
        180deg,
        rgba(var(--primary-rgb), 0.08) 0%,
        rgba(var(--primary-rgb), 0.04) 45%,
        rgba(var(--primary-rgb), 0.05) 100%
    );
    box-shadow:
        inset 0 2px 5px rgba(var(--black-rgb), 0.3);
}

:host(.dark) .goal-row-bar-fill {
    background: linear-gradient(
        90deg,
        var(--bamboo-primary),
        var(--bamboo-light),
        var(--bamboo-primary)
    );
    background-size: 200% 100%;
    box-shadow:
        0 0 8px rgba(var(--primary-rgb), 0.2),
        inset 0 1px 0 rgba(var(--white-rgb), 0.15);
    animation: bamboo-glow-subtle 4s infinite ease-in-out;
}

/* 性能降级：暗色下关闭持续背景重绘与 box-shadow 脉冲动画 */
:host(.dark) .goal-row-header:hover {
    animation: none;
}
:host(.dark) .goal-row-bar-fill {
    animation: none;
}


:host(.dark) .goal-row-bar-fill::before {
    background: linear-gradient(
        180deg,
        rgba(var(--white-rgb), 0.15) 0%,
        rgba(var(--white-rgb), 0) 100%
    );
}

:host(.dark) .goal-row-bar-fill::after {
    display: none;
}

/* 暗色模式：目标卡片文字颜色适配 */


:host(.dark) .goal-row-title { color: var(--bamboo-pale); }
:host(.dark) .goal-row-title:hover { background: rgba(var(--primary-rgb), 0.08); border-color: rgba(var(--primary-rgb), 0.12); }
:host(.dark) .goal-row-meta { color: var(--bamboo-light) }
:host(.dark) .goal-row-meta:hover { background: rgba(var(--primary-rgb), 0.06); border-color: rgba(var(--primary-rgb), 0.08); }
:host(.dark) .goal-row-analysis { color: var(--bamboo-light); border-left-color: rgba(var(--primary-rgb), 0.5); }
:host(.dark) .goal-row-category { color: var(--bamboo-pale); }
:host(.dark) .goal-row-percent { color: var(--bamboo-light); }
:host(.dark) .goal-row-toggle:hover { background: rgba(var(--primary-rgb), 0.08); color: var(--bamboo-pale); }
:host(.dark) .goal-date-range { color: var(--bamboo-light); }
:host(.dark) .goal-date-overdue { color: rgba(var(--danger-bright-rgb), 0.85); } /* 柔和红色 */
:host(.dark) .goal-date-soon { color: var(--bamboo-warning); }
:host(.dark) .goal-row-meta-empty { color: var(--bamboo-pale); }
:host(.dark) .goal-row-remaining { color: var(--bamboo-light); }

:host(.dark) .goal-item-list:not(.collapsed) {
    background: hsla(var(--accent-hue), 18%, calc(15% + var(--accent-lightness-offset)), 0.4);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: 0 0 var(--radius-xl) var(--radius-xl);
}
:host(.dark) .goal-item-remaining { color: var(--ink-light); background: rgba(var(--primary-rgb), 0.2); }

:host(.dark) .goal-item-overdue { color: rgba(var(--danger-bright-rgb), 0.85); background: rgba(var(--danger-rgb), 0.2); }

/* 暗色模式：逾期目标的 header 淡粉红渐变 */

}

:host(.dark) .goal-overdue:hover .goal-row-header {
    background: linear-gradient(135deg, rgba(var(--overdue-bg-rgb), 0.7) 0%, rgba(var(--overdue-bg-light-rgb), 0.6) 50%, rgba(var(--overdue-bg-mid-rgb), 0.5) 100%);
}


/* 暗色模式：即将到期目标的 header 淡橙黄渐变 */

:host(.dark) .goal-soon:hover .goal-row-header {

}

                     radial-gradient(ellipse at 80% 40%, rgba(var(--white-rgb), 0.6) 0%, transparent 55%);
    --foreground-haze: radial-gradient(ellipse at 0% 100%, hsla(calc(var(--accent-hue) + 0), 22%, calc(82% + var(--accent-lightness-offset)), 0.38) 0%, transparent 55%),
                       radial-gradient(ellipse at 100% 100%, hsla(calc(var(--accent-hue) + 0), 22%, calc(82% + var(--accent-lightness-offset)), 0.38) 0%, transparent 55%);
}

:host(.dark) {
    --mist-1: radial-gradient(ellipse at 10% 60%, hsla(calc(var(--accent-hue) + 0), 35%, calc(55% + var(--accent-lightness-offset)), 0.06) 0%, transparent 45%),
              radial-gradient(ellipse at 70% 50%, hsla(calc(var(--accent-hue) + 30), 33%, calc(47% + var(--accent-lightness-offset)), 0.04) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 85%, hsla(calc(var(--accent-hue) + 0), 42%, calc(63% + var(--accent-lightness-offset)), 0.05) 0%, transparent 55%);
    --mist-2: radial-gradient(ellipse at 85% 70%, hsla(calc(var(--accent-hue) + 15), 33%, calc(47% + var(--accent-lightness-offset)), 0.04) 0%, transparent 40%),
              radial-gradient(ellipse at 30% 45%, hsla(calc(var(--accent-hue) + 15), 35%, calc(55% + var(--accent-lightness-offset)), 0.03) 0%, transparent 45%);
    --mist-3: radial-gradient(ellipse at 60% 85%, hsla(calc(var(--accent-hue) + 0), 35%, calc(55% + var(--accent-lightness-offset)), 0.05) 0%, transparent 55%),
              radial-gradient(ellipse at 15% 75%, hsla(calc(var(--accent-hue) + 15), 33%, calc(47% + var(--accent-lightness-offset)), 0.04) 0%, transparent 45%);
    --mountain-mist: radial-gradient(ellipse at 20% 60%, hsla(calc(var(--accent-hue) + 0), 35%, calc(55% + var(--accent-lightness-offset)), 0.05) 0%, transparent 50%),
                     radial-gradient(ellipse at 80% 40%, hsla(calc(var(--accent-hue) + 15), 33%, calc(47% + var(--accent-lightness-offset)), 0.04) 0%, transparent 55%);
    --foreground-haze: radial-gradient(ellipse at 0% 100%, hsla(calc(var(--accent-hue) + 20), 33%, calc(35% + var(--accent-lightness-offset)), 0.06) 0%, transparent 55%),
                       radial-gradient(ellipse at 100% 100%, hsla(calc(var(--accent-hue) + 20), 33%, calc(35% + var(--accent-lightness-offset)), 0.06) 0%, transparent 55%);
}

/* 统一主题动效容器（所有主题共享外壳） */
#themeEffectSection {
    position: relative;
    padding: var(--space-3);
    border-radius: var(--radius-38);
    overflow: hidden;
    border: 1px solid hsla(calc(var(--accent-hue) + 0), 30%, 88%, 0.5);
    margin-bottom: calc(var(--space-6) * var(--section-gap-scale));
    box-shadow:
        0 2px 12px hsla(calc(var(--accent-hue) + 0), 25%, 40%, 0.06),
        0 1px 3px hsla(calc(var(--accent-hue) + 0), 20%, 50%, 0.04);
    contain: paint;
    /* 主题切换淡入淡出过渡 */
    transition: opacity 0.15s ease;
    /* 平台级内框圆角：外层 38px − padding 12px = 26px。子元素通过 var() 引用，外框改大时只需改此值和 border-radius 两处 */
    --theme-inner-radius: 26px;
}

/* 朦胧意境竹林动效（仅保留竹林专属样式，外壳由 #themeEffectSection 统一提供） */
.bamboo-garden-section {
    position: relative;
    border-radius: var(--radius-26);
    overflow: hidden;
}



.bamboo-garden-container {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    border-radius: inherit;
    background: linear-gradient(180deg,
        hsla(calc(var(--accent-hue) + 0), 32%, 97%, 0.95) 0%,
        hsla(calc(var(--accent-hue) + 0), 28%, 94%, 0.92) 30%,
        hsla(calc(var(--accent-hue) + 0), 24%, 90%, 0.9) 70%,
        hsla(calc(var(--accent-hue) + 0), 20%, 85%, 0.88) 100%);
    /* 深嵌体积：顶部强内高光 + 底部凹陷 + 竹绿调投影 */
    box-shadow:
        inset 0 1px 0 hsla(calc(var(--accent-hue) + 0), 40%, 98%, 0.8),
        inset 0 10px 30px hsla(calc(var(--accent-hue) + 0), 20%, 30%, 0.08),
        inset 0 -1px 0 hsla(calc(var(--accent-hue) + 0), 30%, 70%, 0.25),
        0 2px 8px hsla(calc(var(--accent-hue) + 0), 25%, 35%, 0.07),
        0 8px 32px hsla(calc(var(--accent-hue) + 0), 30%, 30%, 0.1),
        0 16px 48px hsla(calc(var(--accent-hue) + 0), 25%, 20%, 0.08);
    border: 1.5px solid hsla(calc(var(--accent-hue) + 0), 28%, 82%, 0.55);
    contain: paint;
}

/* 强制所有主题顶层元素自适应宽度 + 平台级内框圆角兜底 */
#themeEffectSection > * {
    width: 100%;
    max-width: 100%;
    border-radius: var(--theme-inner-radius);
}

:host(.dark) #themeEffectSection {
    border-color: hsla(calc(var(--accent-hue) + 0), 28%, 35%, 0.15);
    box-shadow:
        0 1px 4px hsla(calc(var(--accent-hue) + 0), 20%, 3%, 0.15),
        0 4px 20px hsla(calc(var(--accent-hue) + 0), 15%, 2%, 0.2);
}

.bamboo-garden-container::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    pointer-events: none;
    z-index: -1;
}

/* 玻璃反射层 — 顶部斜射高光，模拟光线穿过玻璃的反射 */
.bamboo-garden-container::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(
        180deg,
        hsla(calc(var(--accent-hue) + 0), 50%, 100%, 0.15) 0%,
        hsla(calc(var(--accent-hue) + 0), 40%, 98%, 0.06) 20%,
        transparent 50%
    );
    pointer-events: none;
    z-index: var(--z-layer-keyboard-hint);
}

/* 月亮 - 仅在暗色模式显示 */
.moon {
    position: absolute;
    top: 45px;
    right: 70px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff9e6 0%, #ffeaa7 50%, #fdcb6e 100%);
    box-shadow: 
        0 0 20px rgba(255, 234, 167, 0.6),
        0 0 40px rgba(255, 234, 167, 0.4),
        0 0 60px rgba(255, 234, 167, 0.2);
    opacity: 0;
    display: none;
    transition: opacity 0.5s ease;
    animation: moonGlow 4s ease-in-out infinite;
}

@keyframes moonGlow {
    0%, 100% {
        box-shadow: 
            0 0 20px rgba(255, 234, 167, 0.6),
            0 0 40px rgba(255, 234, 167, 0.4),
            0 0 60px rgba(255, 234, 167, 0.2);
    }
    50% {
        box-shadow: 
            0 0 30px rgba(255, 234, 167, 0.8),
            0 0 50px rgba(255, 234, 167, 0.5),
            0 0 80px rgba(255, 234, 167, 0.3);
    }
}

/* 暗色模式显示月亮 */
:host(.dark) .moon {
    display: block;
    opacity: 1;
}

/* 迷雾层 - 多层营造深度 */
.mist-layer-1,
.mist-layer-2,
.mist-layer-3,
.mountain-mist,
.foreground-haze {
    mix-blend-mode: screen;
}

.mist-layer-1 {
    position: absolute;
    inset: 0;
    background: var(--mist-1);
    animation: mistDrift1 28s ease-in-out infinite;
}

.mist-layer-2 {
    position: absolute;
    inset: 0;
    background: var(--mist-2);
    animation: mistDrift2 35s ease-in-out infinite;
}

.mist-layer-3 {
    position: absolute;
    inset: 0;
    background: var(--mist-3);
    animation: mistDrift3 42s ease-in-out infinite;
}

@keyframes mistDrift1 {
    0%, 100% { transform: translateX(0) translateY(0); opacity: 0.85; }
    33% { transform: translateX(30px) translateY(-5px); opacity: 0.95; }
    66% { transform: translateX(-20px) translateY(3px); opacity: 0.9; }
}

@keyframes mistDrift2 {
    0%, 100% { transform: translateX(0); opacity: 0.7; }
    50% { transform: translateX(-40px); opacity: 0.85; }
}

@keyframes mistDrift3 {
    0%, 100% { transform: translateX(0); opacity: 0.6; }
    50% { transform: translateX(35px); opacity: 0.75; }
}

/* 远山层 - 多层叠加 */
.distant-mountains {
    position: absolute;
    bottom: 60px;
    left: -15%;
    right: -15%;
    height: 160px;
}

.mountain-layer {
    position: absolute;
    bottom: 0;
    width: 130%;
    left: -15%;
}

.mountain-1 {
    height: 95px;
    opacity: 0.15;
    background: linear-gradient(180deg, hsl(var(--accent-hue), 25%, calc(63% + var(--accent-lightness-offset))), hsl(var(--accent-hue), 19%, calc(51% + var(--accent-lightness-offset))));
    filter: blur(3px);
    animation: mountainFloat1 38s ease-in-out infinite;
}

.mountain-2 {
    height: 125px;
    opacity: 0.1;
    background: linear-gradient(180deg, hsl(var(--accent-hue), 22%, calc(57% + var(--accent-lightness-offset))), hsl(var(--accent-hue), 21%, calc(45% + var(--accent-lightness-offset))));
    filter: blur(5px);
    animation: mountainFloat2 45s ease-in-out infinite;
}

.mountain-3 {
    height: 145px;
    opacity: 0.07;
    background: linear-gradient(180deg, hsl(var(--accent-hue), 19%, calc(51% + var(--accent-lightness-offset))), hsl(var(--accent-hue), 24%, calc(38% + var(--accent-lightness-offset))));
    filter: blur(7px);
    animation: mountainFloat3 52s ease-in-out infinite;
}

/* clip-path 在 Obsidian 1.7.4 不支持，山体退化为模糊色块（可接受降级）；保留动画/滤镜/透明度不变 */

@keyframes mountainFloat1 {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(20px); }
}

@keyframes mountainFloat2 {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-18px); }
}

@keyframes mountainFloat3 {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(15px); }
}

/* 山间雾气 */
.mountain-mist {
    position: absolute;
    bottom: 30px;
    left: -10%;
    right: -10%;
    height: 80px;
    background: var(--mountain-mist);
    animation: mountainMistFloat 25s ease-in-out infinite;
}

@keyframes mountainMistFloat {
    0%, 100% { transform: translateX(0) scale(1); opacity: 0.8; }
    50% { transform: translateX(40px) scale(1.05); opacity: 0.95; }
}

/* 江面 */
.river-surface {
    position: absolute;
    bottom: 25px;
    left: 5%;
    right: 40%;
    height: 30px;
    background: linear-gradient(180deg, 
        rgba(60, 100, 120, 0.1) 0%, 
        rgba(80, 120, 140, 0.15) 50%, 
        rgba(60, 100, 120, 0.1) 100%);
    border-radius: 50%;
    filter: blur(3px);
    animation: riverWave 8s ease-in-out infinite;
}

:host(.dark) .river-surface {
    background: linear-gradient(180deg,
        hsla(calc(var(--accent-hue) + 15), 33%, calc(47% + var(--accent-lightness-offset)), 0.06) 0%,
        hsla(calc(var(--accent-hue) + 15), 35%, calc(55% + var(--accent-lightness-offset)), 0.1) 50%,
        hsla(calc(var(--accent-hue) + 15), 33%, calc(47% + var(--accent-lightness-offset)), 0.06) 100%);
    filter: blur(3px) drop-shadow(0 0 4px hsla(calc(var(--accent-hue) + 0), 35%, calc(55% + var(--accent-lightness-offset)), 0.15));
}

@keyframes riverWave {
    0%, 100% { transform: scaleX(1); }
    50% { transform: scaleX(1.03); }
}

/* 舟 */
.boat-container {
    position: absolute;
    bottom: 40px;
    left: -10%;
    animation: boatFloat 6s ease-in-out infinite, boatDrift 45s linear infinite;
}

/* 暗色模式下原地浮动 + 发光 */
:host(.dark) .boat-container {
    left: 12%;
    animation: boatFloat 6s ease-in-out infinite;
}

:host(.dark) .boat {
    filter: drop-shadow(0 0 6px hsla(calc(var(--accent-hue) + -8), 53%, 71%, 0.4)) drop-shadow(0 0 12px hsla(calc(var(--accent-hue) + -7), 45%, 61%, 0.2));
    opacity: 0.6;
}

:host(.dark) .boat::before {
    background: linear-gradient(90deg,
        transparent 0%,
        hsla(calc(var(--accent-hue) + -7), 38%, 53%, 0.5) 20%,
        hsla(calc(var(--accent-hue) + -7), 50%, 65%, 0.7) 50%,
        hsla(calc(var(--accent-hue) + -7), 38%, 53%, 0.5) 80%,
        transparent 100%);
}

.boat {
    position: relative;
    width: 50px;
    height: 15px;
    filter: blur(0.5px);
    opacity: 0.45;
}

.boat::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        hsla(calc(var(--accent-hue) + 0), 27%, calc(22% + var(--accent-lightness-offset)), 0.4) 20%, 
        hsla(calc(var(--accent-hue) + 0), 29%, calc(27% + var(--accent-lightness-offset)), 0.55) 50%, 
        hsla(calc(var(--accent-hue) + 0), 27%, calc(22% + var(--accent-lightness-offset)), 0.4) 80%, 
        transparent 100%);
    border-radius: 0 0 40% 40% / 0 0 100% 100%;
}

@keyframes boatFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-2px) rotate(0.5deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-1px) rotate(-0.3deg); }
}

@keyframes boatDrift {
    0% { left: -15%; }
    100% { left: 115%; }
}

/* 竹林层 */
.bamboo-forest {
    position: absolute;
    bottom: 0;
    left: -10%;
    right: -10%;
    height: 300px;
    overflow: hidden;
}

.bamboo-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100%;
}

/* 竹子造型 - 简化、朦胧 */
.bamboo-stalk {
    position: absolute;
    bottom: 0;
    background: linear-gradient(90deg, 
        hsla(calc(var(--accent-hue) + 0), 57%, calc(27% + var(--accent-lightness-offset)), 0.55), 
        hsla(calc(var(--accent-hue) + 0), 50%, calc(39% + var(--accent-lightness-offset)), 0.8), 
        hsla(calc(var(--accent-hue) + 0), 57%, calc(27% + var(--accent-lightness-offset)), 0.55));
    border-radius: var(--radius-3xs) var(--radius-3xs) var(--radius-1) var(--radius-1);
    transform-origin: bottom center;
}

/* 竹子内部内容 - 根部不动，上部摇曳 */
.bamboo-inner {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    top: 0;
    transform-origin: bottom center;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
}

/* 远景竹 - 更多更密 */
.bamboo-far .bamboo-stalk {
    width: 2px;
    opacity: 0.28;
}

/* 中景竹 */
.bamboo-mid .bamboo-stalk {
    width: 3.5px;
    opacity: 0.5;
}

/* 近景竹 */
.bamboo-near .bamboo-stalk {
    width: 5px;
    opacity: 0.72;
}

/* 竹叶 - 简化为笔触效果 */
.bamboo-leaf-tip {
    position: absolute;
    width: 3px;
    height: 14px;
    background: linear-gradient(180deg, 
        hsla(calc(var(--accent-hue) + 0), 52%, calc(41% + var(--accent-lightness-offset)), 0.7), 
        hsla(calc(var(--accent-hue) + 0), 62%, calc(31% + var(--accent-lightness-offset)), 0.9));
    border-radius: 50% 50% 80% 20% / 90% 90% 10% 10%;
    transform-origin: bottom center;
    opacity: 0.75;
}

/* 地面层 */
.forest-floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 45px;
    background: linear-gradient(180deg, 
        hsla(calc(var(--accent-hue) + -9), 18%, 38%, 0.15) 0%, 
        hsla(calc(var(--accent-hue) + -9), 23%, 30%, 0.3) 100%);
    filter: blur(4px);
}

.forest-floor::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(ellipse at 25% 15%, hsla(calc(var(--accent-hue) + -9), 24%, 28%, 0.18) 0%, transparent 45%),
        radial-gradient(ellipse at 70% 10%, hsla(calc(var(--accent-hue) + -9), 24%, 28%, 0.14) 0%, transparent 40%),
        radial-gradient(ellipse at 90% 20%, hsla(calc(var(--accent-hue) + -9), 24%, 28%, 0.1) 0%, transparent 35%);
}

/* 前景朦胧层 */
.foreground-haze {
    position: absolute;
    inset: 0;
    background: var(--foreground-haze);
    pointer-events: none;
}

/* 飘落竹叶 - 更淡，风吹效果 */
.drifting-leaf {
    position: absolute;
    width: 5.5px;
    height: 17px;
    background: linear-gradient(180deg, 
        hsla(calc(var(--accent-hue) + -7), 19%, 46%, 0.32), 
        hsla(calc(var(--accent-hue) + -7), 24%, 36%, 0.52));
    border-radius: 50% 50% 70% 30% / 70% 70% 30% 30%;
    opacity: 0.42;
    animation: leafDrift linear infinite;
    pointer-events: none;
}

@keyframes leafDrift {
    0% {
        transform: translate(0, -70px) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 0.42;
    }
    35% {
        transform: translate(25px, 40px) rotate(120deg);
    }
    60% {
        transform: translate(75px, 150px) rotate(260deg);
    }
    85% {
        opacity: 0.32;
    }
    100% {
        transform: translate(120px, 360px) rotate(420deg);
        opacity: 0;
    }
}

/* 竹叶轻颤 */
@keyframes leafTremble {
    0%, 100% { transform: rotate(var(--r, 0deg) - 2.5deg); }
    50% { transform: rotate(var(--r, 0deg) + 2.5deg); }
}

/* 主题按钮 */
.bamboo-controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    justify-content: center;
    flex-wrap: wrap;
}

.bamboo-garden-btn {
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: hsla(calc(var(--accent-hue) + 0), 23%, calc(30% + var(--accent-lightness-offset)), 0.6);
    font-size: var(--type-sm);
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color 0.25s ease;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.bamboo-garden-btn:hover {
    color: hsla(calc(var(--accent-hue) + 0), 26%, calc(26% + var(--accent-lightness-offset)), 0.9);
}

.bamboo-garden-btn.active {
    color: hsla(calc(var(--accent-hue) + 0), 26%, calc(26% + var(--accent-lightness-offset)), 1);
    font-weight: 500;
}

/* 暗色模式适配 */
:host(.dark) .bamboo-garden-container {
    background: linear-gradient(180deg, 
        hsl(var(--accent-hue), 47%, calc(7% + var(--accent-lightness-offset))) 0%, 
        hsl(var(--accent-hue), 21%, calc(6% + var(--accent-lightness-offset))) 20%, 
        hsl(var(--accent-hue), 38%, calc(7% + var(--accent-lightness-offset))) 50%, 
        hsl(var(--accent-hue), 50%, calc(4% + var(--accent-lightness-offset))) 100%);
    border-color: hsla(calc(var(--accent-hue) + 0), 30%, 28%, 0.25);
    /* 暗色深渊凹陷：顶部微光 + 底部深陷 + 竹绿调投影 */
    box-shadow:
        inset 0 1px 0 hsla(calc(var(--accent-hue) + 0), 35%, 50%, 0.06),
        inset 0 10px 36px hsla(calc(var(--accent-hue) + 0), 20%, 3%, 0.55),
        inset 0 -1px 0 hsla(calc(var(--accent-hue) + 0), 25%, 15%, 0.3),
        0 4px 16px hsla(calc(var(--accent-hue) + 0), 25%, 3%, 0.4),
        0 12px 40px hsla(calc(var(--accent-hue) + 0), 20%, 2%, 0.45);
}

:host(.dark) .bamboo-garden-container::after {
    background: linear-gradient(
        180deg,
        hsla(calc(var(--accent-hue) + 0), 40%, 80%, 0.04) 0%,
        transparent 30%
    );
}

:host(.dark) .bamboo-stalk {
    background: linear-gradient(90deg,
        rgba(var(--primary-rgb), 0.65),
        rgba(var(--primary-rgb), 0.95),
        rgba(var(--primary-rgb), 0.65));
    box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.3), 0 0 40px rgba(var(--primary-rgb), 0.18);
    filter: drop-shadow(0 0 10px rgba(var(--primary-rgb), 0.35));
}

:host(.dark) .bamboo-leaf-tip {
    background: linear-gradient(180deg,
        rgba(var(--primary-rgb), 0.8),
        rgba(var(--primary-rgb), 1));
    filter: drop-shadow(0 0 5px rgba(var(--primary-rgb), 0.45));
}

:host(.dark) .mountain-1,
:host(.dark) .mountain-2,
:host(.dark) .mountain-3 {
    display: none;
}

:host(.dark) .forest-floor {
    background: linear-gradient(180deg,
        hsla(calc(var(--accent-hue) + -12), 38%, 13%, 0.4) 0%,
        hsla(calc(var(--accent-hue) + -15), 50%, 8%, 0.65) 100%);
}

:host(.dark) .drifting-leaf {
    background: linear-gradient(180deg,

    border-color: rgba(var(--primary-rgb), 0.35);
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
    .display-panel {
        /* Same min() formula; at 375px this gives 1rem margin on each side */
        width: min(280px, 100% - 2rem);
    }

    .display-preset-btn,
    .display-font-preset-btn,
    .display-gap-preset-btn,
    .display-hue-preset-btn,
    .display-lightness-preset-btn {
        min-height: var(--touch-target);
    }
}
