       本页不渲染任何具体业务，只负责承载——宿主把 moduleId 注入后，
       ModuleManager 取回模块代码并在沙箱内执行，由模块自己 mount 出界面。
       故依赖极简：仅常量 + 通信层（bridge）+ 模块管理器，不含日报渲染 / FAB 等主应用模块。 -->
  <div id="module-view-root"></div>

  <script type="module" src="assets/scripts/utils/constants.js?__BUILD__"></script>
  <script type="module" src="assets/scripts/utils/storageAdapter.js?__BUILD__"></script>
  <script type="module" src="assets/scripts/storage/bridge.js?__BUILD__"></script>
  <script type="module" src="assets/scripts/utils/protocol.js?__BUILD__"></script>
  <script type="module" src="assets/scripts/handlers/moduleManager.js?__BUILD__"></script>
