<!DOCTYPE html>
<html lang="zh-CN" class="theme-bamboo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="description" content="Bamboo Immortals - 画中卷">
<meta name="theme-color" content="#2D5A27">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%232D5A27' width='32' height='32' rx='6'/><path d='M16 6v20M16 10l-4 2M16 10l4 2M16 16l-3 1.5M16 16l3 1.5' stroke='%23ffffff' stroke-width='2' stroke-linecap='round'/></svg>">
<title>画中卷</title>
<!-- 字体：纯系统字体栈（见 base.css --tw-font-*），不加载 Google Fonts，离线 / 中国大陆均可一致呈现 -->
<style data-src="assets/styles/variables.css">
/* ========== 全局变量（竹林中国风 - 亮色模式） ==========
 *
 * 命名规范（三层架构）：
 *   基础色板层  --{palette}-{shade}       例：--bamboo-deep, --bm-primary
 *   语义层      --{semantic}-{variant}     例：--text-primary, --status-danger
 *   组件层      --{component}-{property}   例：--tag-execute-bg, --kpi-up-bg
 *   RGB 通道    --{name}-rgb                例：--bm-primary-rgb, --danger-rgb
 *   动效/间距/圆角/字体  --{category}-{step}  例：--space-3, --radius-md, --type-sm
 *
 * 规范前缀（Task 8 统一命名空间）：
 *   新增自定义属性必须使用 --bm-* 或 --bamboo-* 前缀（lint R10 强制）。
 *   以下旧名保留为兼容别名（定义见下方，新代码禁止使用）：
 *     --primary-rgb          → 用 --bm-primary-rgb
 *     --primary-alt-rgb      → 用 --bm-primary-alt-rgb
 *     --bamboo-primary       → 用 --bm-primary
 *     --bamboo-primary-light → 用 --bm-primary-light
 *     --bamboo-primary-dark  → 用 --bamboo-dark（已废弃）
 *
 * 禁止：裸写 #fff / #000 / white / black / rgb(255,255,255) — 必须走令牌
 * 禁止：裸写 px 圆角 / px 字号 — 必须走 --radius-* / --type-*
 * 废弃别名（保留兼容，新代码禁止使用）：
 *   --font-size-* → 用 --type-*
 *   --bamboo-text-muted → 用 --text-tertiary
 *   --bamboo-text-secondary → 用 --text-secondary
 *   --bamboo-primary-dark → 用 --bamboo-dark
 *   --tag-execute-bg → 用 --bamboo-primary（亮色）/ --bamboo-light（暗色）
 *   --tag-miss-bg → 用 --ink-pale
 *   --bamboo-success → 用 --bamboo-primary（当前同值）
 *   --status-success → 用 --bamboo-primary（当前同值）
 * ======================================================== */
:host,
:root {
    /* === 隐私模糊强度（防偷窥模式，可变）===
       由 PrivacyMode.setLevel 写入，单位 px；0 = 关闭（清晰）。
       仅 [data-private] 元素消费该变量，UI 骨架不受影响。 */
    --privacy-blur: 10px;

    /* === 主题色相（可变）=== */
    --accent-hue: 120;  /* 默认竹青绿，可通过 DisplayManager 色相滑块调整 */

    /* === 明度偏移（可变）=== */
    --accent-lightness-offset: 0%;  /* 默认 0%，可通过 DisplayManager 明度滑块调整（范围 ~-15% ~ +15%）*/

    /* === z-index 层级体系（全局统一，禁止再写裸数字）=== */
    --z-layer-below: -2;       /* 装饰层/背景装饰 */
    --z-layer-behind: -1;      /* 背景伪元素/装饰 */
    --z-layer-base: 0;         /* 正常流 */
    --z-layer-raised: 1;       /* 轻微抬起（card hover 等）*/
    --z-layer-floating: 2;     /* 浮动（日期悬浮、toolbar）*/
    --z-layer-dropdown: 100;   /* 下拉菜单/颜色面板 */
    --z-layer-keyboard-hint: 900;     /* 键盘快捷键提示 */
    --z-layer-tooltip: 9999;          /* tooltip / 悬浮预览 / KPI 悬浮 */
    --z-layer-overlay: 10000;         /* 通用遮罩层（FAB 背景 / skip-link / modal-overlay / 弹层底部）*/
    --z-layer-modal: 10001;           /* 模态容器 / widget 覆盖 */
    --z-layer-toast: 10010;           /* Toast 全屏通知 */
    --z-layer-max: 11000;             /* 最顶层（搜索/日期选择）*/

    /* === 基础色彩系统（HSL 动态生成）=== */
    --bamboo-deep: hsl(calc(var(--accent-hue) - 7), 40%, calc(25% + var(--accent-lightness-offset)));
    --bamboo-deep-rgb: 45, 90, 39;
    --bamboo-dark: hsl(calc(var(--accent-hue) - 8), 39%, calc(34% + var(--accent-lightness-offset)));
    --bm-primary: hsl(var(--accent-hue), 27%, calc(48% + var(--accent-lightness-offset)));
    --bamboo-primary: var(--bm-primary); /* alias — 新代码请用 --bm-primary */
    --bamboo-light: hsl(var(--accent-hue), 33%, calc(61% + var(--accent-lightness-offset)));
    --bamboo-pale: hsl(var(--accent-hue), 35%, calc(75% + var(--accent-lightness-offset)));
    --bm-primary-light: hsl(var(--accent-hue), 39%, calc(80% + var(--accent-lightness-offset)));
    --bamboo-primary-light: var(--bm-primary-light); /* alias — 新代码请用 --bm-primary-light */
    --bm-primary-rgb: 90, 154, 90;
    --primary-rgb: var(--bm-primary-rgb); /* alias — 新代码请用 --bm-primary-rgb */
    --deep-rgb: 45, 90, 39;
    --danger-rgb: 201, 72, 59;
    --gold-rgb: 212, 175, 55;
    /* 中性通道（禁止再写裸 255,255,255 / 0,0,0，统一走令牌） */
    --white-rgb: 255, 255, 255;
    --black-rgb: 0, 0, 0;
    --rice-paper-rgb: 250, 248, 240;
    /* 纯色实色通道（禁止再写裸 #fff / #000，统一走令牌；暗色下白仍是白，无需重定义） */
    --white: #ffffff;
    --black: #000000;
    /* 纯色不透明表面（亮色纯白 / 暗色深表面，随主题自适应） */
    --surface-solid: #ffffff;
    --pale-rgb: 168, 213, 168;
    --sky-azure-rgb: 135, 206, 235;
    --health-success-rgb: 126, 211, 33;
    --ticket-stub-bg-rgb: 148, 198, 148;
    --dark-surface-mid-rgb: 30, 50, 32;
    --dark-surface-rgb: 20, 38, 22;
    --gray-rgb: 149, 165, 166;
    --danger-alt-rgb: 231, 76, 60;
    --warning-yellow-rgb: 251, 191, 36;
    --warning-orange-rgb: 245, 166, 35;
    --info-blue-rgb: 66, 133, 244;
    --teal-rgb: 26, 167, 106;
    --danger-bright-rgb: 239, 68, 68;
    --amber-rgb: 230, 162, 60;
    --purple-rgb: 154, 90, 154;
    --purple-pale-rgb: 196, 138, 196;
    --mint-rgb: 168, 230, 207;
    --gold-bright-rgb: 255, 215, 0;
    --pale-green-rgb: 245, 250, 245;
    --pale-green-alt-rgb: 248, 252, 248;
    --surface-deep-rgb: 20, 35, 20;
    --surface-deep-alt-rgb: 25, 40, 25;
    --bm-primary-alt-rgb: 107, 174, 107;
    --primary-alt-rgb: var(--bm-primary-alt-rgb); /* alias — 新代码请用 --bm-primary-alt-rgb */
    --danger-soft-rgb: 220, 100, 100;
    --red-pale-rgb: 255, 240, 240;
    --amber-brown-rgb: 180, 140, 100;
    --gray-mid-rgb: 90, 90, 90;
    --green-pale-rgb: 200, 224, 200;
    --green-bright-rgb: 143, 216, 143;
    --amber-deep-rgb: 245, 158, 11;
    --orange-pale-rgb: 252, 191, 73;
    --blue-alt-rgb: 74, 144, 217;
    --danger-deep-rgb: 220, 38, 38;
    --gray-alt-rgb: 107, 114, 128;
    --red-bright-rgb: 200, 80, 80;
    --green-alt-rgb: 180, 220, 165;
    --green-very-bright-rgb: 200, 255, 150;
    --overdue-bg-rgb: 255, 240, 240;
    --overdue-bg-mid-rgb: 255, 235, 235;
    --overdue-bg-light-rgb: 255, 230, 230;

    /* 玉石纹理 — 亮色模式（即将到期 header 淡橙黄渐变） */
    --jade-cream-rgb: 255, 250, 240;
    --jade-cream-mid-rgb: 255, 245, 230;
    --jade-cream-deep-rgb: 255, 240, 220;
    --jade-warm-rgb: 255, 235, 210;

    --ticket-gold: #B8860B;
    --bamboo-text-muted: var(--ink-pale); /* DEPRECATED: 用 --text-tertiary */
    --bamboo-text-secondary: var(--ink-light); /* DEPRECATED: 用 --text-secondary */
    --bamboo-border: rgba(var(--primary-rgb), 0.25);
    --bamboo-background: rgba(var(--primary-rgb), 0.06);
    --bamboo-primary-dark: var(--bamboo-dark); /* DEPRECATED: 用 --bamboo-dark */
    --bamboo-success: var(--bamboo-primary); /* DEPRECATED: 用 --bamboo-primary */
    --bamboo-warning: #c9a227;
    --bamboo-warning-pale: #fff59d;
    --bamboo-error: #dc3545;
    --bamboo-card: var(--card-bg);
    --sky-azure: #87CEEB;
    --sky-pale: #B8E2F8;
    --sky-mist: #E8F6FC;
    --leaf-green: #6B8E23;
    --leaf-light: #8FBC3A;
    --rice-paper: #FAF8F0;
    --ivory: #FFFFF0;
    --cinnabar: #C9483B;
    --gold: #D4AF37;

    /* === 健康评分色彩系统 === */
    --health-danger: #EF4444;
    --health-warning: #F59E23;
    --health-success-clr: #7ED321;
    --health-info: #4A90D9;
    --health-neutral: #95A5A6;
    --health-pink: #E91E63;
    --health-purple: #9C27B0;
    --health-orange: #FF9800;
    --health-gold-clr: #D97706;

    /* === 文字色彩系统 === */
    --ink-dark: #1A1A1A;
    --ink-medium: #404040;
    --ink-light: #555555;
    --ink-pale: #707070;

    /* === 背景色彩系统 - 重新设计：淡雅意境 === */
    --bg-gradient-start: hsl(var(--accent-hue), 18%, calc(96% + var(--accent-lightness-offset)));
    --bg-gradient-mid1: hsl(var(--accent-hue), 21%, calc(94% + var(--accent-lightness-offset)));
    --bg-gradient-mid2: hsl(var(--accent-hue), 17%, calc(90% + var(--accent-lightness-offset)));
    --bg-gradient-end: hsl(var(--accent-hue), 20%, calc(95% + var(--accent-lightness-offset)));
    --card-bg: rgba(var(--white-rgb), 0.60);
    --card-glass: rgba(var(--white-rgb), 0.55);
    /* 玻璃拟态 fallback：当 backdrop-filter 不被支持或背景过透时，切回不透明表面色 */
    --card-bg-fallback: var(--surface-solid);

    /* === 文字语义变量 === */
    --text-primary: var(--ink-dark);
    --text-secondary: var(--ink-light);
    --text-tertiary: var(--ink-pale);
    --text-on-accent: var(--white); /* 强调色背景上的文字（tooltip / 选中按钮 / 状态徽标） */

    /* === 边框与阴影 === */
    --border-light: rgba(var(--primary-rgb), 0.25);
    --shadow: 0 20px 40px rgba(var(--deep-rgb), 0.12);
    
    /* === 统一过渡动画曲线 === */
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    
    /* === 点击反馈缩放比例 === */
    --scale-click: scale(0.96);
    --scale-tiny: scale(0.98);
    --scale-small: scale(0.95);
    
    /* === 阴影深度系统 === */
    --shadow-surface: 0 2px 8px rgba(var(--deep-rgb), 0.06), 0 1px 2px rgba(var(--deep-rgb), 0.04);    /* 表层 — 卡片内元素/微小投影 */
    --shadow-card: 0 4px 16px rgba(var(--deep-rgb), 0.08), 0 2px 4px rgba(var(--deep-rgb), 0.04);      /* 中层 — 可悬停卡片/基础面板 */
    --shadow-elevated: 0 8px 28px rgba(var(--deep-rgb), 0.12), 0 4px 8px rgba(var(--deep-rgb), 0.06);  /* 高层 — 下拉菜单/弹出层/悬停态 */
    --shadow-floating: 0 16px 48px rgba(var(--deep-rgb), 0.16), 0 8px 16px rgba(var(--deep-rgb), 0.08); /* 浮层 — 模态框/FAB/浮动面板 */
    
    /* === 按钮样式系统 === */
    --btn-primary-bg: linear-gradient(135deg, var(--bamboo-dark) 0%, var(--bamboo-primary) 100%);
    --btn-primary-hover: linear-gradient(135deg, var(--bamboo-primary) 0%, var(--bamboo-light) 100%);
    --btn-secondary-bg: rgba(var(--primary-rgb), 0.1);
    --btn-secondary-hover: rgba(var(--primary-rgb), 0.2);
    --btn-outline-border: 2px solid var(--bamboo-primary);
    --btn-outline-hover: rgba(var(--primary-rgb), 0.1);

    /* === 渐变变量 === */
    --section-title-gradient: linear-gradient(135deg, rgba(var(--deep-rgb), 0.45) 0%, rgba(var(--primary-rgb), 0.4) 50%, rgba(var(--primary-rgb), 0.35) 100%);
    --action-bg: linear-gradient(135deg, rgba(var(--primary-rgb), 0.55) 0%, rgba(var(--primary-rgb), 0.5) 100%);

    /* === 表格样式 === */
    --table-header-bg: rgba(var(--primary-rgb), 0.1);
    --table-border: rgba(var(--primary-rgb), 0.1);

    /* === 诊断卡片样式 === */
    --diagnosis-bg: rgba(var(--rice-paper-rgb), 0.8);
    --diagnosis-border: rgba(var(--primary-rgb), 0.1);
    --diagnosis-text: var(--ink-dark);
    --diagnosis-card-good-bg: rgba(var(--primary-rgb), 0.08);
    --diagnosis-card-warn-bg: rgba(var(--gold-rgb), 0.08);

    /* === 时间线样式 === */
    --timeline-stat-bg: rgba(var(--primary-rgb), 0.1);
    --progress-bg: rgba(var(--primary-rgb), 0.1);

    /* === KPI 卡片样式 === */
    --kpi-up-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--danger-rgb), 0.1) 100%);
    --kpi-down-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--primary-rgb), 0.1) 100%);
    --kpi-neutral-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--gold-rgb), 0.1) 100%);
    --kpi-break-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--sky-azure-rgb), 0.1) 100%);
    --kpi-up-border: rgba(var(--danger-rgb), 0.3);
    --kpi-up-delta-color: var(--cinnabar);

    /* === 呼吸动画 === */
    --breath-color: rgba(var(--primary-rgb), 0.4);

    /* === 标签样式 === */
    --tag-execute-bg: var(--bamboo-primary);
    --tag-miss-bg: var(--ink-pale);
    --tag-text-light: white;

    /* === 波浪与毛玻璃 === */
    --wave-color: rgba(var(--primary-rgb), 0.5);
    --glass-blur: 20px;
    --glass-highlight-strong: rgba(var(--white-rgb), 0.6);
    --glass-highlight-medium: rgba(var(--white-rgb), 0.4);
    --glass-highlight-soft: rgba(var(--white-rgb), 0.2);
    --glass-highlight-subtle: rgba(var(--white-rgb), 0.1);
    --glass-highlight-faint: rgba(var(--white-rgb), 0.04);
    --glass-highlight-wash: rgba(var(--white-rgb), 0.08);
    /* 预渲染渐变组合：避免浏览器在每帧重新计算 linear-gradient */
    --glass-card-gradient: linear-gradient(135deg, rgba(var(--white-rgb), 0.25) 0%, rgba(var(--white-rgb), 0.08) 50%, rgba(var(--white-rgb), 0.15) 100%), linear-gradient(45deg, rgba(var(--bamboo-deep-rgb),0.12) 0%, transparent 60%);

    /* === 圆角系统（统一为 2px 倍数，覆盖现网所有取值） ===
       映射约定（代码禁止再写裸 px 圆角）：
         2px→--radius-3xs   6px→--radius-2xs   8px→--radius-xs   10px→--radius-sm
         12px→--radius-md   14px→--radius-lg   16px→--radius-xl   18px→--radius-2xl
         20px→--radius-3xl  24px→--radius-4xl  28px→--radius-5xl
    */
    --radius-3xs: 2px;
    --radius-2xs: 6px;
    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius-md: 12px;
    --radius-lg: 14px;
    --radius-xl: 16px;
    --radius-2xl: 18px;
    --radius-3xl: 20px;
    --radius-4xl: 24px;
    --radius-5xl: 28px;
    /* 补充散落档位（代码禁止再用裸 px 圆角） */
    --radius-1: 1px;
    --radius-2-5: 2.5px;
    --radius-3: 3px;
    --radius-4: 4px;
    --radius-5: 5px;
    --radius-26: 26px;
    --radius-38: 38px;
    --radius-pill: 9999px;

    /* === 圆角语义层（组件级映射，代码应优先使用语义层而非裸 --radius-* 数值） ===
       数值层 --radius-* 定义于上方，语义层在此映射；暗色 :host(.dark) 继承同名变量，
       无需重复定义（数值层未在暗色覆写，语义层同样不需要）。 */
    --radius-card: var(--radius-lg);      /* 14px — 标准卡片圆角 (.bamboo-card / .item-card / .empty-state-card) */
    --radius-panel: var(--radius-xl);     /* 16px — 面板/区块圆角 (.fab-panel / section panel) */
    --radius-modal: var(--radius-2xl);    /* 18px — 模态框圆角 (.modal-content) */
    --radius-control: var(--radius-sm);   /* 10px — 表单控件圆角 (input / select / textarea) */
    --radius-tooltip: var(--radius-xs);   /* 8px — tooltip / 徽标圆角 */

    /* === 间距系统（统一为 8px 网格） === */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 28px;
    --space-8: 32px;

    /* === 字体系统 ===
       唯一标准：流体 --type-*（带 clamp，自适应视口）。
       下方 --font-size-* 仅为兼容别名，已映射到 --type-*，新代码禁止直接使用。
    */
    --font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-size-scale: 1;
    --section-gap-scale: 0.8;
    --font-size-xs: var(--type-xs);
    --font-size-sm: var(--type-sm);
    --font-size-base: var(--type-base);
    --font-size-md: var(--type-md);
    --font-size-lg: var(--type-lg);
    --font-size-xl: var(--type-xl);
    --font-size-2xl: var(--type-2xl);
    --line-height-tight: 1.3;
    --line-height-base: 1.5;
    --line-height-relaxed: 1.75;

    /* === 触控尺寸系统 === */
    --touch-min: 44px;
    --touch-comfortable: 48px;
    --touch-target: 44px;

    /* === Focus 样式系统（统一使用 box-shadow 格式） === */
    --focus-ring: 0 0 0 2px var(--bamboo-primary);
    --focus-ring-offset: 0 0 0 4px rgba(var(--primary-rgb), 0.25);
    --focus-ring-danger: 0 0 0 2px var(--cinnabar);
    --focus-transition: box-shadow 0.15s ease;

    /* === 状态色系统 === */
    --status-success: var(--bamboo-primary); /* DEPRECATED: 用 --bamboo-primary */
    --status-warning: var(--gold);
    --status-danger: var(--cinnabar);
    --status-info: #4FC3F7;
    --status-success-bg: rgba(var(--primary-rgb), 0.1);
    --status-warning-bg: rgba(var(--gold-rgb), 0.1);
    --status-danger-bg: rgba(var(--danger-rgb), 0.1);
    --status-info-bg: rgba(var(--info-rgb), 0.1);
    --info-rgb: 79, 195, 247;
    /* === 竹林绿辉光阴影（自适应暗色模式） === */
    --bamboo-glow-sm: 0 2px 8px rgba(var(--primary-rgb), 0.4);
    --bamboo-glow-xs: 0 1px 4px rgba(var(--primary-rgb), 0.3);

    /* === 浮层设计令牌（Toast / Confirm / 选择器统一语言：留白素笺） === */
    --overlay-surface: var(--card-bg);
    --overlay-border-width: 1px;
    --overlay-border-style: solid;
    --overlay-border-color: var(--bamboo-border);
    --overlay-border: var(--overlay-border-width) var(--overlay-border-style) var(--overlay-border-color);
    --overlay-shadow: 0 6px 28px rgba(26, 40, 24, 0.12);
    --overlay-shadow-soft: 0 2px 12px rgba(26, 40, 24, 0.08);
    --ease-cn: cubic-bezier(0.22, 0.61, 0.36, 1);

    /* === 内容宽度系统（用户可调） === */
    --content-max: 1200px;            /* 标准内容最大宽度（响应式容器基准） */
    --content-max-wide: 1100px;       /* 宽屏内容最大宽度 */
    --content-max-width: var(--content-max);
    --content-max-width-wide: var(--content-max-wide);  /* 宽屏默认，用户设置后此值同步更新 */

    /* === 动效时长系统 === */
    --duration-instant: 100ms;
    --duration-fast: 200ms;
    --duration-normal: 300ms;
    --duration-slow: 500ms;
    --duration-slower: 800ms;
}

/* ========== 暗色模式（竹林星光暗色，完整覆盖所有变量） ========== */
:host(.dark) {
    /* 竹林星光 — 深邃、高级、有层次感的暗色背景 */
    --bm-primary-rgb: 130, 195, 130;
    --primary-rgb: var(--bm-primary-rgb); /* alias */
    --deep-rgb: 45, 90, 53;
    --bamboo-deep-rgb: 45, 90, 53;
    --danger-rgb: 255, 107, 107;
    --danger-alt-rgb: 255, 107, 107;
    --gold-rgb: 255, 217, 61;
    /* 中性通道（暗色同样禁止裸白/黑字面量） */
    --white-rgb: 255, 255, 255;
    --black-rgb: 0, 0, 0;
    --rice-paper-rgb: 250, 248, 240;
    /* 纯色不透明表面（暗色深表面，随主题自适应） */
    --surface-solid: #1c2a1e;
    --pale-rgb: 184, 216, 184;
    --sky-azure-rgb: 116, 192, 252;
    --health-success-rgb: 126, 211, 33;
    --danger-bright-rgb: 255, 107, 107;
    --amber-rgb: 245, 166, 35;
    --purple-rgb: 154, 90, 154;
    --purple-pale-rgb: 196, 138, 196;
    --mint-rgb: 168, 230, 207;
    --gold-bright-rgb: 255, 215, 0;
    --pale-green-rgb: var(--pale-green-rgb-dark, 30, 50, 32);
    --pale-green-alt-rgb: var(--pale-green-alt-rgb-dark, 25, 45, 27);
    --surface-deep-rgb: 15, 25, 15;
    --overdue-bg-rgb: 75, 50, 50;
    --overdue-bg-mid-rgb: 65, 45, 45;
    --overdue-bg-light-rgb: 55, 35, 35;
    --surface-dark-rgb: 20, 38, 22;
    --surface-dark-rgb-mid: 25, 48, 28;
    --surface-dark-rgb-end: 30, 55, 32;
    --bm-primary-alt-rgb: 130, 195, 130;
    --primary-alt-rgb: var(--bm-primary-alt-rgb); /* alias */
    --danger-soft-rgb: 255, 120, 120;
    --red-pale-rgb: 40, 20, 20;
    --gray-mid-rgb: 120, 120, 120;
    --green-pale-rgb: 25, 45, 27;
    --amber-deep-rgb: 245, 158, 11;
    --orange-pale-rgb: 180, 120, 50;
    --blue-alt-rgb: 74, 144, 217;
    --danger-deep-rgb: 255, 107, 107;
    --gray-alt-rgb: 149, 165, 166;
    --red-bright-rgb: 255, 120, 120;
    --green-alt-rgb: 130, 195, 130;
    --green-very-bright-rgb: 150, 230, 100;
    --jade-cream-rgb: 255, 250, 240;
    --jade-cream-mid-rgb: 255, 245, 230;
    --jade-cream-deep-rgb: 255, 240, 220;
    --jade-warm-rgb: 255, 235, 210;
    --jade-dark-rgb: 65, 55, 45;
    --jade-dark-mid-rgb: 55, 45, 35;
    --jade-dark-deep-rgb: 45, 35, 25;
    --jade-dark-warm-rgb: 75, 60, 45;
    --jade-dark-warm-mid-rgb: 65, 50, 35;
    --jade-dark-warm-light-rgb: 55, 42, 28;
    
    /* 文字：柔和但清晰，亮度提升以通过 WCAG AA 4.5:1（暗色卡片背景 ~10% L） */
    --ink-dark: hsl(var(--accent-hue), 18%, calc(91% + var(--accent-lightness-offset)));
    --ink-medium: hsl(var(--accent-hue), 20%, calc(81% + var(--accent-lightness-offset)));
    --ink-light: hsl(var(--accent-hue), 17%, calc(70% + var(--accent-lightness-offset)));
    --ink-pale: hsl(var(--accent-hue), 6%, calc(60% + var(--accent-lightness-offset)));
    --bamboo-text-muted: hsl(var(--accent-hue), 6%, calc(60% + var(--accent-lightness-offset)));
    --bamboo-text-secondary: hsl(var(--accent-hue), 20%, calc(81% + var(--accent-lightness-offset)));
    
    /* 竹林色调：降低饱和度，增添银灰质感（跟随 --accent-hue） */
    --bamboo-deep: hsl(calc(var(--accent-hue) + 5), 34%, calc(26% + var(--accent-lightness-offset)));
    --bamboo-dark: hsl(calc(var(--accent-hue) + 6), 35%, calc(25% + var(--accent-lightness-offset)));
    --bm-primary: hsl(calc(var(--accent-hue) + 2), 25%, calc(47% + var(--accent-lightness-offset)));
    --bamboo-primary: var(--bm-primary); /* alias */
    --bamboo-light: hsl(var(--accent-hue), 39%, calc(65% + var(--accent-lightness-offset)));
    --bamboo-pale: hsl(var(--accent-hue), 30%, calc(78% + var(--accent-lightness-offset)));
    --bm-primary-light: rgba(var(--bm-primary-rgb), 0.6);
    --bamboo-primary-light: var(--bm-primary-light); /* alias */
    --bamboo-warning: #ffe082;
    --bamboo-warning-pale: #fffde7;
    --bamboo-error: #ef5350;
    --bamboo-success: var(--bamboo-primary);
    --bamboo-background: rgba(var(--primary-rgb), 0.1);
    --bamboo-primary-dark: var(--bamboo-dark);
    --bamboo-card: var(--card-bg);
    
    /* 背景层次：深邃午夜绿渐变 —— 明度跨度拉大（7%→16%），中段加一道柔光带，
       让暗色下的整页页面级渐变清晰可辨，而非近乎平涂的深色 */
    --bg-gradient-start: hsl(calc(var(--accent-hue) + 16), 30%, calc(13% + var(--accent-lightness-offset)));
    --bg-gradient-mid1: hsl(calc(var(--accent-hue) + 6), 34%, calc(7% + var(--accent-lightness-offset)));
    --bg-gradient-mid2: hsl(calc(var(--accent-hue) + 28), 38%, calc(16% + var(--accent-lightness-offset)));
    --bg-gradient-end: hsl(calc(var(--accent-hue) + 2), 30%, calc(9% + var(--accent-lightness-offset)));
    
    /* 卡片：深邃中透出微光，跟随色相和明度 */
    /* 暗色已全局关闭 backdrop-filter（dark.css :host(.dark) *），原"提高不透明度防模糊伪影"
       的理由已不存在；此处保留一定透明度，让整页页面级渐变能透过卡片显现 */
    --card-bg: hsla(var(--accent-hue), 18%, calc(10% + var(--accent-lightness-offset)), 0.60);
    --card-glass: hsla(var(--accent-hue), 18%, calc(10% + var(--accent-lightness-offset)), 0.84);
    /* 玻璃拟态 fallback：当 backdrop-filter 不被支持或背景过透时，切回不透明表面色 */
    --card-bg-fallback: var(--surface-solid);

    /* 文字语义 — 亮度提升至 WCAG AA 4.5:1+ */
    --text-primary: hsl(var(--accent-hue), 18%, calc(91% + var(--accent-lightness-offset)));
    --text-secondary: hsl(var(--accent-hue), 15%, calc(74% + var(--accent-lightness-offset)));
    --text-tertiary: hsl(var(--accent-hue), 11%, calc(66% + var(--accent-lightness-offset)));
    --text-on-accent: var(--white); /* 暗色下强调色仍为深底，白字保持高对比 */
    
    /* 边框：微妙的星光边框 */
    --border-light: rgba(var(--primary-rgb), 0.2);
    --bamboo-border: rgba(var(--primary-rgb), 0.25);
    
    /* 阴影：深邃但不失层次 */
    --shadow: 0 20px 40px rgba(var(--black-rgb), 0.4);
    --shadow-surface: 0 2px 8px rgba(var(--black-rgb), 0.25), 0 1px 2px rgba(var(--black-rgb), 0.15);
    --shadow-card: 0 4px 16px rgba(var(--black-rgb), 0.3), 0 2px 4px rgba(var(--black-rgb), 0.2);
    --shadow-elevated: 0 8px 28px rgba(var(--black-rgb), 0.35), 0 4px 8px rgba(var(--black-rgb), 0.25);
    --shadow-floating: 0 16px 48px rgba(var(--black-rgb), 0.45), 0 8px 16px rgba(var(--black-rgb), 0.3);
    
    /* 渐变：星空微光 */
    --section-title-gradient: linear-gradient(135deg, hsla(calc(var(--accent-hue) + 11), 33%, calc(26% + var(--accent-lightness-offset)), 0.7) 0%, rgba(var(--primary-rgb), 0.6) 50%, rgba(var(--primary-rgb), 0.5) 100%);
    --action-bg: linear-gradient(135deg, hsla(calc(var(--accent-hue) + 11), 33%, calc(26% + var(--accent-lightness-offset)), 0.7) 0%, rgba(var(--primary-rgb), 0.6) 100%);
    
    /* 按钮 */
    --btn-primary-bg: linear-gradient(135deg, var(--bamboo-dark) 0%, var(--bamboo-primary) 100%);
    --btn-primary-hover: linear-gradient(135deg, var(--bamboo-primary) 0%, var(--bamboo-light) 100%);
    --btn-secondary-bg: rgba(var(--primary-rgb), 0.12);
    --btn-secondary-hover: rgba(var(--primary-rgb), 0.22);
    --btn-outline-border: 2px solid var(--bamboo-primary);
    --btn-outline-hover: rgba(var(--primary-rgb), 0.18);
    
    /* 表格 */
    --table-header-bg: rgba(var(--primary-rgb), 0.12);
    --table-border: rgba(var(--primary-rgb), 0.18);
    
    /* 诊断卡片 */
    --diagnosis-bg: hsla(calc(var(--accent-hue) + 5), 30%, calc(8% + var(--accent-lightness-offset)), 0.92);
    --diagnosis-border: rgba(var(--primary-rgb), 0.2);
    --diagnosis-text: hsl(var(--accent-hue), 22%, calc(87% + var(--accent-lightness-offset)));
    --diagnosis-card-good-bg: rgba(var(--primary-rgb), 0.12);
    --diagnosis-card-warn-bg: rgba(180, 140, 60, 0.12);
    
    /* 时间线与进度 */
    --timeline-stat-bg: rgba(var(--primary-rgb), 0.1);
    --progress-bg: rgba(var(--primary-rgb), 0.15);
    --breath-color: hsla(calc(var(--accent-hue) + 0), 35%, calc(64% + var(--accent-lightness-offset)), 0.4);
    
    /* KPI 卡片 */
    --kpi-up-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(180, 60, 50, 0.18) 100%);
    --kpi-down-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(var(--primary-rgb), 0.18) 100%);
    --kpi-neutral-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(180, 150, 60, 0.18) 100%);
    --kpi-break-bg: linear-gradient(180deg, var(--card-bg) 0%, rgba(100, 180, 200, 0.18) 100%);
    --kpi-up-border: rgba(180, 60, 50, 0.35);
    --kpi-down-border: rgba(var(--primary-rgb), 0.35);
    --kpi-neutral-border: rgba(180, 150, 60, 0.35);
    --kpi-break-border: rgba(100, 180, 200, 0.35);
    --kpi-up-delta-color: #E87070;
    
    /* 标签 */
    --tag-execute-bg: var(--bamboo-light);
    --tag-miss-bg: hsl(var(--accent-hue), 12%, calc(26% + var(--accent-lightness-offset)));
    --tag-text-light: hsl(var(--accent-hue), 15%, calc(89% + var(--accent-lightness-offset)));
    
    /* 波浪与毛玻璃 */
    --wave-color: rgba(var(--primary-rgb), 0.5);
    /* 暗色模式降低模糊半径，避免 Chromium backdrop-filter 渲染伪影 */
    --glass-blur: 12px;
    /* 暗色 pre-rendered 卡片渐变 — 降低白色分量适配深色背景 */
    --glass-card-gradient: linear-gradient(135deg, rgba(var(--white-rgb), 0.12) 0%, rgba(var(--white-rgb), 0.04) 50%, rgba(var(--white-rgb), 0.08) 100%), linear-gradient(45deg, rgba(var(--bamboo-deep-rgb), 0.10) 0%, transparent 60%);
    
    /* 星空点缀色 */
    --star-glow: hsla(calc(var(--accent-hue) + 0), 36%, calc(78% + var(--accent-lightness-offset)), 0.6);
    --star-accent: hsl(var(--accent-hue), 38%, calc(75% + var(--accent-lightness-offset)));

    /* 暗色模式：竹林浅色交互态 */
    --bamboo-pale-hover: hsl(var(--accent-hue), 28%, calc(88% + var(--accent-lightness-offset)));
    --bamboo-pale-hover-rgb: 208, 232, 208;
    --bamboo-pale-active: hsl(var(--accent-hue), 25%, calc(82% + var(--accent-lightness-offset)));
    --bamboo-pale-highlight: hsl(calc(var(--accent-hue) - 33), 78%, calc(68% + var(--accent-lightness-offset)));
    --bamboo-pale-highlight-rgb: 160, 216, 120;
    
    /* Focus */
    --focus-ring: 0 0 0 2px var(--bamboo-primary);
    --focus-ring-offset: 0 0 0 4px rgba(var(--primary-rgb), 0.25);
    --focus-ring-danger: 0 0 0 2px var(--cinnabar);
    --focus-transition: box-shadow 0.15s ease;
    
    /* 状态色 */
    --status-success: var(--bamboo-primary);
    --status-warning: #ffe082;
    --status-danger: #ef5350;
    --status-info: #4FC3F7;
    --status-success-bg: rgba(var(--primary-rgb), 0.15);
    --status-warning-bg: rgba(var(--gold-rgb), 0.12);
    --status-danger-bg: rgba(var(--danger-rgb), 0.15);
    --status-info-bg: rgba(var(--info-rgb, 79, 195, 247), 0.12);

    /* === 浮层设计令牌（Toast / Confirm / 选择器统一语言：留白素笺） === */
    --overlay-surface: var(--card-bg);
    --overlay-border-width: 1px;
    --overlay-border-style: solid;
    --overlay-border-color: var(--bamboo-border);
    --overlay-border: var(--overlay-border-width) var(--overlay-border-style) var(--overlay-border-color);
    --overlay-shadow: 0 8px 32px rgba(20, 32, 18, 0.5);
    --overlay-shadow-soft: 0 2px 12px rgba(20, 32, 18, 0.38);
    --ease-cn: cubic-bezier(0.22, 0.61, 0.36, 1);

    /* 其他 */
    --cinnabar: #FF6B6B;
    --gold: #FFD93D;
    --sky-azure: #74C0FC;
    --sky-azure-rgb: 116, 192, 252;
    --leaf-green: hsl(var(--accent-hue), 23%, calc(65% + var(--accent-lightness-offset)));

    /* === 健康评分色彩系统（暗色同值） === */
    --health-danger: #EF4444;
    --health-warning: #F59E23;
    --health-success-clr: #7ED321;
    --health-info: #4A90D9;
    --health-neutral: #95A5A6;
    --health-pink: #E91E63;
    --health-purple: #9C27B0;
    --health-orange: #FF9800;
    --health-gold-clr: #D97706;

    /* 玉石纹理 — 暗色模式 */
    --jade-cream-rgb: 40, 55, 40;
    --jade-cream-mid-rgb: 35, 50, 35;
    --jade-cream-deep-rgb: 30, 45, 30;
    --jade-warm-rgb: 35, 48, 32;
    --jade-dark-rgb: 20, 15, 10;
    --jade-dark-mid-rgb: 18, 13, 8;
    --jade-dark-deep-rgb: 15, 10, 5;
    --jade-dark-warm-rgb: 25, 18, 10;
    --jade-dark-warm-mid-rgb: 22, 15, 8;
    --jade-dark-warm-light-rgb: 20, 12, 5;

    /* 竹林装饰效果 — 暗色模式 */
    /* 暗色流光效果（fab.css glow 动画依赖，缺定义导致 GPU 空跑） */
    --glow-color-start: hsla(calc(var(--accent-hue) + 0), 45%, calc(60% + var(--accent-lightness-offset)), 0.25);
    --glow-color-end: hsla(calc(var(--accent-hue) + 0), 35%, calc(75% + var(--accent-lightness-offset)), 0.08);
    --glow-width: 2px;
    --glow-opacity: 0.2;
    --glow-duration: 20s;
}


/* ========== 触控区域最小尺寸（WCAG 2.5.8） ========== */
:host {
    --min-touch-target: 48px;
}

/* ============================================================
   RESPONSIVE DESIGN TOKENS — Canonical Breakpoint System
   ============================================================
   Usage convention across ALL CSS files:
     @media (max-width: 360px)    → tiny phone  (--bp-xxs, rare)
     @media (max-width: 480px)    → mobile       (--bp-sm, PRIMARY)
     @media (max-width: 600px)    → large phone / narrow modal (--bp-md-narrow)
                                    NOTE: intentionally kept for wallet/shop modal
                                    where the modal can be ~600px wide at 768px+ viewports.
                                    Do NOT use for general layout — use 480px instead.
     @media (max-width: 768px)    → tablet / narrow Obsidian sidebar (--bp-md, PRIMARY)
     @media (min-width: 1025px)   → wide desktop (--bp-xl-min)

   Mapping of OLD breakpoints found in codebase → NEW canonical values:
     360  → 360  (kept as --bp-xxs, rare)
     400  → 480  (merged into mobile)
     420  → 360  (tiny-phone fallback)
     480  → 480  (PRIMARY mobile breakpoint)
     500  → 480  (merged into mobile)
     560  → 480  (merged into mobile)
     600  → 600  (kept as --bp-md-narrow, wallet/shop modal only)
     700  → 768  (merged into tablet)
     768  → 768  (PRIMARY tablet breakpoint)
     960  → 768  (merged into tablet)
     961+ → 1025+ (wide desktop)
   ============================================================ */

:host {
    /* Breakpoint reference values (for documentation only — CSS @media
       cannot use custom properties, so use the literal pixel values above
       in @media conditions consistently across all files). */
    --bp-xxs: 360px;       /* tiny phone: < iPhone SE 1st gen */
    --bp-sm: 480px;        /* PRIMARY mobile breakpoint */
    --bp-md-narrow: 600px; /* wallet/shop modal only — do NOT use for general layout */
    --bp-md: 768px;        /* PRIMARY tablet breakpoint */
    --bp-lg: 1024px;       /* standard desktop breakpoint */
    --bp-xl-min: 1025px;   /* min for wide desktop */

    /* Canonical breakpoint aliases — Task 6 responsive breakpoint system */
    --bm-bp-sm: 480px;     /* mobile */
    --bm-bp-md: 768px;     /* tablet / narrow Obsidian sidebar */
    --bm-bp-lg: 1024px;    /* desktop */

    /* Progressive-render placeholder min-height — UI Audit 4.5.1 CLS mitigation */
    --bm-placeholder-min-h: 160px;

    /* Fluid font scale — computed as clamp(min_px, fluid_vw, max_px)
       where min applies at 320px and max at 1200px viewport width.
       Use these instead of fixed --font-size-* for body-level text. */
    --type-xs: calc(clamp(10px, 2.2vw, 12px) * var(--font-size-scale));        /* labels, meta, captions */
    --type-sm: calc(clamp(12px, 2.6vw, 13px) * var(--font-size-scale));        /* secondary :host text */
    --type-base: calc(clamp(13px, 2.8vw, 15px) * var(--font-size-scale));      /* primary :host text */
    --type-md: calc(clamp(14px, 3.2vw, 17px) * var(--font-size-scale));        /* interactive, buttons, section titles */
    --type-lg: calc(clamp(15px, 3.8vw, 20px) * var(--font-size-scale));        /* subtitles */
    --type-xl: calc(clamp(18px, 4.8vw, 24px) * var(--font-size-scale));        /* smaller headings */
    --type-2xl: calc(clamp(20px, 5.5vw, 28px) * var(--font-size-scale));       /* main h1 / hero title */
    --type-display: calc(clamp(24px, 7vw, 36px) * var(--font-size-scale));     /* hero numbers, display */

    /* ---- Supplementary fluid sizes ----
       Values clamp(min_px, proportional_vw, max_px).
       Use these instead of `font-size: XXpx` anywhere a fixed pixel size is used
       for text that is not an icon/mark/border. */
    --type-mini:    calc(clamp(8px, 1.8vw, 10px) * var(--font-size-scale));
    --type-micro:   calc(clamp(9px, 2.0vw, 11px) * var(--font-size-scale));
    --type-caption: calc(clamp(11px, 2.4vw, 13px) * var(--font-size-scale));
    --type-body:    calc(clamp(13px, 2.8vw, 15px) * var(--font-size-scale));
    --type-lead:    calc(clamp(14px, 3.2vw, 17px) * var(--font-size-scale));
    --type-heading: calc(clamp(16px, 3.8vw, 20px) * var(--font-size-scale));
    --type-large:   calc(clamp(18px, 4.5vw, 24px) * var(--font-size-scale));
    --type-hero:    calc(clamp(20px, 5.5vw, 28px) * var(--font-size-scale));
    --type-mega:    calc(clamp(24px, 7vw, 36px) * var(--font-size-scale));
    --type-display-big: calc(clamp(32px, 9vw, 48px) * var(--font-size-scale));

    /* Fluid spacing additions (used inside padding/gap declarations) */
    --fluid-card-padding: clamp(10px, 2.5vw, 16px);
    --fluid-gap-small: clamp(6px, 1.5vw, 10px);
    --fluid-gap-med: clamp(8px, 2vw, 14px);

    /* Fluid spacing — for layout-level padding and gaps.
       Keep component-level small spacing fixed (e.g., 4px inside a button). */
    --fluid-gutter: clamp(12px, 3vw, 24px);
    --fluid-stack: clamp(8px, 2vw, 16px);
    --fluid-section-gap: clamp(16px, 4vw, 32px);

    /* Touch target — minimum interactive area (WCAG 2.5.8).
       Enforced globally in base.css on button, [role=button], etc. */
    --touch-target: 44px;
    --touch-comfortable: 48px;

    /* Icon size scale — single source of truth for inline SVG icon dimensions.
       Mirrors LucideUtils.SPEC.SIZES; CSS must reference these tokens instead
       of bare px on `svg` selectors (UI Audit 4.6.3). */
    --bm-icon-xs: 12px;
    --bm-icon-sm: 14px;
    --bm-icon-md: 16px;
    --bm-icon-lg: 18px;
    --bm-icon-xl: 20px;
    --bm-icon-xxl: 24px;
}

/* Dynamic viewport height — progressive enhancement.
   100dvh is supported in all modern browsers; we fall back to 100vh for older ones. */
:host {
    --viewport-height: 100vh;
}
@supports (height: 100dvh) {
    :host {
        --viewport-height: 100dvh;
    }
}

/* ============================================================
   A11Y PREFERENCE TOKENS
   ============================================================ */

/* prefers-contrast: high-contrast mode — ensure text stays readable */
@media (prefers-contrast: more) {
    :host {
        --text-primary: #000000;
        --text-secondary: #222222;
    }
    :host(.dark) {
        --text-primary: #ffffff;
        --text-secondary: #e0e0e0;
    }
}

/* === 移动端玻璃拟态主动降级（鸿蒙 ArkWeb / 老旧安卓 WebView 性能兜底） ===
 * 背景：鸿蒙 ArkWeb 对 backdrop-filter 合成开销大，点组件刷新时频繁重采样导致卡顿。
 * 但 ArkWeb 语法上"支持" backdrop-filter，故 @supports not 不触发，需按平台类主动降级。
 * 方案（与暗色模式同款 :host() 写法，无 !important，纯变量重绑）：
 *   1) --glass-blur 置 0 → 所有 blur(var(--glass-blur)) 自动变 blur(0)，消除模糊计算；
 *   2) --card-glass 转不透明 fallback 底色 → 关模糊后不穿底、对比度充足；

/* 控制区：竹制火折子（可拔帽） */
.scroll-firebrand {

    cursor: grabbing;

    -webkit-user-select: none;

    pointer-events: none;
    transform: translateY(20px);
    animation: none;

.scroll-firebrand svg {
    width: 32px;
    height: 64px;
    display: block;
    overflow: visible; /* 斜举后火焰/筒身可能探出 32×64 视口，避免被裁切 */
    filter: drop-shadow(0 3px 6px rgba(90,130,95,0.28));

/* 火绒：帽未开时藏起，拔帽后显火 */
.scroll-firebrand .flame {
    opacity: 0;
    /* 关键：SVG <g> 的 transform-origin 默认按元素自身包围盒解析，
       火焰盒仅约 10×23，24px 34px 会落到盒外 → rotate(45deg) 绕远处点旋转，
       虽父级 -45deg 抵消了「旋转」却把火焰甩偏（看起来歪/不直）。
       显式 view-box 让 24px 34px 落在 SVG 视口坐标（火焰根部），
       +45deg 绕根部转、父级 -45deg 抵消后火焰竖直贴合筒口。 */

.scroll-firebrand.cap-off .flame {
    opacity: 1;
    transform: scale(1);
}
/* 拖拽火折子时：筒身由内联 transform 斜举 -45°，火焰绕根部（view-box 24,34）反向 +45°
   与之外抵，最终竖直且贴合倾斜后的筒口（两次等量反向旋转、支点不同 → 纯平移）。
   须限定 .dragging 且写在 .cap-off .flame 之后，确保「仅拖拽时」才反向旋转，
   开帽静止时火焰保持天然竖直。关键是 .flame 须 transform-box: view-box（见上方 .flame 规则），

.scroll-firebrand .flame-inner {

    transform-origin: 50% 100%; /* 绕火焰根部跳动 */
    animation-play-state: paused;
}
.scroll-firebrand .flame-outer { animation: scroll-flame-outer 0.8s ease-in-out infinite; }
.scroll-firebrand .flame-inner { animation: scroll-flame-inner 0.6s ease-in-out infinite; }
.scroll-firebrand .flame-spark { animation-play-state: paused; }
/* 火星用 translateY 上飘，替代原 SMIL 的 cy 属性动画（后者每帧重算 SVG 几何） */
.scroll-firebrand .spark-a { animation: scroll-spark-rise 1.2s ease-out infinite; }
.scroll-firebrand .spark-b { animation: scroll-spark-rise 1.5s ease-out -0.4s infinite; }
.scroll-firebrand.cap-off .flame-outer,
.scroll-firebrand.cap-off .flame-inner,
.scroll-firebrand.cap-off .flame-spark { animation-play-state: running; }
/* 火折子配色：随主体色相 + 明度联动（HSL 派生，与香插同源）。
   竹身/竹帽为青竹材质（色相约 +30 跟随主体），火苗为暖橙（色相约 -95/-75 跟随主体）。
   注意：SVG 呈现属性不解析 var()，故 fill/stroke 与渐变 stop-color 一律由 CSS 施加。 */
.scroll-firebrand {
  --fb-bamboo-1: hsl(calc(var(--accent-hue) + 35), 14%, calc(63% + var(--accent-lightness-offset)));
  --fb-bamboo-2: hsl(calc(var(--accent-hue) + 32), 21%, calc(72% + var(--accent-lightness-offset)));
  --fb-bamboo-3: hsl(calc(var(--accent-hue) + 33), 18%, calc(57% + var(--accent-lightness-offset)));
  --fb-bamboo-stroke: hsl(calc(var(--accent-hue) + 35), 19%, calc(46% + var(--accent-lightness-offset)));
  --fb-bamboo-top: hsl(calc(var(--accent-hue) + 32), 18%, calc(62% + var(--accent-lightness-offset)));
  --fb-cap-1: hsl(calc(var(--accent-hue) + 32), 18%, calc(60% + var(--accent-lightness-offset)));
  --fb-cap-2: hsl(calc(var(--accent-hue) + 32), 20%, calc(67% + var(--accent-lightness-offset)));
  --fb-cap-3: hsl(calc(var(--accent-hue) + 30), 18%, calc(51% + var(--accent-lightness-offset)));
  --fb-cap-edge: hsl(calc(var(--accent-hue) + 30), 16%, calc(54% + var(--accent-lightness-offset)));
  --fb-cap-knob: hsl(calc(var(--accent-hue) + 32), 18%, calc(62% + var(--accent-lightness-offset)));
  --fb-cap-knob-stroke: hsl(calc(var(--accent-hue) + 38), 21%, calc(37% + var(--accent-lightness-offset)));
  --fb-flame-outer: hsl(calc(var(--accent-hue) + -95), 100%, calc(62% + var(--accent-lightness-offset)));
  --fb-flame-inner: hsl(calc(var(--accent-hue) + -75), 100%, calc(70% + var(--accent-lightness-offset)));
  --fb-spark: hsl(calc(var(--accent-hue) + -84), 100%, calc(75% + var(--accent-lightness-offset)));
}
.scroll-firebrand .fb-body { stroke: var(--fb-bamboo-stroke); }
.scroll-firebrand .fb-stroke { stroke: var(--fb-bamboo-stroke); }
.scroll-firebrand .fb-top { fill: var(--fb-bamboo-top); }
.scroll-firebrand .fb-cap-body { stroke: var(--fb-bamboo-stroke); }
.scroll-firebrand .fb-cap-stroke { stroke: var(--fb-cap-knob-stroke); }
.scroll-firebrand .fb-cap-edge { fill: var(--fb-cap-edge); }
.scroll-firebrand .fb-cap-knob { fill: var(--fb-cap-knob); stroke: var(--fb-cap-knob-stroke); }
.scroll-firebrand .flame-outer { fill: var(--fb-flame-outer); }
.scroll-firebrand .flame-inner { fill: var(--fb-flame-inner); }
.scroll-firebrand .flame-spark { fill: var(--fb-spark); }
.scroll-firebrand #fbBamboo stop:nth-of-type(1) { stop-color: var(--fb-bamboo-1); }
.scroll-firebrand #fbBamboo stop:nth-of-type(2) { stop-color: var(--fb-bamboo-2); }
.scroll-firebrand #fbBamboo stop:nth-of-type(3) { stop-color: var(--fb-bamboo-3); }
.scroll-firebrand #fbCap stop:nth-of-type(1) { stop-color: var(--fb-cap-1); }
.scroll-firebrand #fbCap stop:nth-of-type(2) { stop-color: var(--fb-cap-2); }
.scroll-firebrand #fbCap stop:nth-of-type(3) { stop-color: var(--fb-cap-3); }
@keyframes scroll-flame-outer {
    0%, 100% { transform: scale(1) scaleX(1); }
    50%      { transform: scale(1.05) scaleX(0.92); }
}
@keyframes scroll-flame-inner {
    0%, 100% { transform: scale(1) scaleX(1); }
    50%      { transform: scale(0.94) scaleX(1.06); }
}
@keyframes scroll-spark-rise {
    0%   { transform: translateY(0); opacity: 0.8; }
    100% { transform: translateY(-11px); opacity: 0; }
}
/* 拔帽常态：筒身竖直、停 idle 动画。斜举(-45°)只在拖拽时由内联 transform 施加
   （见 scrollManager.onMove），火焰反向旋转则见 .cap-off.dragging .flame。 */
.scroll-firebrand.cap-off {
    animation: none;
}
/* 可拔竹帽：拔帽后飞出并消失，再次轻点盖回 */
.scroll-firebrand-cap {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.4s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.4s ease;
}
.scroll-firebrand.cap-off .scroll-firebrand-cap {
    transform: translateY(-26px) rotate(-10deg) scale(0.72);
    opacity: 0;
    pointer-events: none;
}
/* 拖拽靠近香头、可点燃时，火折子与香头高亮反馈 */
.scroll-firebrand.near .flame {
    filter: drop-shadow(0 0 4px rgba(255,160,80,0.7));
}
.scroll-incense.near .scroll-incense-ember { opacity: 1; }
.scroll-incense.near .scroll-incense-ember span { animation-play-state: running; }
@keyframes scroll-firebrand-idle {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-3px) rotate(1deg); }
}

.scroll-screen-inner {
    position: relative;
    z-index: 1;
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
}

/* 香道视觉：屏内一炷长香（青瓷竹节香插 · SVG 青烟 · 多层余烬 · 真实焚香）
   --burn = 剩余比例(1→0)，由 JS 随计时更新；香身高度随燃烧缩短 */
.scroll-incense {
    position: relative;
    width: 72px;
    height: 620px;
    display: flex;
    flex-direction: column;
    align-items: center;
    --burn: 1;
}
/* 青烟：SVG 曲折烟缕，自燃烧点持续升腾（点燃后明显）；位置随燃烧前沿下移 */
.scroll-incense-smoke {
    position: absolute;
    /* 位置改由 translateY 表达（合成属性），top 固定为基准值：
       原用 top 跟随 --burn，每次写入都会触发一次重排与重绘。 */
    top: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(calc((1 - var(--burn)) * 560px));
    width: 44px;
    height: 150px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.9s linear, opacity 0.8s ease;
}
.scroll-incense.is-lit .scroll-incense-smoke { opacity: 1; }
.scroll-incense-smoke svg { width: 100%; height: 100%; overflow: visible; }
/* 去掉 drop-shadow：烟缕在跑 drift 动画（transform），带滤镜会让每帧重新计算滤镜，
   这是点燃后长期运行中的一项持续开销。烟缕本身有描边色，去掉投影视觉几乎无差别。 */
.scroll-smoke-wisp { fill: none; }
/* 青烟：单股烟缕，靠「姿态变化 + 明暗起伏」两条合成动画叠加来模拟流动。
   曾经的做法有两种代价更高的：逐帧改写 path 的 d（每帧重算并光栅化 SVG 几何，
   无法进合成层），以及多股烟缕叠加（动画/合成层数成倍增加）。
   现为单股：姿态（上飘 / 左右摆 / 扭动 / 纵向拉伸 / 微旋）与明暗两个周期互不同步
   （7s 与 4.6s），叠加后不断产生新的姿态与浓度组合，形成边升边散的流动错觉，
   而开销只是两个 transform/opacity 合成动画。默认 paused，仅点燃(.is-lit)后运行。 */
.scroll-smoke-wisp {
    transform-box: fill-box;
    transform-origin: 50% 100%; /* 以靠近香头的烟缕底端为支点摆动 */
    animation-play-state: paused;
}
.scroll-smoke-wisp.w1 {
    --wisp-o: 0.62;
    opacity: var(--wisp-o);
    animation: scroll-smoke-drift 7s ease-in-out infinite alternate,
               scroll-smoke-fade 4.6s ease-in-out infinite;
}
.scroll-incense.is-lit .scroll-smoke-wisp {
    animation-play-state: running;
    will-change: transform, opacity;
}
/* 姿态：7 个关键帧的连续变形——上飘的同时左右摆、扭腰、纵向拉伸并微微旋转，
   避免单股烟看起来是「一个固定姿势在平移」 */
@keyframes scroll-smoke-drift {
    0%   { transform: translateY(0)     scaleX(1)    scaleY(1)    skewX(0deg)    rotate(0deg); }
    15%  { transform: translateY(-2px)  scaleX(1.09) scaleY(1.03) skewX(3.5deg)  rotate(1.5deg); }
    30%  { transform: translateY(-5px)  scaleX(0.92) scaleY(1.06) skewX(-2deg)   rotate(-1deg); }
    45%  { transform: translateY(-7px)  scaleX(1.07) scaleY(1.02) skewX(2.8deg)  rotate(2deg); }
    60%  { transform: translateY(-9px)  scaleX(0.95) scaleY(1.08) skewX(-3deg)   rotate(-1.8deg); }
    80%  { transform: translateY(-12px) scaleX(1.04) scaleY(1.04) skewX(2deg)    rotate(1.2deg); }
    100% { transform: translateY(-15px) scaleX(0.97) scaleY(1.06) skewX(-1.5deg) rotate(-0.8deg); }
}
/* 浓淡起伏：烟团边升边散，明暗交替强化流动错觉（幅度按各自的 --wisp-o 缩放，保留主次） */
@keyframes scroll-smoke-fade {
    0%, 100% { opacity: calc(var(--wisp-o, 0.6) * 0.5); }
    50%      { opacity: var(--wisp-o, 0.6); }
}
/* 余烬（单个暗红闷烧点）：位置随燃烧前沿下移（top 跟随 --burn） */
.scroll-incense-ember {
    position: absolute;
    /* 同上：跟随燃烧前沿的位移走 translateY（合成属性），top 固定为基准值。
       余烬呼吸动画在内部 span 上，不占用本元素的 transform。 */
    top: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(calc((1 - var(--burn)) * 560px));
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: transform 0.9s linear, opacity 0.6s ease;
    z-index: 5;
}
.scroll-incense.is-lit .scroll-incense-ember { opacity: var(--burn, 1); }
.scroll-incense-ember span { position: absolute; border-radius: 50%; }
/* 点燃后归于静态暗红余烬：闷烧般呼吸（#4），明暗涨落 + 轻微胀缩，整体亮度随 --burn 淡出 */
/* blur 固定而非逐帧动画：模糊半径每变化一次都要重新光栅化，是点燃后长期运行中最贵
   的一项；改为固定模糊 + opacity/scale 呼吸，视觉几无差别。 */
/* 余烬发光范围收小：核心点 8px→5px、模糊半径 2.5→1.6px，光晕扩散随之收窄，
   暗红闷烧点更集中（模糊半径变小也顺带降低每帧光栅化的开销）。 */
.ember-core  { width: 5px;  height: 5px;  background: rgba(245,130,70,0.75); top: 50%; left: 50%; transform: translate(-50%,-50%); filter: blur(1.6px); }
/* 呼吸动画只改 opacity（scale 已移除，以免 blur 每帧重栅格化），
   故 will-change 也只声明 opacity，避免为用不到的 transform 额外提升合成层。 */
.scroll-incense.is-lit .scroll-incense-ember span { animation: scroll-ember-breath 3.4s ease-in-out infinite; will-change: opacity; }
/* 余烬呼吸只改 opacity、不再改 scale：余烬带固定 blur，缩放会迫使模糊每帧重新
   光栅化（点燃后长期运行中的一项隐性开销）。仅明暗涨落，视觉差异极小。 */
@keyframes scroll-ember-sleep {
    0%, 100% { transform: translate(-50%,-50%); opacity: 0.85; }
    50%      { transform: translate(-50%,-50%); opacity: 1; }
}
@keyframes scroll-ember-breath {
    0%, 100% { transform: translate(-50%,-50%); opacity: 0.45; }
    50%      { transform: translate(-50%,-50%); opacity: 0.8; }
}
/* 吹熄过渡（#7）：余烬暗灭、火光隐去、前沿焦褐带消散、青烟被吹散加速淡出，香身停在当前进度 */
.scroll-incense.blowing .scroll-incense-ember,
.scroll-incense.blowing .scroll-incense-flare,
.scroll-incense.blowing .scroll-incense-transition {
    /* 先 animation:none 停掉余烬/火光的 opacity 关键帧，再以普通声明压到 0：
       动画的优先级高于普通声明，不停动画就得靠 !important 才能盖住。 */
    animation: none;
    opacity: 0;
    transition: opacity 0.9s ease;
}
.scroll-incense.blowing .scroll-incense-ember span { animation: none; opacity: 0; }
.scroll-incense.blowing .scroll-incense-smoke { opacity: 0; transition: opacity 1.1s ease; }
.scroll-incense.blowing .scroll-smoke-wisp { animation-duration: 2.2s; }
/* 点燃演化：大火光 → 微光闪烁 → 静态暗红余烬，青烟全程持续 */
.scroll-incense-flare {
    position: absolute;
    top: calc(12px + (1 - var(--burn)) * 560px);
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
        rgba(255,224,160,0.95) 0%,
        rgba(255,176,86,0.72) 35%,
        rgba(255,120,50,0.28) 60%,
        transparent 76%);
    /* 去掉 blur：光晕的柔和边缘由上面的 radial-gradient 本身提供；
       flicker 动画含 scale，带模糊会迫使每帧重新光栅化。 */
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    transition: top 0.9s linear, opacity 0.5s ease;
}
.scroll-incense.lighting .scroll-incense-flare { opacity: 1; animation: scroll-flare-flicker 0.26s ease-in-out infinite; }
.scroll-incense.glowing .scroll-incense-flare { opacity: 0.5; animation: scroll-flare-flicker 0.85s ease-in-out infinite; }
@keyframes scroll-flare-flicker {
    0%, 100% { opacity: 1;   transform: translateX(-50%) scale(1); }
    50%      { opacity: 0.72; transform: translateX(-50%) scale(1.1); }
}
/* 余烬阶段：lighting 强闪、glowing 微闪，最终（无阶段类）静态暗红闷烧 */
.scroll-incense.lighting .scroll-incense-ember span { animation: scroll-ember-sleep 0.5s ease-in-out infinite; }
.scroll-incense.glowing .scroll-incense-ember span { animation: scroll-ember-sleep 2.2s ease-in-out infinite; }
/* 引燃衔接（#6）：火苗由大收敛吻上香头、余烬由小被点亮，避免点燃瞬间的跳变 */
.scroll-incense.kissing .scroll-incense-flare {
    opacity: 1;
    animation: scroll-flare-kiss 0.9s cubic-bezier(.3,.7,.4,1);
}
.scroll-incense.kissing .scroll-incense-ember span { animation: scroll-ember-kindle 0.9s ease-out; }
@keyframes scroll-flare-kiss {
    0%   { transform: translateX(-50%) scale(1.35); opacity: 0.35; }
    35%  { transform: translateX(-50%) scale(1.05); opacity: 1; }
    100% { transform: translateX(-50%) scale(0.85); opacity: 0.6; }
}
@keyframes scroll-ember-kindle {
    0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0.2; }
    45%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0.9; }
}
/* 线香：已燃(灰白)/过渡/未燃(暖木)，高度比由 --burn 驱动 */
.scroll-incense-stick {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 560px;
    border-radius: 2px;
    overflow: hidden;
    z-index: 3;
}
.scroll-incense-ash {
    position: absolute;
    top: calc(var(--ash-top, 0) * 100%);
    left: 0; width: 100%;
    /* 仅保留「最近一个 10 分钟段」内已燃的灰；更早的段已掉落（--ash-top 抬升） */
    height: max(0px, calc((1 - var(--burn)) * 100% - var(--ash-top, 0) * 100%));
    /* 香灰：灰白主体 + 细微颗粒/裂纹纹理，顶部刚燃过处略暗带余温。
       颜色改为走变量：暗色模式下整体提亮偏白，否则深底上的灰段会糊成暗色一条。 */
    --ash-1: rgba(146,138,128,0.9);
    --ash-2: rgba(176,168,158,0.72);
    --ash-3: rgba(198,192,184,0.62);
    --ash-4: rgba(172,164,152,0.58);
    --ash-tex-1: rgba(110,100,90,0.14);
    --ash-tex-2: rgba(86,78,70,0.12);
    background:
        repeating-linear-gradient(180deg, var(--ash-tex-1) 0px, transparent 1px, transparent 3px, var(--ash-tex-2) 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0px, transparent 2px, transparent 5px, rgba(120,110,100,0.10) 6px),
        linear-gradient(180deg, var(--ash-1) 0%, var(--ash-2) 10%, var(--ash-3) 55%, var(--ash-4) 100%);
    /* 色带与颗粒按「整支香」(560px) 定位，并随 --ash-top 上移：
       本元素高度随 --ash-top / --burn 变化，若让渐变按元素自身高度铺开，
       灰段伸缩时颜色分布会被反复重新压缩。固定成 560px + 反向偏移后，
       颜色始终锚在整支香的绝对位置上，与原「整支香上裁一段」的观感一致。 */
    background-size: 100% 560px;
    background-position: 0 calc(var(--ash-top, 0) * -560px);
    border-radius: 1px 1px 0 0;
    box-shadow: inset 0 0 1px rgba(90,82,74,0.4);
    transition: height 0.9s linear, top 0.9s linear;
}
/* 曾用 @supports + clip-path: inset() 走「整支香上裁剪出已燃区间」以规避 height/top 重排；
   现统一退回 top/height 方案：元素仅 3px×560px、每 250ms 更新一次，重排代价可忽略，
   换取零 clip-path 依赖（caniuse 对该属性的「部分支持」标记会持续告警且无法豁免）。 */
/* 暗色模式：香灰整体提亮偏白，深底上更清晰；颗粒纹理也换成浅色，
   避免深色颗粒在浅灰底上变成脏点。 */
:host(.dark) .scroll-incense-ash {
    --ash-1: rgba(226,222,214,0.92);
    --ash-2: rgba(238,234,226,0.8);
    --ash-3: rgba(248,245,238,0.7);
    --ash-4: rgba(232,228,220,0.66);
    --ash-tex-1: rgba(255,255,255,0.16);
    --ash-tex-2: rgba(240,236,228,0.14);
}
/* 随风化雁：每燃烧 10 分钟，一段香灰化作大雁飞向远方天空 */
.scroll-incense { overflow: visible; } /* 确保大雁飞出香身不被裁切（#8） */
.scroll-wild-goose {
    position: absolute;
    left: 50%;
    width: 26px;
    height: 14px;
    margin-left: -13px;
    z-index: 7;
    pointer-events: none;
    /* 不再用 drop-shadow：雁在振翅（scaleY）动画中，带滤镜会让每帧重新计算滤镜；
       远处小雁的投影本就几乎不可见，去掉可省下这段持续开销。 */
    will-change: transform, opacity;
}
.scroll-wild-goose svg { width: 100%; height: 100%; overflow: visible; display: block; transform-origin: 50% 50%; }
/* 雁身填充：亮色下为深灰褐（如远处剪影）；暗色模式提亮为浅色，
   否则深底上的深色雁几乎不可见（化雁看不清）。 */
.scroll-wild-goose { --goose-fill: rgba(86,80,74,0.82); }
.scroll-wild-goose .goose-body { fill: var(--goose-fill); }
/* 暗色模式：填充提亮到近乎实心，并把雁身放大一号（26×14 → 32×18），
   配合 JS 里更缓的缩小与更晚的淡出，让雁在深底上全程可辨。
   注：描边方案在此无效——缩小是父元素的 CSS transform，
   vector-effect: non-scaling-stroke 无法阻止其连带缩放，故改为放缓缩小。 */
:host(.dark) .scroll-wild-goose {
    --goose-fill: #ffffff;
    width: 32px;
    height: 18px;
    margin-left: -16px;
}
/* 再给雁身描一圈白边把轮廓加粗，让它在深底上更跳。
   这里刻意不用 filter 做发光：滤镜会随振翅动画每帧重算，代价高于加粗描边。 */
:host(.dark) .scroll-wild-goose .goose-body {
    stroke: rgba(255,255,255,0.92);
    stroke-width: 1.6;
    paint-order: stroke fill;
}
/* 扇翅：双翼随振翅轻微上下压扁，赋予远去大雁生命感（#2） */
.scroll-wild-goose svg { animation: scroll-goose-flap 0.5s ease-in-out infinite; }
@keyframes scroll-goose-flap {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.82); }
}
.scroll-incense-transition {
    position: absolute;
    left: 0; width: 100%;
    top: calc((1 - var(--burn)) * 100%);
    height: 6%;
    /* 燃烧前沿：暗红余烬 → 焦褐，体现正在燃烧的位置 */
    background: linear-gradient(180deg, rgba(150,70,42,0.6), rgba(150,118,92,0.42) 70%, rgba(140,115,90,0.18));
    transition: top 0.9s linear;
}
/* 燃烧前沿轻微跳动（#5）：火舌舔舐前沿，opacity 起伏 + 高度微胀，避免过渡带静止呆板 */
.scroll-incense.is-lit .scroll-incense-transition {
    transform-origin: 50% 0%;
    animation: scroll-front-flicker 0.9s ease-in-out infinite;
    will-change: opacity, transform;
}
@keyframes scroll-front-flicker {
    0%, 100% { opacity: 0.9;  transform: scaleY(1); }
    50%      { opacity: 1;    transform: scaleY(1.18); }
}
.scroll-incense-unburnt {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    height: calc(var(--burn) * 100%);
    background: linear-gradient(180deg, rgba(148,118,88,0.85) 0%, rgba(135,105,75,0.9) 30%, rgba(125,98,70,0.85) 60%, rgba(118,92,65,0.9) 100%);
    /* 同 .scroll-incense-ash：把渐变锚在整支香（560px）上，元素底边固定、
       高度随 --burn 收缩时，颜色不会被重新压缩。顶边即燃点位置 (1 - --burn)。 */
    background-size: 100% 560px;
    background-position: 0 calc((1 - var(--burn)) * -560px);
    border-radius: 0 0 2px 2px;
    transition: height 0.9s linear;
}
/* 此处同样不再使用 clip-path（理由同 .scroll-incense-ash）。 */
.scroll-incense-texture {
    position: absolute;
    inset: 0;
    opacity: 0.15;
    background: repeating-linear-gradient(180deg, transparent 0px, rgba(80,60,40,0.1) 1px, transparent 2px, transparent 6px);
    pointer-events: none;
}
/* 青瓷竹节香插（SVG 渲染，见 DOM） */
.scroll-censer {
    position: absolute;
    bottom: 0;
    left: 50%;
    margin-left: -56px;
    width: 112px;
    height: 80px;
    z-index: 4;
}
/* 仅莲台（花瓣应在香后、花心在香前遮香根）取消容器层叠上下文，

    --cs-2: hsl(calc(var(--accent-hue) + 23), 21.3%, calc(76.1% + var(--accent-lightness-offset)));
    --cs-3: hsl(calc(var(--accent-hue) + 22), 19.5%, calc(69.8% + var(--accent-lightness-offset)));
    --cs-4: hsl(calc(var(--accent-hue) + 28), 19.1%, calc(63.1% + var(--accent-lightness-offset)));
    --cs-pool-a: hsla(calc(var(--accent-hue) + 33), 18.4%, calc(48% + var(--accent-lightness-offset)), 0.15);
    --cs-pool-b: hsla(calc(var(--accent-hue) + 30), 23.8%, calc(41.2% + var(--accent-lightness-offset)), 0.3);
    --cs-line: hsla(calc(var(--accent-hue) + 23), 20%, calc(39.2% + var(--accent-lightness-offset)), 0.16);
    --cs-rim: hsla(calc(var(--accent-hue) + 24), 17.2%, calc(28.4% + var(--accent-lightness-offset)), 0.25);
    --cs-hole: hsla(calc(var(--accent-hue) + 20), 17.6%, calc(33.3% + var(--accent-lightness-offset)), 0.3);
    --cs-accent: hsla(calc(var(--accent-hue) + 17), 17.9%, calc(38.2% + var(--accent-lightness-offset)), 0.5);
    --cs-accent-2: hsla(calc(var(--accent-hue) + 17), 14.3%, calc(48% + var(--accent-lightness-offset)), 0.35);
}

.cs-stone {

    0 3px 0 rgba(var(--primary-rgb), 0.18),
    0 4px 0 rgba(var(--primary-rgb), 0.16),
    0 5px 0 rgba(var(--primary-rgb), 0.15),
    0 6px 0 rgba(var(--primary-rgb), 0.14),
    0 7px 0 rgba(var(--primary-rgb), 0.12),
    0 8px 0 rgba(var(--primary-rgb), 0.11),
    /* C. 厚度下缘 bounce 光（桌面反射到侧壁底缘的一线亮边） */
    0 9px 0 rgba(var(--white-rgb), 0.12),
    /* D. 三层接触影：量感对齐暗色，颜色更轻 */
    0 9px 8px -2px rgba(var(--deep-rgb), 0.08),
    0 14px 26px -4px rgba(var(--deep-rgb), 0.06),
    0 22px 50px -8px rgba(var(--deep-rgb), 0.04),
    /* B. 顶边锐高光（外缘最顶细线，保留） */
    inset 0 1px 0 rgba(var(--white-rgb), 0.42),
    /* B. 正面柔光斜面倒角（16px：上/左受光保留，下/右暗面用浅绿保留厚度） */
    inset 0 16px 22px -12px rgba(var(--white-rgb), 0.48),
    inset 0 -16px 22px -12px rgba(var(--primary-rgb), 0.09),
    inset 16px 0 22px -12px rgba(var(--white-rgb), 0.30),
    inset -16px 0 22px -12px rgba(var(--primary-rgb), 0.07),
    /* C. 底部内侧 bounce（桌面反射回底部的柔和亮带） */
    inset 0 -6px 8px -6px rgba(var(--white-rgb), 0.20),
    /* 内部透光与底部折射 */
    inset 0 8px 24px rgba(var(--white-rgb), 0.14),
    inset 0 -14px 26px rgba(var(--white-rgb), 0.08);
  transition: transform .3s;
}
/* 栏栅玻璃（长虹玻璃）：竖向棱条，周期 9px。
   分层：外壳 backdrop-filter 负责「模糊背景（透光不透影）」，
   本层叠在其上做棱条的「亮脊→中调→暗边」折射。
   位于内容之下（z 0）：不透明屏幕自然遮住条纹（屏幕不带条纹），
   半透明按键/PRINT 则透出下方棱条，整体质感统一。 */
.tw-case::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    /* 斜向镜面扫光：让绿玻璃表面有反射高光带（体积感关键） */
    linear-gradient(110deg, transparent 32%, rgba(var(--white-rgb), 0.20) 48%, rgba(var(--white-rgb), 0.06) 60%, transparent 76%),
    repeating-linear-gradient(90deg,
      rgba(var(--white-rgb), 0.14) 0px,
      rgba(var(--white-rgb), 0.05) 1.5px,
      rgba(var(--white-rgb), 0.01) 3.5px,
      rgba(var(--black-rgb), 0.01) 5px,
      rgba(var(--black-rgb), 0.06) 7px,
      rgba(var(--black-rgb), 0.02) 9px),
    radial-gradient(ellipse 60% 50% at 20% 15%, rgba(var(--white-rgb), 0.14), transparent 62%),
    radial-gradient(ellipse 50% 55% at 85% 90%, rgba(var(--white-rgb), 0.08), transparent 62%);
  pointer-events: none;
  /* 边缘磨砂 mask：中心栏栅饱满，圆角/底边/顶边棱条渐隐，
     真实长虹玻璃边缘的磨砂过渡，避免条纹在圆角处硬截断 */
  -webkit-mask-image: radial-gradient(ellipse 78% 72% at 50% 45%, black 55%, transparent 100%);
          mask-image: radial-gradient(ellipse 78% 72% at 50% 45%, black 55%, transparent 100%);
  z-index: 0;
}
/* 票根式顶部 1px 渐变高光线：精致边缘光（取代原硬侧光） */
.tw-case::after {
  content: "";
  position: absolute;
  top: 0.5px; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--white-rgb), 0.45), transparent);
  pointer-events: none;
  z-index: 2;
}
.tw-case:hover { transform: scale(1.005); }

/* 窄栏紧凑模式：机身外轮廓收成正方形（外壳方，屏幕 flex 填满）。
   由 JS _observeScale 量得 .tw-case 宽度 ≤400px 时加 .tw-square 触发
   （本环境 Electron 不支持 @container，故改用 class 切换）。
   用 flex 列 + aspect-ratio:1 强制正方，屏幕 flex:1 填满；
   .tw-screen min-height:0 / 输入区 height:auto 防止内容把外轮廓反推成竖条。 */
.tw-case.tw-square {
  display: flex;
  flex-direction: column;
  aspect-ratio: 1 / 1;
}
.tw-case.tw-square .tw-screen {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.tw-case.tw-square .tw-screen-input-wrap {
  flex: 1 1 auto;
  height: auto;
  min-height: 5.4em;
}

/* 暗色模式：降低机身绿玻璃不透明度 + 降饱和，让背景透出，避免颜色太实 */
.theme-dark .tw-case,
:host(.dark) .tw-case {
  background:
    linear-gradient(135deg,
      rgba(var(--pale-rgb), 0.30) 0%,
      rgba(var(--primary-rgb), 0.24) 45%,
      rgba(var(--bamboo-deep-rgb), 0.20) 100%);
  -webkit-backdrop-filter: blur(20px) saturate(1.3) brightness(1.0);
  backdrop-filter: blur(20px) saturate(1.3) brightness(1.0);
  box-shadow:
    0 1px 0 rgba(var(--bamboo-deep-rgb), 0.32),
    0 2px 0 rgba(var(--bamboo-deep-rgb), 0.30),
    0 3px 0 rgba(var(--bamboo-deep-rgb), 0.28),
    0 4px 0 rgba(var(--bamboo-deep-rgb), 0.26),
    0 5px 0 rgba(var(--bamboo-deep-rgb), 0.24),
    0 6px 0 rgba(var(--bamboo-deep-rgb), 0.22),
    0 7px 0 rgba(var(--bamboo-deep-rgb), 0.20),
    0 8px 0 rgba(var(--bamboo-deep-rgb), 0.18),
    0 9px 0 rgba(var(--white-rgb), 0.12),
    0 9px 8px -2px rgba(var(--deep-rgb), 0.16),
    0 14px 26px -4px rgba(var(--deep-rgb), 0.12),
    0 22px 50px -8px rgba(var(--deep-rgb), 0.10),
    inset 0 1px 0 rgba(var(--white-rgb), 0.42),
    inset 0 16px 22px -12px rgba(var(--white-rgb), 0.48),
    inset 0 -16px 22px -12px rgba(var(--deep-rgb), 0.30),
    inset 16px 0 22px -12px rgba(var(--white-rgb), 0.30),
    inset -16px 0 22px -12px rgba(var(--deep-rgb), 0.26),
    inset 0 -6px 8px -6px rgba(var(--white-rgb), 0.18),
    inset 0 8px 24px rgba(var(--white-rgb), 0.14),
    inset 0 -14px 26px rgba(var(--primary-rgb), 0.14);
}

/* 顶部标签：AUTO-FEED + SERIES 9000 5G */
.tw-case-label {
  display: flex;
  align-items: center;
  margin: 0 0.53em 0.8em 0;
  font-family: "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.6em;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-dark);
  opacity: 0.95;
}
/* 标签两端文字禁止折行，避免窄设备下 "AUTO- FEED" 被截断 */
.tw-case-label > span,
.tw-case-label .tw-case-right { white-space: nowrap; }
.tw-case-label .tw-dot {
  display: inline-block;
  width: 0.4em; height: 0.4em;
  margin-right: 0.25em;
  border-radius: 50%;
  background: rgb(var(--danger-rgb));
  animation: tw-pulse 1s infinite;
  vertical-align: middle;
}
.tw-case-right { display: inline-flex; align-items: center; gap: 0.27em; margin-left: auto; }
.tw-signal { letter-spacing: -0.07em; }

/* 屏幕（深色玻璃盖板，荧光绿透出） */
.tw-screen {
  position: relative;
  padding: 0.93em 1.07em;
  border-radius: 0.8em;
  background: linear-gradient(135deg, rgba(var(--white-rgb), 0.55), rgba(var(--pale-rgb), 0.72));
  -webkit-backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  /* 凹陷式：亮色下用深绿边 + 内凹阴影，强化“挖进机身”的体感 */
  border: 1px solid rgba(var(--bamboo-deep-rgb), 0.28);
  border-bottom: 1px solid rgba(var(--white-rgb), 0.5);
  box-shadow:
    /* 上内壁背光（孔的上沿没光） */
    inset 0 9px 18px -4px rgba(var(--bamboo-deep-rgb), 0.22),
    inset 0 22px 34px -16px rgba(var(--bamboo-deep-rgb), 0.16),
    inset 10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    inset -10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    /* 下内壁受反光 */
    inset 0 -3px 0 rgba(var(--white-rgb), 0.55),
    inset 0 -24px 42px rgba(var(--primary-rgb), 0.12),
    0 0 0 1px rgba(var(--bamboo-deep-rgb), 0.20);
  margin-bottom: 1.6em;
}

/* 亮色模式：屏幕/标签在浅机身中减重（暗色模式保持原深色） */
:host(:not(.dark)) .tw-screen,
body:not(.dark) .tw-screen {
  background: linear-gradient(135deg, rgba(var(--white-rgb), 0.55), rgba(var(--pale-rgb), 0.72));
  -webkit-backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  border: 1px solid rgba(var(--bamboo-deep-rgb), 0.28);
  border-bottom: 1px solid rgba(var(--white-rgb), 0.5);
  box-shadow:
    /* 上内壁背光（孔的上沿没光） */
    inset 0 9px 18px -4px rgba(var(--bamboo-deep-rgb), 0.22),
    inset 0 22px 34px -16px rgba(var(--bamboo-deep-rgb), 0.16),
    inset 10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    inset -10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    /* 下内壁受反光 */
    inset 0 -3px 0 rgba(var(--white-rgb), 0.55),
    inset 0 -24px 42px rgba(var(--primary-rgb), 0.12),
    0 0 0 1px rgba(var(--bamboo-deep-rgb), 0.20);
  }
/* 亮色模式：系统消息浮层改用浅墨绿半透明底，避免切换便签样式瞬间闪黑屏 */
:host(:not(.dark)) .tw-screen-msg,
body:not(.dark) .tw-screen-msg {
  background: rgba(70, 120, 85, 0.72);
}

/* 暗色模式：深色屏幕凹进机身（挖孔质感，光源在上方，加深） */
.theme-dark .tw-screen,
:host(.dark) .tw-screen {
  background: linear-gradient(160deg, rgba(var(--black-rgb), 0.74), rgba(var(--deep-rgb), 0.86));
  -webkit-backdrop-filter: blur(6px) saturate(1.3) brightness(0.78);
  backdrop-filter: blur(6px) saturate(1.3) brightness(0.78);
  border: 1px solid rgba(var(--black-rgb), 0.55);
  box-shadow:
    /* 外框上沿：机身在屏幕上缘压下的更深暗影（凹坑外缘背光加重） */
    0 -7px 16px -3px rgba(var(--black-rgb), 0.72),
    /* 外框下沿：机身下缘受光的亮线（中性光，非绿） */
    0 3px 6px rgba(var(--white-rgb), 0.14),
    /* 内凹：上内壁暗（加深加大）、下内壁亮（加强） */
    inset 0 16px 26px -10px rgba(var(--black-rgb), 0.88),
    inset 0 -14px 22px -10px rgba(var(--white-rgb), 0.18),
    /* 内描边：加深挖孔边界 */
    inset 0 0 0 1px rgba(var(--black-rgb), 0.65),
    /* CRT 屏幕中心极淡荧光绿辉光（仅为内容发光感） */
    inset 0 0 40px rgba(var(--green-very-bright-rgb), 0.06);
}
.theme-dark .tw-screen-top { color: rgba(var(--green-very-bright-rgb), 0.7); }
/* 暗色屏幕：隐藏右侧玻璃高光，避免凹陷玻璃被方向性照亮出现"右侧翘起" */
.theme-dark .tw-screen-glare,
:host(.dark) .tw-screen-glare { display: none; }

:host(:not(.dark)) .tw-screen-top,
body:not(.dark) .tw-screen-top {
  color: rgba(var(--bamboo-deep-rgb), 0.72);
}

/* 亮色模式：屏内文字改深绿可读，避免荧光绿在淡白绿背景上糊 */
:host(:not(.dark)) .tw-input,
body:not(.dark) .tw-input {
  color: rgb(var(--bamboo-deep-rgb));
  caret-color: rgb(var(--bamboo-deep-rgb));
  text-shadow: none;
  /* 亮色模式：给屏内输入区一块内屏底色，与外层玻璃分层（避免整屏糊成一体） */
  background: rgba(var(--pale-rgb), 0.7);
  border-radius: 0;
  padding: 0.53em 0.67em;
  box-shadow:
    inset 0 3px 6px -2px rgba(var(--bamboo-deep-rgb), 0.14),
    inset 0 -2px 4px -2px rgba(var(--white-rgb), 0.75),
    0 0 0 1px rgba(var(--primary-rgb), 0.15);
}
:host(:not(.dark)) .tw-screen-font,
body:not(.dark) .tw-screen-font {
  color: rgb(var(--bamboo-deep-rgb));
  opacity: 0.85;
}

:host(:not(.dark)) .tw-case-label,
body:not(.dark) .tw-case-label {
  color: var(--ink-medium);
  opacity: 0.78;
}

:host(:not(.dark)) .tw-case-right,
body:not(.dark) .tw-case-right {
  color: rgba(45, 130, 70, 0.9);
}

.tw-screen-glare {
  position: absolute;
  top: 0; right: 0;
  width: 66%; height: 100%;
  background: linear-gradient(to left, rgba(var(--white-rgb),0.08), rgba(var(--white-rgb),0.02) 55%, transparent);
  pointer-events: none;
  border-top-right-radius: 0.8em;
  border-bottom-right-radius: 0.8em;
  mix-blend-mode: screen;
}
.tw-screen-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.27em;
  font-family: Menlo, Consolas, monospace;
  font-size: 0.6em;
  color: rgba(var(--bamboo-deep-rgb), 0.72);
  user-select: none;
}
/* 屏幕顶栏两端文字禁止折行（避免窄设备下 "凝墨成笺FONT:" 粘连） */
.tw-screen-top > span,
.tw-screen-font { white-space: nowrap; }
.tw-screen-font { color: rgb(var(--bamboo-deep-rgb)); opacity: 0.85; }
.theme-dark .tw-screen-font { color: rgb(var(--green-very-bright-rgb)); opacity: 0.8; }
.tw-batt { opacity: 0.6; }

.tw-screen-input-wrap { position: relative; min-height: 5.4em; height: 5.4em; }
.tw-input {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  resize: none;
  border: none; outline: none;
  background: transparent;
  color: rgb(var(--bamboo-deep-rgb));
  font-family: var(--tw-font-screen);
  font-size: 1.2em;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  caret-color: rgb(var(--bamboo-deep-rgb));
  text-shadow: none;
}
.theme-dark .tw-input {
  color: rgb(var(--green-very-bright-rgb));
  caret-color: rgb(var(--green-very-bright-rgb));
  text-shadow: 0 0 6px rgba(var(--green-very-bright-rgb), 0.4);
}
.tw-input::placeholder { color: rgba(var(--bamboo-deep-rgb), 0.5); text-transform: uppercase; }
.theme-dark .tw-input::placeholder { color: rgba(var(--green-very-bright-rgb), 0.5); }
.tw-input::selection { background: rgb(var(--bamboo-deep-rgb)); color: #fff; }
.theme-dark .tw-input::selection { background: rgb(var(--green-very-bright-rgb)); color: #000; }
/* 黑屏细滚动条（文字超屏时不突兀） */
.tw-input { scrollbar-width: thin; scrollbar-color: rgba(var(--bamboo-deep-rgb),0.25) transparent; }
.tw-input::-webkit-scrollbar { width: 6px; }
.tw-input::-webkit-scrollbar-track { background: transparent; }
.tw-input::-webkit-scrollbar-thumb { background: rgba(var(--bamboo-deep-rgb),0.25); border-radius: 3px; }
.theme-dark .tw-input { scrollbar-color: rgba(var(--green-very-bright-rgb),0.25) transparent; }
.theme-dark .tw-input::-webkit-scrollbar-thumb { background: rgba(var(--green-very-bright-rgb),0.25); }

/* 屏幕光标（聚焦时右上角脉冲点） */
.tw-cursor {
  position: absolute;
  top: 0.27em; right: 0.27em;
  width: 0.53em; height: 0.53em;
  border-radius: 50%;
  background: rgb(var(--bamboo-deep-rgb));
  opacity: 0;
  pointer-events: none;
}
.theme-dark .tw-cursor {
  background: rgb(var(--green-very-bright-rgb));
}
.tw-cursor.on { opacity: 0.5; }

/* 系统消息浮层（TRANSMITTING / FONT） */
.tw-screen-msg {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(var(--surface-deep-rgb),0.9);
  font-family: var(--tw-font-screen);
  font-size: 1.2em;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: rgb(var(--green-very-bright-rgb));
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.tw-screen-msg.on { opacity: 1; }

/* 控制区 */
.tw-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.53em;
  margin: 0 0.27em;
  transform: translateY(-0.8em);
}
.tw-keys-left { display: flex; gap: 0.93em; }
.tw-rbtn {
  width: 1.07em; height: 1.07em;
  min-width: 0; min-height: 0;
  padding: 0;
  box-sizing: border-box;
  font-size: calc(var(--tw-scale, 1) * 28px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  /* 干净玻璃球：高光点 + 顶面玻璃反光 + 底部细反光 + 球面本体（左上受光→右下背光） */
  border: 0.07em solid rgba(var(--white-rgb), 0.34);
  background:
    radial-gradient(circle at 33% 27%,
      rgba(var(--white-rgb), 0.85) 0%,
      rgba(var(--white-rgb), 0.5) 9%,
      rgba(var(--white-rgb), 0.18) 20%,
      transparent 34%),
    radial-gradient(ellipse 48% 30% at 39% 28%,
      rgba(var(--white-rgb), 0.55) 0%,
      rgba(var(--white-rgb), 0.14) 42%,
      transparent 66%),
    radial-gradient(ellipse 62% 24% at 52% 95%,
      rgba(var(--white-rgb), 0.16) 0%,
      transparent 60%),
    radial-gradient(circle at 36% 32%,
      color-mix(in srgb, rgb(var(--primary-rgb)), white 56%) 0%,
      rgb(var(--primary-rgb)) 56%,
      color-mix(in srgb, rgb(var(--primary-rgb)), black 40%) 100%);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  color: #fff;
  /* 机身挖孔：按钮镶在深色圆井里；仅保留柔和投影，不再加内阴影暗带 */
  box-shadow:
    0 0 0 0.07em rgba(var(--deep-rgb), 0.82),
    0 0 0 0.11em rgba(var(--deep-rgb), 0.42),
    0 0.09em 0.22em rgba(var(--black-rgb), 0.28),
    0 0 0.5em rgba(var(--primary-rgb), 0.30);
  cursor: pointer;
  transition: color .15s, transform .08s;
}
.tw-rbtn svg { width: 0.55em; height: 0.55em; }
.tw-rbtn:hover { color: #fff; }
.tw-rbtn:active { transform: translateY(0.13em); box-shadow: 0 0 0 0.07em rgba(var(--deep-rgb), 0.82), 0 0 0 0.11em rgba(var(--deep-rgb), 0.42), 0 0 0.18em rgba(var(--black-rgb), 0.30), inset 0 0.18em 0.4em rgba(var(--deep-rgb), 0.5); }
#twPaper:hover { color: rgb(var(--pale-rgb)); }
#twFont:hover { color: #fff; }
#twClear:hover { color: rgb(var(--danger-rgb)); }

.tw-grill { display: none; flex-direction: column; gap: 0.27em; opacity: 0.2; }
.tw-grill i { display: block; width: 3.2em; height: 0.13em; border-radius: 0.13em; background: #000; }
@media (min-width: 768px) { .tw-grill { display: flex; } }

/* 橙色 PRINT 大钮 */
.tw-print {
  font-size: calc(var(--tw-scale, 1) * 28px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.07em; height: 1.07em;
  min-width: 0; min-height: 0;
  padding: 0;
  box-sizing: border-box;
  border: 0.07em solid rgba(var(--white-rgb), 0.36);
  border-radius: 50%;
  /* 干净玻璃球：高光点 + 顶面玻璃反光 + 底部细反光 + 球面本体 */
  background:
    radial-gradient(circle at 33% 27%,
      rgba(var(--white-rgb), 0.85) 0%,
      rgba(var(--white-rgb), 0.5) 9%,
      rgba(var(--white-rgb), 0.18) 20%,
      transparent 34%),
    radial-gradient(ellipse 48% 30% at 39% 28%,
      rgba(var(--white-rgb), 0.55) 0%,
      rgba(var(--white-rgb), 0.14) 42%,
      transparent 66%),
    radial-gradient(ellipse 62% 24% at 52% 95%,
      rgba(var(--white-rgb), 0.16) 0%,
      transparent 60%),

.tw-card-resize {
  position: absolute;
  right: 0.15em;
  bottom: 0.15em;
  width: 1.5em;
  height: 1.5em;
  z-index: 40;
  cursor: nwse-resize;
  opacity: 0;
  transition: opacity 0.15s;
  touch-action: none;
}
.tw-card:hover .tw-card-resize,
.tw-card.is-resizing .tw-card-resize { opacity: 0.75; }

.tw-card-resize::before,
.tw-card-resize::after {
  content: "";
  position: absolute;
  right: 0.2em;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  border-bottom-right-radius: 1px;
}
.tw-card-resize::before { bottom: 0.85em; width: 0.45em; height: 0.45em; }
.tw-card-resize::after  { bottom: 0.2em;  width: 0.9em;  height: 0.9em; }


.tw-card-rotate {
  position: absolute;
  left: 50%;
  bottom: calc(-0.8em - 10px);
  width: clamp(26px, calc(30px * var(--tw-scale, 1)), 38px);
  height: clamp(26px, calc(30px * var(--tw-scale, 1)), 38px);
  transform: translate(-50%, 0);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  border: 1.5px solid rgba(16, 24, 40, 0.16);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    0 8px 18px -6px rgba(16, 24, 40, 0.32);
  color: #46503f;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  
  opacity: 0;
  pointer-events: none;
  touch-action: none;
  transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}
.tw-card-rotate svg { width: clamp(15px, calc(17px * var(--tw-scale, 1)), 21px); height: clamp(15px, calc(17px * var(--tw-scale, 1)), 21px); }
.tw-card-rotate:hover { color: #2f3a2c; }
.tw-card-rotate:active { cursor: grabbing; }

.tw-links {
  position: absolute;
  inset: 0;
  overflow: visible;
  pointer-events: none;   
  z-index: 1;
  
  --tw-link-stroke: rgba(46, 62, 40, 0.42);
  --tw-link-stroke-hi: rgba(46, 62, 40, 0.9);
}

.tw-link {
  fill: none;
  stroke: var(--tw-link-stroke);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  /* 默认实线；虚线由 .tw-link.is-dashed 单独开启（见下方）。
   * 注意：不要把 dasharray 放在基础样式里，否则 solid 与 dashed 两种状态都会是虚线，
   * 导致实线切换失效。 */
  pointer-events: none;   
  transition: stroke 0.18s ease;
}

.tw-link-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 16;
  stroke-linecap: round;
  pointer-events: stroke;
  cursor: pointer;
}

.tw-link-ctl {
  fill: #fff;
  stroke: var(--tw-link-stroke-hi);
  stroke-width: 1.5;
  pointer-events: auto;
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: transform .15s ease, fill .15s ease;
}
.tw-link-ctl:hover { transform: scale(1.25); fill: var(--tw-link-stroke-hi); }
.tw-link-bend { cursor: grab; }
.tw-link-bend:active { cursor: grabbing; }

.tw-link-mode { fill: #4a90d9; stroke: #2f6fb0; }
.tw-link-mode:hover { fill: #3f7fc4; }
:host(.dark) .tw-link-mode { fill: #6fb0ef; stroke: #3f87c9; }
:host(.dark) .tw-link-mode:hover { fill: #8cc2f5; }

/* 虚线线身：与 .tw-link.is-temp 同一套 dash 节奏，保持视觉语言一致 */
.tw-link.is-dashed { stroke-dasharray: 5 5; }

.tw-link-ctl.tw-link-dash { cursor: pointer; }
.tw-link-dash-bg {
  fill: rgba(255, 255, 255, 0.92);
  stroke: rgba(46, 62, 40, 0.55);
  stroke-width: 1.5;
  transition: fill .14s ease, stroke .14s ease;
}
.tw-link-dash-ico {
  fill: none;
  stroke: rgba(46, 62, 40, 0.85);
  stroke-width: 1.6;
  stroke-linecap: round;
  transition: stroke .14s ease;
}
.tw-link-ctl.tw-link-dash:hover .tw-link-dash-bg { fill: rgba(46, 62, 40, 0.95); stroke: rgba(46, 62, 40, 0.95); }
.tw-link-ctl.tw-link-dash:hover .tw-link-dash-ico { stroke: #fff; }
/* 当前为虚线态时，钮底染蓝以提示「此线已虚线」 */
.tw-link-dash.is-on .tw-link-dash-bg { fill: rgba(74, 144, 217, 0.95); stroke: #2f6fb0; }
.tw-link-dash.is-on .tw-link-dash-ico { stroke: #fff; }
:host(.dark) .tw-link-dash-bg { fill: rgba(40, 46, 38, 0.92); stroke: rgba(206, 220, 190, 0.6); }
:host(.dark) .tw-link-dash-ico { stroke: rgba(206, 220, 190, 0.9); }
:host(.dark) .tw-link-ctl.tw-link-dash:hover .tw-link-dash-bg { fill: rgba(206, 220, 190, 0.95); }
:host(.dark) .tw-link-ctl.tw-link-dash:hover .tw-link-dash-ico { stroke: #1c1f1a; }
:host(.dark) .tw-link-dash.is-on .tw-link-dash-bg { fill: rgba(111, 176, 239, 0.95); stroke: #3f87c9; }

.tw-link-ctl.tw-link-del { cursor: pointer; }
.tw-link-del-bg {
  fill: rgba(255, 255, 255, 0.92);
  stroke: rgba(178, 78, 58, 0.65);
  stroke-width: 1.5;
  transition: fill .14s ease, stroke .14s ease;
}
.tw-link-del-x {
  fill: none;
  stroke: rgba(178, 78, 58, 0.9);
  stroke-width: 1.8;
  stroke-linecap: round;
  transition: stroke .14s ease;
}
.tw-link-ctl.tw-link-del:hover .tw-link-del-bg { fill: rgba(178, 78, 58, 0.95); stroke: rgba(178, 78, 58, 0.95); }
.tw-link-ctl.tw-link-del:hover .tw-link-del-x { stroke: #fff; }
:host(.dark) .tw-link-del-bg { fill: rgba(40, 46, 38, 0.92); stroke: rgba(214, 120, 96, 0.72); }

/* 板块容器：统一控制各板块之间的间距 */
.sections-container {

    flex-direction: column;

/* 桌面端横向布局模式：在首页根容器 #reviewContainer（class .container）上加 .horizontal-layout 时，
   首页板块从纵向流式改为多列网格（按板块数均分列数）。
   沿用现有板块顺序，仅改变排版方向（多列换行），不触碰板块顺序逻辑。
   默认纵向；仅手动切到横向才生效（会话内临时视图，不持久化）。
   仅 ≥600px 生效（与 display-compact ≤600 窄栏语义对齐）：更窄时即使残留 class
   也强制纵向 + 隐藏入口，保证"桌面/宽栏专属"。 */
.desktop-only {
    display: none;
}
@media (min-width: 600px) {
    .desktop-only {
        display: inline-flex;
    }

    /* ===== 横向模式（独立规则）：交替入列瀑布流 ===== */
    .sections-container.horizontal-layout {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    .sections-container.horizontal-layout .layout-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    .sections-container.horizontal-layout .layout-col #themeEffectSection {
        width: 100%;
        min-width: 0;
    }

    /* ===== 看板模式（独立规则）：一行全排开，每板块一列 ===== */
    .sections-container.kanban-layout {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    .sections-container.kanban-layout .layout-col.kanban-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    /* 看板：各板块顶部对齐，清除任何顶部外边距/内边距导致的错位 */

    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1.2em;
    height: 1.2em;
    margin: -0.6em 0 0 -0.6em;
    border: 2px solid rgba(var(--white-rgb), 0.4);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: bm-btn-spin 0.6s linear infinite;
    box-sizing: border-box;
}
/* 浅色背景变体用主色 spinner，保证对比度 */
.bm-btn--secondary.bm-btn--loading::after,
.bm-btn--ghost.bm-btn--loading::after,
.bm-btn--outline.bm-btn--loading::after {

    border-top-color: var(--bamboo-primary);
}
@keyframes bm-btn-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
    .bm-btn--loading::after {
        animation-duration: 1.4s;
    }
}

/* === 兼容：补齐 .loading-spinner 基础定义 ===
 * base.css reduced-motion 块引用了 .loading-spinner::before 但缺基础定义；
 * 此处将 border/animation 放到 ::before 伪元素上，与 base.css 的 reduced-motion
 * 覆写（.loading-spinner::before { animation: none; ... }）对齐，使其不再是死代码。
 * 复用 bm-btn-spin 动画，供独立 spinner 元素使用。 */
.loading-spinner {
    display: inline-block;
    width: 1.2em;
    height: 1.2em;
    position: relative;
    vertical-align: middle;
}
.loading-spinner::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 2px solid rgba(var(--primary-rgb), 0.2);
    border-top-color: var(--bamboo-primary);
    border-radius: 50%;
    animation: bm-btn-spin 0.6s linear infinite;
    box-sizing: border-box;
}
