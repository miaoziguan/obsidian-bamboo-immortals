  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  /* 根字号由 JS _observeScale 按 .tw-case 真实宽度写入内联 px 驱动；
     机身内尺寸一律 em 跟随，比例自洽（本环境 Electron 不支持 cqi，故不用容器查询） */
  font-size: 14.5px;
  padding: 1.07em 1.6em 2.13em;
  border-radius: 1.6em;
  /* 玻璃通透外壳：亮色下更轻更透 */
  background: linear-gradient(135deg,
    rgba(var(--pale-rgb), 0.38) 0%,
    rgba(var(--primary-rgb), 0.30) 45%,
    rgba(var(--bamboo-deep-rgb), 0.24) 100%);
  -webkit-backdrop-filter: blur(20px) saturate(1.2) brightness(1.12);
  backdrop-filter: blur(20px) saturate(1.2) brightness(1.12);
  border: 1px solid rgba(var(--white-rgb), 0.55);
  box-shadow:
    /* A. 厚度侧壁（8px）：量感对齐暗色，颜色进一步调浅 */
    0 1px 0 rgba(var(--primary-rgb), 0.20),
    0 2px 0 rgba(var(--primary-rgb), 0.19),
    0 3px 0 rgba(var(--primary-rgb), 0.18),
    0 4px 0 rgba(var(--primary-rgb), 0.16),
    0 5px 0 rgba(var(--primary-rgb), 0.15),
    0 6px 0 rgba(var(--primary-rgb), 0.14),
    0 7px 0 rgba(var(--primary-rgb), 0.12),
    0 8px 0 rgba(var(--primary-rgb), 0.11),
    /* C. 厚度下缘 bounce 光（桌面反射到侧壁底缘的一线亮边） */
    0 9px 0 rgba(var(--white-rgb), 0.12),
    /* D. 三层接触影：量感对齐暗色，颜色更轻 */
    0 9px 8px -2px rgba(var(--deep-rgb), 0.08),
    0 14px 26px -4px rgba(var(--deep-rgb), 0.06),
    0 22px 50px -8px rgba(var(--deep-rgb), 0.04),
    /* B. 顶边锐高光（外缘最顶细线，保留） */
    inset 0 1px 0 rgba(var(--white-rgb), 0.42),
    /* B. 正面柔光斜面倒角（16px：上/左受光保留，下/右暗面用浅绿保留厚度） */
    inset 0 16px 22px -12px rgba(var(--white-rgb), 0.48),
    inset 0 -16px 22px -12px rgba(var(--primary-rgb), 0.09),
    inset 16px 0 22px -12px rgba(var(--white-rgb), 0.30),
    inset -16px 0 22px -12px rgba(var(--primary-rgb), 0.07),
    /* C. 底部内侧 bounce（桌面反射回底部的柔和亮带） */
    inset 0 -6px 8px -6px rgba(var(--white-rgb), 0.20),
    /* 内部透光与底部折射 */
    inset 0 8px 24px rgba(var(--white-rgb), 0.14),
    inset 0 -14px 26px rgba(var(--white-rgb), 0.08);
  transition: transform .3s;
}
/* 栏栅玻璃（长虹玻璃）：竖向棱条，周期 9px。
   分层：外壳 backdrop-filter 负责「模糊背景（透光不透影）」，
   本层叠在其上做棱条的「亮脊→中调→暗边」折射。
   位于内容之下（z 0）：不透明屏幕自然遮住条纹（屏幕不带条纹），
   半透明按键/PRINT 则透出下方棱条，整体质感统一。 */
.tw-case::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    /* 斜向镜面扫光：让绿玻璃表面有反射高光带（体积感关键） */
    linear-gradient(110deg, transparent 32%, rgba(var(--white-rgb), 0.20) 48%, rgba(var(--white-rgb), 0.06) 60%, transparent 76%),
    repeating-linear-gradient(90deg,
      rgba(var(--white-rgb), 0.14) 0px,
      rgba(var(--white-rgb), 0.05) 1.5px,
      rgba(var(--white-rgb), 0.01) 3.5px,
      rgba(var(--black-rgb), 0.01) 5px,
      rgba(var(--black-rgb), 0.06) 7px,
      rgba(var(--black-rgb), 0.02) 9px),
    radial-gradient(ellipse 60% 50% at 20% 15%, rgba(var(--white-rgb), 0.14), transparent 62%),
    radial-gradient(ellipse 50% 55% at 85% 90%, rgba(var(--white-rgb), 0.08), transparent 62%);
  pointer-events: none;
  /* 边缘磨砂 mask：中心栏栅饱满，圆角/底边/顶边棱条渐隐，
     真实长虹玻璃边缘的磨砂过渡，避免条纹在圆角处硬截断 */
  -webkit-mask-image: radial-gradient(ellipse 78% 72% at 50% 45%, black 55%, transparent 100%);
          mask-image: radial-gradient(ellipse 78% 72% at 50% 45%, black 55%, transparent 100%);
  z-index: 0;
}
/* 票根式顶部 1px 渐变高光线：精致边缘光（取代原硬侧光） */
.tw-case::after {
  content: "";
  position: absolute;
  top: 0.5px; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--white-rgb), 0.45), transparent);
  pointer-events: none;
  z-index: 2;
}
.tw-case:hover { transform: scale(1.005); }

/* 窄栏紧凑模式：机身外轮廓收成正方形（外壳方，屏幕 flex 填满）。
   由 JS _observeScale 量得 .tw-case 宽度 ≤400px 时加 .tw-square 触发
   （本环境 Electron 不支持 @container，故改用 class 切换）。
   用 flex 列 + aspect-ratio:1 强制正方，屏幕 flex:1 填满；
   .tw-screen min-height:0 / 输入区 height:auto 防止内容把外轮廓反推成竖条。 */
.tw-case.tw-square {
  display: flex;
  flex-direction: column;
  aspect-ratio: 1 / 1;
}
.tw-case.tw-square .tw-screen {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.tw-case.tw-square .tw-screen-input-wrap {
  flex: 1 1 auto;
  height: auto;
  min-height: 5.4em;
}

/* 暗色模式：降低机身绿玻璃不透明度 + 降饱和，让背景透出，避免颜色太实 */
.theme-dark .tw-case,
:host(.dark) .tw-case {
  background:
    linear-gradient(135deg,
      rgba(var(--pale-rgb), 0.30) 0%,
      rgba(var(--primary-rgb), 0.24) 45%,
      rgba(var(--bamboo-deep-rgb), 0.20) 100%);
  -webkit-backdrop-filter: blur(20px) saturate(1.3) brightness(1.0);
  backdrop-filter: blur(20px) saturate(1.3) brightness(1.0);
  box-shadow:
    0 1px 0 rgba(var(--bamboo-deep-rgb), 0.32),
    0 2px 0 rgba(var(--bamboo-deep-rgb), 0.30),
    0 3px 0 rgba(var(--bamboo-deep-rgb), 0.28),
    0 4px 0 rgba(var(--bamboo-deep-rgb), 0.26),
    0 5px 0 rgba(var(--bamboo-deep-rgb), 0.24),
    0 6px 0 rgba(var(--bamboo-deep-rgb), 0.22),
    0 7px 0 rgba(var(--bamboo-deep-rgb), 0.20),
    0 8px 0 rgba(var(--bamboo-deep-rgb), 0.18),
    0 9px 0 rgba(var(--white-rgb), 0.12),
    0 9px 8px -2px rgba(var(--deep-rgb), 0.16),
    0 14px 26px -4px rgba(var(--deep-rgb), 0.12),
    0 22px 50px -8px rgba(var(--deep-rgb), 0.10),
    inset 0 1px 0 rgba(var(--white-rgb), 0.42),
    inset 0 16px 22px -12px rgba(var(--white-rgb), 0.48),
    inset 0 -16px 22px -12px rgba(var(--deep-rgb), 0.30),
    inset 16px 0 22px -12px rgba(var(--white-rgb), 0.30),
    inset -16px 0 22px -12px rgba(var(--deep-rgb), 0.26),
    inset 0 -6px 8px -6px rgba(var(--white-rgb), 0.18),
    inset 0 8px 24px rgba(var(--white-rgb), 0.14),
    inset 0 -14px 26px rgba(var(--primary-rgb), 0.14);
}

/* 顶部标签：AUTO-FEED + SERIES 9000 5G */
.tw-case-label {
  display: flex;
  align-items: center;
  margin: 0 0.53em 0.8em 0;
  font-family: "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.6em;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-dark);
  opacity: 0.95;
}
/* 标签两端文字禁止折行，避免窄设备下 "AUTO- FEED" 被截断 */
.tw-case-label > span,
.tw-case-label .tw-case-right { white-space: nowrap; }
.tw-case-label .tw-dot {
  display: inline-block;
  width: 0.4em; height: 0.4em;
  margin-right: 0.25em;
  border-radius: 50%;
  background: rgb(var(--danger-rgb));
  animation: tw-pulse 1s infinite;
  vertical-align: middle;
}
.tw-case-right { display: inline-flex; align-items: center; gap: 0.27em; margin-left: auto; }
.tw-signal { letter-spacing: -0.07em; }

/* 屏幕（深色玻璃盖板，荧光绿透出） */
.tw-screen {
  position: relative;
  padding: 0.93em 1.07em;
  border-radius: 0.8em;
  background: linear-gradient(135deg, rgba(var(--white-rgb), 0.55), rgba(var(--pale-rgb), 0.72));
  -webkit-backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  /* 凹陷式：亮色下用深绿边 + 内凹阴影，强化“挖进机身”的体感 */
  border: 1px solid rgba(var(--bamboo-deep-rgb), 0.28);
  border-bottom: 1px solid rgba(var(--white-rgb), 0.5);
  box-shadow:
    /* 上内壁背光（孔的上沿没光） */
    inset 0 9px 18px -4px rgba(var(--bamboo-deep-rgb), 0.22),
    inset 0 22px 34px -16px rgba(var(--bamboo-deep-rgb), 0.16),
    inset 10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    inset -10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    /* 下内壁受反光 */
    inset 0 -3px 0 rgba(var(--white-rgb), 0.55),
    inset 0 -24px 42px rgba(var(--primary-rgb), 0.12),
    0 0 0 1px rgba(var(--bamboo-deep-rgb), 0.20);
  margin-bottom: 1.6em;
}

/* 亮色模式：屏幕/标签在浅机身中减重（暗色模式保持原深色） */
:host(:not(.dark)) .tw-screen,
body:not(.dark) .tw-screen {
  background: linear-gradient(135deg, rgba(var(--white-rgb), 0.55), rgba(var(--pale-rgb), 0.72));
  -webkit-backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  backdrop-filter: blur(6px) saturate(1.0) brightness(1.05);
  border: 1px solid rgba(var(--bamboo-deep-rgb), 0.28);
  border-bottom: 1px solid rgba(var(--white-rgb), 0.5);
  box-shadow:
    /* 上内壁背光（孔的上沿没光） */
    inset 0 9px 18px -4px rgba(var(--bamboo-deep-rgb), 0.22),
    inset 0 22px 34px -16px rgba(var(--bamboo-deep-rgb), 0.16),
    inset 10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    inset -10px 0 18px -8px rgba(var(--bamboo-deep-rgb), 0.10),
    /* 下内壁受反光 */
    inset 0 -3px 0 rgba(var(--white-rgb), 0.55),
    inset 0 -24px 42px rgba(var(--primary-rgb), 0.12),
    0 0 0 1px rgba(var(--bamboo-deep-rgb), 0.20);
  }
/* 亮色模式：系统消息浮层改用浅墨绿半透明底，避免切换便签样式瞬间闪黑屏 */
:host(:not(.dark)) .tw-screen-msg,
body:not(.dark) .tw-screen-msg {
  background: rgba(70, 120, 85, 0.72);
}

/* 暗色模式：深色屏幕凹进机身（挖孔质感，光源在上方，加深） */
.theme-dark .tw-screen,
:host(.dark) .tw-screen {
  background: linear-gradient(160deg, rgba(var(--black-rgb), 0.74), rgba(var(--deep-rgb), 0.86));
  -webkit-backdrop-filter: blur(6px) saturate(1.3) brightness(0.78);
  backdrop-filter: blur(6px) saturate(1.3) brightness(0.78);
  border: 1px solid rgba(var(--black-rgb), 0.55);
  box-shadow:
    /* 外框上沿：机身在屏幕上缘压下的更深暗影（凹坑外缘背光加重） */
    0 -7px 16px -3px rgba(var(--black-rgb), 0.72),
    /* 外框下沿：机身下缘受光的亮线（中性光，非绿） */
    0 3px 6px rgba(var(--white-rgb), 0.14),
    /* 内凹：上内壁暗（加深加大）、下内壁亮（加强） */
    inset 0 16px 26px -10px rgba(var(--black-rgb), 0.88),
    inset 0 -14px 22px -10px rgba(var(--white-rgb), 0.18),
    /* 内描边：加深挖孔边界 */
    inset 0 0 0 1px rgba(var(--black-rgb), 0.65),
    /* CRT 屏幕中心极淡荧光绿辉光（仅为内容发光感） */
    inset 0 0 40px rgba(var(--green-very-bright-rgb), 0.06);
}
.theme-dark .tw-screen-top { color: rgba(var(--green-very-bright-rgb), 0.7); }
/* 暗色屏幕：隐藏右侧玻璃高光，避免凹陷玻璃被方向性照亮出现"右侧翘起" */
.theme-dark .tw-screen-glare,
:host(.dark) .tw-screen-glare { display: none; }

:host(:not(.dark)) .tw-screen-top,
body:not(.dark) .tw-screen-top {
  color: rgba(var(--bamboo-deep-rgb), 0.72);
}

/* 亮色模式：屏内文字改深绿可读，避免荧光绿在淡白绿背景上糊 */
:host(:not(.dark)) .tw-input,
body:not(.dark) .tw-input {
  color: rgb(var(--bamboo-deep-rgb));
  caret-color: rgb(var(--bamboo-deep-rgb));
  text-shadow: none;
  /* 亮色模式：给屏内输入区一块内屏底色，与外层玻璃分层（避免整屏糊成一体） */
  background: rgba(var(--pale-rgb), 0.7);
  border-radius: 0;
  padding: 0.53em 0.67em;
  box-shadow:
    inset 0 3px 6px -2px rgba(var(--bamboo-deep-rgb), 0.14),
    inset 0 -2px 4px -2px rgba(var(--white-rgb), 0.75),
    0 0 0 1px rgba(var(--primary-rgb), 0.15);
}
:host(:not(.dark)) .tw-screen-font,
body:not(.dark) .tw-screen-font {
  color: rgb(var(--bamboo-deep-rgb));
  opacity: 0.85;
}

:host(:not(.dark)) .tw-case-label,
body:not(.dark) .tw-case-label {
  color: var(--ink-medium);
  opacity: 0.78;
}

:host(:not(.dark)) .tw-case-right,
body:not(.dark) .tw-case-right {
  color: rgba(45, 130, 70, 0.9);
}

.tw-screen-glare {
  position: absolute;
  top: 0; right: 0;
  width: 66%; height: 100%;
  background: linear-gradient(to left, rgba(var(--white-rgb),0.08), rgba(var(--white-rgb),0.02) 55%, transparent);
  pointer-events: none;
  border-top-right-radius: 0.8em;
  border-bottom-right-radius: 0.8em;
  mix-blend-mode: screen;
}
.tw-screen-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.27em;
  font-family: Menlo, Consolas, monospace;
  font-size: 0.6em;
  color: rgba(var(--bamboo-deep-rgb), 0.72);
  user-select: none;
}
/* 屏幕顶栏两端文字禁止折行（避免窄设备下 "凝墨成笺FONT:" 粘连） */
.tw-screen-top > span,
.tw-screen-font { white-space: nowrap; }
.tw-screen-font { color: rgb(var(--bamboo-deep-rgb)); opacity: 0.85; }
.theme-dark .tw-screen-font { color: rgb(var(--green-very-bright-rgb)); opacity: 0.8; }
.tw-batt { opacity: 0.6; }

.tw-screen-input-wrap { position: relative; min-height: 5.4em; height: 5.4em; }
.tw-input {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  resize: none;
  border: none; outline: none;
  background: transparent;
  color: rgb(var(--bamboo-deep-rgb));
  font-family: var(--tw-font-screen);
  font-size: 1.2em;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  caret-color: rgb(var(--bamboo-deep-rgb));
  text-shadow: none;
}
.theme-dark .tw-input {
  color: rgb(var(--green-very-bright-rgb));
  caret-color: rgb(var(--green-very-bright-rgb));
  text-shadow: 0 0 6px rgba(var(--green-very-bright-rgb), 0.4);
}
.tw-input::placeholder { color: rgba(var(--bamboo-deep-rgb), 0.5); text-transform: uppercase; }
.theme-dark .tw-input::placeholder { color: rgba(var(--green-very-bright-rgb), 0.5); }
.tw-input::selection { background: rgb(var(--bamboo-deep-rgb)); color: #fff; }
.theme-dark .tw-input::selection { background: rgb(var(--green-very-bright-rgb)); color: #000; }
/* 黑屏细滚动条（文字超屏时不突兀） */
.tw-input { scrollbar-width: thin; scrollbar-color: rgba(var(--bamboo-deep-rgb),0.25) transparent; }
.tw-input::-webkit-scrollbar { width: 6px; }
.tw-input::-webkit-scrollbar-track { background: transparent; }
.tw-input::-webkit-scrollbar-thumb { background: rgba(var(--bamboo-deep-rgb),0.25); border-radius: 3px; }
.theme-dark .tw-input { scrollbar-color: rgba(var(--green-very-bright-rgb),0.25) transparent; }
.theme-dark .tw-input::-webkit-scrollbar-thumb { background: rgba(var(--green-very-bright-rgb),0.25); }

/* 屏幕光标（聚焦时右上角脉冲点） */
.tw-cursor {
  position: absolute;
  top: 0.27em; right: 0.27em;
  width: 0.53em; height: 0.53em;
  border-radius: 50%;
  background: rgb(var(--bamboo-deep-rgb));
  opacity: 0;
  pointer-events: none;
}
.theme-dark .tw-cursor {
  background: rgb(var(--green-very-bright-rgb));
}
.tw-cursor.on { opacity: 0.5; }

/* 系统消息浮层（TRANSMITTING / FONT） */
.tw-screen-msg {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(var(--surface-deep-rgb),0.9);
  font-family: var(--tw-font-screen);
  font-size: 1.2em;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: rgb(var(--green-very-bright-rgb));
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.tw-screen-msg.on { opacity: 1; }

/* 控制区 */
.tw-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.53em;
  margin: 0 0.27em;
  transform: translateY(-0.8em);
}
.tw-keys-left { display: flex; gap: 0.93em; }
.tw-rbtn {
  width: 1.07em; height: 1.07em;
  min-width: 0; min-height: 0;
  padding: 0;
  box-sizing: border-box;
  font-size: calc(var(--tw-scale, 1) * 28px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  /* 干净玻璃球：高光点 + 顶面玻璃反光 + 底部细反光 + 球面本体（左上受光→右下背光） */
  border: 0.07em solid rgba(var(--white-rgb), 0.34);
  background:
    radial-gradient(circle at 33% 27%,
      rgba(var(--white-rgb), 0.85) 0%,
      rgba(var(--white-rgb), 0.5) 9%,
      rgba(var(--white-rgb), 0.18) 20%,
      transparent 34%),
    radial-gradient(ellipse 48% 30% at 39% 28%,
      rgba(var(--white-rgb), 0.55) 0%,
      rgba(var(--white-rgb), 0.14) 42%,
      transparent 66%),
    radial-gradient(ellipse 62% 24% at 52% 95%,
      rgba(var(--white-rgb), 0.16) 0%,
      transparent 60%),
    radial-gradient(circle at 36% 32%,
      color-mix(in srgb, rgb(var(--primary-rgb)), white 56%) 0%,
      rgb(var(--primary-rgb)) 56%,
      color-mix(in srgb, rgb(var(--primary-rgb)), black 40%) 100%);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  color: #fff;
  /* 机身挖孔：按钮镶在深色圆井里；仅保留柔和投影，不再加内阴影暗带 */
  box-shadow:
    0 0 0 0.07em rgba(var(--deep-rgb), 0.82),
    0 0 0 0.11em rgba(var(--deep-rgb), 0.42),
    0 0.09em 0.22em rgba(var(--black-rgb), 0.28),
    0 0 0.5em rgba(var(--primary-rgb), 0.30);
  cursor: pointer;
  transition: color .15s, transform .08s;
}
.tw-rbtn svg { width: 0.55em; height: 0.55em; }
.tw-rbtn:hover { color: #fff; }
/* 导图模式下纸样/字体/排版只对便签有意义 → 置灰；hover/active 一并压掉，
   否则鼠标扫过还会变色、看起来「能点」。title 会说明原因，所以保留指针事件。 */
.tw-rbtn:disabled { opacity: 0.34; cursor: not-allowed; filter: grayscale(0.35); }
.tw-rbtn:disabled:hover { color: inherit; }
.tw-rbtn:disabled:active { transform: none; box-shadow: none; }
.tw-rbtn:active { transform: translateY(0.13em); box-shadow: 0 0 0 0.07em rgba(var(--deep-rgb), 0.82), 0 0 0 0.11em rgba(var(--deep-rgb), 0.42), 0 0 0.18em rgba(var(--black-rgb), 0.30), inset 0 0.18em 0.4em rgba(var(--deep-rgb), 0.5); }

#twPaper:hover { color: rgb(var(--pale-rgb)); }
#twFont:hover { color: #fff; }
#twClear:hover { color: rgb(var(--danger-rgb)); }

.tw-grill { display: none; flex-direction: column; gap: 0.27em; opacity: 0.2; }
.tw-grill i { display: block; width: 3.2em; height: 0.13em; border-radius: 0.13em; background: #000; }
@media (min-width: 768px) { .tw-grill { display: flex; } }

/* 橙色 PRINT 大钮 */
.tw-print {
  font-size: calc(var(--tw-scale, 1) * 28px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.07em; height: 1.07em;
  min-width: 0; min-height: 0;
  padding: 0;
  box-sizing: border-box;
  border: 0.07em solid rgba(var(--white-rgb), 0.36);
  border-radius: 50%;
  /* 干净玻璃球：高光点 + 顶面玻璃反光 + 底部细反光 + 球面本体 */
  background:
    radial-gradient(circle at 33% 27%,
      rgba(var(--white-rgb), 0.85) 0%,
      rgba(var(--white-rgb), 0.5) 9%,
      rgba(var(--white-rgb), 0.18) 20%,
      transparent 34%),
    radial-gradient(ellipse 48% 30% at 39% 28%,
      rgba(var(--white-rgb), 0.55) 0%,
      rgba(var(--white-rgb), 0.14) 42%,
      transparent 66%),
    radial-gradient(ellipse 62% 24% at 52% 95%,
      rgba(var(--white-rgb), 0.16) 0%,
      transparent 60%),
    radial-gradient(circle at 36% 32%,
      color-mix(in srgb, rgb(var(--gold-rgb)), white 78%) 0%,
      color-mix(in srgb, rgb(var(--gold-rgb)), white 50%) 46%,
      color-mix(in srgb, rgb(var(--gold-rgb)), white 34%) 70%,
      color-mix(in srgb, rgb(var(--gold-rgb)), black 18%) 100%);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  color: var(--white);
  cursor: pointer;
  box-shadow:
    0 0 0 0.07em rgba(var(--deep-rgb), 0.80),
    0 0 0 0.11em rgba(var(--deep-rgb), 0.42),
    0 0.09em 0.22em rgba(var(--black-rgb), 0.26),
    0 0 0.5em rgba(var(--gold-rgb), 0.30);
  transition: filter .15s, transform .08s;
}
/* 亮色模式：绿色按钮井口压淡 */
:host(:not(.dark)) .tw-rbtn {
  box-shadow:
    0 0 0 0.07em rgba(var(--surface-deep-rgb), 0.20),
    0 0 0 0.11em rgba(var(--surface-deep-rgb), 0.10),
    0 0 0 0.16em rgba(var(--white-rgb), 0.18),
    0 0.09em 0.22em rgba(var(--black-rgb), 0.18),
    0 0 0.5em rgba(var(--primary-rgb), 0.10);
}

/* 亮色模式：PRINT 钮井口压淡，避免黄球边缘显脏 */
:host(:not(.dark)) .tw-print,
body:not(.dark) .tw-print {
  box-shadow:
    0 0 0 0.1em rgba(var(--surface-deep-rgb), 0.24),
    0 0 0 0.17em rgba(var(--surface-deep-rgb), 0.08),
    0 0 0 0.24em rgba(var(--white-rgb), 0.08),
    inset 0 0.14em 0.28em -0.07em rgba(var(--black-rgb), 0.10),
    inset 0 -0.07em 0.14em -0.07em rgba(var(--black-rgb), 0.12),
    0 0 0.69em rgba(var(--gold-rgb), 0.26);
}
.tw-print svg { width: 0.72em; height: 0.72em; }
.tw-print:hover { filter: brightness(1.1); }
.tw-print:active { transform: translateY(0.13em); box-shadow: 0 0 0 0.07em rgba(var(--deep-rgb), 0.80), 0 0 0 0.1em rgba(var(--deep-rgb), 0.45), 0 0 0 0.14em rgba(var(--white-rgb), 0.12), inset 0 0.28em 0.69em rgba(var(--black-rgb), 0.30); }


/* 暗色模式：按钮恢复饱和实色，并加深井口让凹槽更明显 */
body.dark .tw-rbtn,
:host(.dark) .tw-rbtn {
  background:
    radial-gradient(circle at 33% 27%,
      rgba(var(--white-rgb), 0.82) 0%,
      rgba(var(--white-rgb), 0.45) 9%,
      rgba(var(--white-rgb), 0.14) 20%,
      transparent 34%),
    radial-gradient(ellipse 48% 30% at 39% 28%,
      rgba(var(--white-rgb), 0.42) 0%,
      rgba(var(--white-rgb), 0.08) 42%,
      transparent 66%),
    radial-gradient(ellipse 62% 24% at 52% 95%,
      rgba(var(--white-rgb), 0.12) 0%,
      transparent 60%),
    radial-gradient(circle at 36% 32%,
      color-mix(in srgb, rgb(var(--primary-rgb)), white 34%) 0%,
      rgb(var(--primary-rgb)) 46%,
      color-mix(in srgb, rgb(var(--primary-rgb)), black 30%) 78%,
      color-mix(in srgb, rgb(var(--primary-rgb)), black 50%) 100%);
  box-shadow:
    0 0 0 0.1em rgba(var(--deep-rgb), 0.85),
    0 0 0 0.17em rgba(var(--black-rgb), 0.30),
    0 0.09em 0.22em rgba(var(--black-rgb), 0.30),
    0 0 0.55em rgba(var(--primary-rgb), 0.30);
}
body.dark .tw-print,
:host(.dark) .tw-print {
  background:
    radial-gradient(circle at 30% 22%,
      rgba(var(--white-rgb), 0.95) 0%,
      rgba(var(--white-rgb), 0.5) 6%,
      transparent 14%),
    radial-gradient(ellipse 44% 28% at 37% 25%,
      rgba(var(--white-rgb), 0.68) 0%,
      rgba(var(--white-rgb), 0.12) 42%,
      transparent 62%),
    radial-gradient(ellipse 62% 24% at 52% 95%,
      rgba(var(--white-rgb), 0.12) 0%,
      transparent 60%),
    radial-gradient(circle at 36% 32%,
      color-mix(in srgb, rgb(var(--gold-rgb)), white 72%) 0%,
      color-mix(in srgb, rgb(var(--gold-rgb)), white 52%) 46%,
      color-mix(in srgb, rgb(var(--gold-rgb)), white 28%) 70%,
      color-mix(in srgb, rgb(var(--gold-rgb)), black 24%) 100%);
  box-shadow:
    0 0 0 0.1em rgba(var(--deep-rgb), 0.80),
    0 0 0 0.17em rgba(var(--black-rgb), 0.28),
    0 0.09em 0.22em rgba(var(--black-rgb), 0.28),
    0 0 0.6em rgba(var(--gold-rgb), 0.28);
}

/* 键盘聚焦轮廓（可访问性） */
.tw-rbtn:focus-visible,
.tw-print:focus-visible,
.tw-card-del:focus-visible {
  outline: 0.14em solid rgb(var(--primary-rgb));
  outline-offset: 0.14em;
}

/* 竹林中国 品牌标（紧贴红色闪烁点） */
.tw-brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  margin: 0 0 0 1.4em;
  /* 上下内边距不对称（上多下少）把文字整体下压一点点，
     修正 CJK 字形在 line-height:1 下视觉偏高的观感；总和保持 0.32em，药丸高度不变。 */
  padding: 0.24em 0.85em 0.08em;
  border-radius: 0.32em;
  background: rgba(var(--primary-rgb), 0.20);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  /* 亮色模式：底色是浅绿半透明，文字必须用深绿（--bamboo-deep-rgb）才够对比度；
     原先用 --pale-rgb（浅绿 168,213,168）是浅字压浅底，几乎看不清。 */
  border: 1px solid rgba(var(--bamboo-deep-rgb), 0.28);
  color: rgb(var(--bamboo-deep-rgb));
  font-size: 0.82em;
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1;
  box-shadow: inset 0 1px 2px rgba(var(--black-rgb),0.12);
}
.tw-auto {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  margin-left: 0.4em;
}
/* 暗色模式：品牌牌改深底荧光绿字 */
.theme-dark .tw-brand,
:host(.dark) .tw-brand {
  /* 凹刻药丸：渐变背景让"上深下浅"在小尺寸下也能被肉眼读出，
     再叠加内阴影把边缘压暗、底部补一道微高光，凹槽感更明确。
     同时写 :host(.dark) 兜底——Shadow DOM 内不总有 .theme-dark 祖先。 */
  background: linear-gradient(
    180deg,
    rgba(var(--black-rgb), 0.55) 0%,
    rgba(var(--black-rgb), 0.35) 55%,
    rgba(var(--black-rgb), 0.22) 100%
  );
  border: 1px solid rgba(var(--green-very-bright-rgb), 0.32);
  border-top-color: rgba(0, 0, 0, 0.55);
  border-bottom-color: rgba(255, 255, 255, 0.10);
  color: rgb(var(--green-very-bright-rgb));
  box-shadow:
    inset 0 3px 4px rgba(0, 0, 0, 0.75),
    inset 0 -1px 1px rgba(255, 255, 255, 0.12);
}
/* ===== 机身明暗开关（控制 Obsidian 亮/暗，紧邻「竹林中国」品牌标）=====
   对齐准则：与 .tw-brand 取**同一套度量**，让它视觉上是「同一枚铭牌的延伸」——
     · font-size 同为 0.82em  → em 基准与品牌牌一致（原先用 inherit 取标签行的
       0.6em，基准一错，圆角/边框/高度全都对不上）；
     · 高度 calc(1.32em + 2px) = 行高 1em + 上下内距合计 0.32em + 上下边框 2px，
       与 .tw-brand 的外沿高度严格相等；
     · 1px 边框及其色系、背模糊、内凹阴影沿用品牌牌；圆角改为**全圆跑道（胶囊）**，
       以「一眼是可拨动的开关」优先，不再跟随药丸的小圆角；
     · knob 尺寸与行程由内容盒反推：contentH = 1.32em，contentW = 2.6em - 2px。 */
.tw-theme-switch {
  position: relative;
  display: inline-block;
  vertical-align: middle;
  /* 与 .tw-brand 同字号基准：后续 em 尺寸才能与品牌牌严格对应 */
  font-size: 0.82em;
  line-height: 1;
  box-sizing: border-box;
  margin-left: 0.7em;
  width: 2.6em;
  /* 1em(行高) + 0.32em(上下内距合计) + 2px(上下边框) = 品牌牌外沿高度 */
  height: calc(1.32em + 2px);
  padding: 0;
  border: 1px solid rgba(var(--bamboo-deep-rgb), 0.28);
  /* 全圆跑道（胶囊）：半径给到远超半高，由浏览器钳制成「高度的一半」= 正半圆端头。
     写成 999em 而非 calc(0.66em + 1px)，是为了不引入裸 px（R1 令牌规则）；
     钳制后端头圆心恰好落在 knob 中心，两者同心，是标准拨动开关的比例。 */
  border-radius: 999em;
  background: rgba(var(--primary-rgb), 0.20);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  box-shadow: inset 0 1px 2px rgba(var(--black-rgb), 0.12);
  cursor: pointer;
  /* 裸 <button> 会命中全局 min-touch-target(48px)，必须清零，否则撑破标签行 */
  min-width: 0;
  min-height: 0;
  transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;   /* .tw-beeper 整体 pointer-events:none，开关需单独放行 */
}
.tw-theme-switch-knob {
  position: absolute;
  /* 内容盒高 1.32em → (1.32 - 0.94) / 2 = 0.19em，上下留白对称 */
  top: 0.19em;
  left: 0.19em;
  width: 0.94em;
  height: 0.94em;
  border-radius: 50%;
  background: rgb(var(--bamboo-deep-rgb));
  box-shadow: 0 1px 2px rgba(var(--black-rgb), 0.35);
  transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.18s ease;
}
/* 打开（暗色）：沿用品牌牌的凹刻深底 + 荧光绿边，knob 滑到右侧并点亮 */
.tw-theme-switch[aria-checked="true"] {
  border-color: rgba(var(--green-very-bright-rgb), 0.32);
  background: linear-gradient(
    180deg,
    rgba(var(--black-rgb), 0.55) 0%,
    rgba(var(--black-rgb), 0.35) 55%,
    rgba(var(--black-rgb), 0.22) 100%
  );
  box-shadow:
    inset 0 3px 4px rgba(var(--black-rgb), 0.55),
    inset 0 -1px 1px rgba(var(--green-very-bright-rgb), 0.12);
}
.tw-theme-switch[aria-checked="true"] .tw-theme-switch-knob {
  /* 行程 = 内容宽(2.6em - 2px) - knob(0.94em) - 左右留白(0.38em) = 1.28em - 2px */
  transform: translateX(calc(1.28em - 2px));
  background: rgb(var(--green-very-bright-rgb));
  box-shadow: 0 0 0.3em rgba(var(--green-very-bright-rgb), 0.6);
}
.tw-theme-switch:focus-visible {
  outline: 0.12em solid rgb(var(--primary-rgb));
  outline-offset: 0.14em;
}

/* ---- 命中区（好点面积）----
   跑道必须保持小巧才能与品牌牌对齐，可见尺寸只有约 18×11px，远低于舒适命中标准。
   因此把「可点面积」交给这个透明伪元素承担，视觉尺寸一个像素都不变。
   刻意用 px 而非 em：机身整体会随机身宽度缩放，热区若跟着等比缩小，
   本就小的目标只会更难命中——固定 px 反而在机身缩小时让热区相对更宽裕。
   边界取值受限于真实布局：
     · 上 10px —— .tw-case 上方有 1.07em 机身留白，区域内没有任何控件；
     · 下  6px —— 标签行 margin-bottom 0.8em(约 7px) 之后就是 .tw-screen，
                   再往下会吞掉输入框的点击；
     · 左右 9px —— 相邻的品牌牌与 BAMBOO IMMORTALS 都不可点，扩展过去只增面积不误伤。
   命中面积约 36×27px，约为可见跑道的 4.7 倍。 */
.tw-theme-switch::after {
  content: "";
  position: absolute;
  top: -10px;
  right: -9px;
  bottom: -6px;
  left: -9px;
  border-radius: 999em;
}

/* ---- 瞄准反馈 ----
   热区远大于可见跑道，若没有悬停反馈，用户无法判断自己有没有瞄准——
   「看着像没中却能点」或「看着像中了却没反应」都会让开关显得不好点。
   顺序很重要：:hover 必须排在 [aria-checked] 之后。两者特异性同为 (0,2,0)，
   后写者胜，故 :hover 能覆盖亮态；暗态再靠更高特异性的
   [aria-checked="true"]:hover 收尾，避免暗色下被亮态配色洗掉。 */
.tw-theme-switch:hover {
  border-color: rgba(var(--bamboo-deep-rgb), 0.55);
  background: rgba(var(--primary-rgb), 0.34);
}
.tw-theme-switch[aria-checked="true"]:hover {
  border-color: rgba(var(--green-very-bright-rgb), 0.62);
  background: linear-gradient(
    180deg,
    rgba(var(--black-rgb), 0.62) 0%,
    rgba(var(--black-rgb), 0.42) 55%,
    rgba(var(--black-rgb), 0.28) 100%
  );
}
/* 按下反馈走 filter：不与 knob 的 transform（行程）和自身的 box-shadow 抢夺同一属性 */
.tw-theme-switch:active { filter: brightness(1.06); }
.tw-theme-switch[aria-checked="true"]:active { filter: brightness(1.14); }

/* ===== 红色齿轮旋钮（模式切换：自由画布 ↔ 思维子弹） =====
   机身是「绿玻璃功能键 + 琥珀金 PRINT」两个色调，这里引入第三种信号色承载
   「切换整个模式」的语义；取暗朱红 + 金属滚花，避免与柔绿玻璃撞色。
   形态：**贴着机身右缘的竖齿轮**（轮缘朝前、轮面朝右），像老机器侧面的手轮 /
   对讲机频道轮。不做轴座、销轴等安装件：齿轮左缘与机身外缘相切，直接「坐」在
   机身侧面 —— 少一层五金件，视线不做二次停靠。
   为什么不做成平放的圆盘：平盘被机身右缘的直线切一半，现实里没有这种装法；
   而齿轮从壳体边缘露出，本来就该是轮缘朝前的竖轮 —— 直线切过圆柱侧面是真实的
   机械截面，违和感为零。
   附带好处：整套外挂件都在机身轮廓之外，不再需要任何 clip-path 裁剪，
   「切口与机身内缘对齐」这一类问题从根上消失（旧平盘的裁剪逻辑已随之删除）。 */
.tw-knob {
  position: absolute;
  top: 50%;                  /* 机身垂直居中（介于屏幕与按键之间） */
  /* button 不继承 font-size（UA 默认 13.333px），必须显式继承机身字号，
     否则 em 基准错、齿轮尺寸对不上 */
  font-size: inherit;
  /* 盒宽 2.3em：右段 1.1em 装齿轮（左缘恰好落在机身外缘）、左段 1.2em 铺在机身绿面上
     只当点击热区（不可见），这样齿轮本身不必为了好点而做胖 */
  right: -1.1em;
  transform: translateY(-50%);
  width: 2.3em; height: 3em;
  /* 【尺寸·必留】本元素是裸 <button>，会命中 components-interaction.css 的全局触控规则
     `button, .btn, … { min-width/min-height: var(--min-touch-target) }`（= 48px）；
     min-* 恒压过 width/height，会把整组外挂件撑大、轴座与齿轮的相对位置全乱。
     （与同机身的 .tw-rbtn / .tw-print 同款处理） */
  min-width: 0; min-height: 0;
  padding: 0; border: 0;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;      /* .tw-beeper 整体 pointer-events:none，旋钮要单独放行 */
  -webkit-tap-highlight-color: transparent;
}
/* 贴合影：齿轮左缘压住机身边缘处的一小片暗影，交代它是「装在机身侧面」而不是飘着 */
.tw-knob::before {
  content: "";
  position: absolute;
  left: 0.82em; top: 50%;
  width: 0.6em; height: 2.3em;
  transform: translateY(-50%);
  background: radial-gradient(ellipse 48% 50% at 80% 50%, rgba(24, 6, 4, .45), transparent 76%);
  pointer-events: none;
}
/* 按下反馈：模式切换拨轮不需要 scale 缩放（缩放会导致镜面高光带跳位，且拨轮不是按压键）。
   保留纯净的定位 transform，不做视觉形变。 */
/* 竖齿轮本体：立着的轮（轮缘朝前），直径 2.7em、轮厚 1.05em
   left 1.2em = 机身外缘（见 .tw-knob 的盒宽拆分），左缘与机身相切，不做安装件 */
.tw-knob-wheel {
  position: absolute;
  left: 1.2em; top: 50%;
  transform: translateY(-50%);
  width: 1.05em; height: 2.7em;
  border-radius: 0.52em;             /* 胶囊：上下即圆柱端头 */
  overflow: hidden;                  /* 齿脊层滚动时不越界 */
  /* 胶木旋钮：去掉玻璃感镜面高光带，圆柱体积完全交给下方红渐变 + ::after 横向收边承担，
     避免亮色下高光发灰显脏。暗部一律用饱和红（#8d2413 / rgba(88,14,6)），不用黑。 */
  background:
    linear-gradient(180deg,
      #a92e19 0%, #c7482b 14%, #e4653f 34%, #ef7c56 46%,
      #dd5737 62%, #b93620 86%, #8d2413 100%);
  box-shadow:
    inset 0 0 0 0.03em rgba(255, 232, 216, .38),      /* 玻璃边缘的一线亮边 */
    inset 0 0.05em 0.06em rgba(255, 240, 228, .45),
    inset 0 -0.06em 0.12em rgba(88, 14, 6, .45),      /* 底部收暗走饱和红 */
    0 0.025em 0.05em rgba(20, 4, 2, .5), 0 0.16em 0.3em rgba(var(--black-rgb), .42);
  transition: box-shadow .25s, filter .18s;
}
/* 胶木质感叠加层：① 横向收边让圆柱真正「圆」起来；② 外缘倒角高光像凸起的烤漆一圈。
   覆盖在正常态与导图点亮态之上，无需在两处各写一遍。 */
.tw-knob-wheel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;

  outline: 1.5px solid rgba(var(--primary-rgb), 0.5);
  outline-offset: 2px;
}

.tw-card-meta {
  display: none;
  justify-content: flex-end;
  margin-bottom: 0.89em;
  font-family: var(--tw-font-mono);
  font-size: var(--tw-fs-xs);
  color: var(--ink-light);
  position: relative;
  z-index: 10;
}
.tw-card-text {
  position: relative;
  z-index: 10;
  font-size: var(--tw-fs-base);
  line-height: var(--tw-line);
  font-weight: 500;
  color: var(--ink-dark);
  white-space: pre-wrap;
  
  line-break: strict;
  overflow-wrap: break-word;
  flex-grow: 1;
}

.tw-card[data-font="classic"] .tw-card-text { font-family: var(--tw-font-classic); }
.tw-card[data-font="modern"]  .tw-card-text { font-family: var(--tw-font-modern); letter-spacing: 0.03em; }
.tw-card[data-font="kai"]     .tw-card-text { font-family: var(--tw-font-kai); letter-spacing: 0.02em; }




.tw-card[data-paper="plain"] {
  --rice-paper: #FAF8F0;
  --ink-dark: #1A1A1A;
  --ink-pale: #707070;
  --tw-rule-rgb: 26, 26, 26;
}




.tw-card[data-paper="plain"] .tw-card-noise { opacity: 0.020; }


.tw-card[data-paper="night"] {
  --rice-paper: #0E150C;
  --ink-dark: #B6FFAE;
  --ink-medium: #92E58B;
  --ink-light: #7AD073;
  --ink-pale: #5CA855;
  --tw-rule-rgb: 182, 255, 174;
}
.tw-card[data-paper="night"] .tw-card-noise {
  opacity: 0.06;
  mix-blend-mode: screen;
}




.tw-card[data-paper="plain"] .tw-card-main { padding: 0.22em var(--tw-sp-6) 0.67em; }
.tw-card[data-paper="plain"] .tw-card-head {
  order: 1; margin-bottom: var(--tw-sp-4); padding-bottom: 0; border-bottom: 0;
}
.tw-card[data-paper="plain"] .tw-card-title {
  font-size: var(--tw-fs-xs); font-weight: 400; letter-spacing: 0.3em; opacity: 0.55;
}
/* 便签档（非写作档）才有的信笺排版：写作档卡片随内容成文，不套这套（含 margin-bottom，
   否则标题下方会凭空多一截——正是之前"上下不等距"的泄漏源，故写作档彻底不进此规则） */
.tw-canvas:not(.tw-mode-write) .tw-card[data-paper="plain"] .tw-card-text {
  order: 2; font-weight: 400; line-height: 2; margin-bottom: var(--tw-sp-4); letter-spacing: 0.02em;
}
.tw-card[data-paper="plain"] .tw-card-meta {
  order: 3; margin-bottom: 0; font-size: var(--tw-fs-xs); opacity: 0.5;
}





.tw-card[data-paper="night"] .tw-card-main {
  padding: 0 var(--tw-sp-6) var(--tw-sp-4);
  font-family: var(--tw-font-mono);
}
.tw-card[data-paper="night"] .tw-card-head {
  padding-bottom: var(--tw-sp-2); margin-bottom: var(--tw-sp-3);
  border-bottom: 1px dashed rgba(var(--tw-rule-rgb), 0.42);
}
.tw-card[data-paper="night"] .tw-card-title {
  font-size: var(--tw-fs-xs); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}
.tw-card[data-paper="night"] .tw-card-title::before { content: "> "; opacity: 0.85; }
.tw-card[data-paper="night"] .tw-card-meta {
  font-size: var(--tw-fs-xs); letter-spacing: 0.06em; text-transform: uppercase;
}

.tw-card[data-paper="night"] .tw-card-text {
  font-family: var(--tw-font-mono);
  font-size: var(--tw-fs-sm); line-height: 1.8; letter-spacing: 0.02em;
}

.tw-card[data-paper="night"] .tw-card-main::after {
  content: ""; position: absolute; inset: 0; z-index: 20;
  pointer-events: none;
  background: repeating-linear-gradient(0deg,
    rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 3px);
}


.tw-card-text.is-typing::after {
  content: "";
  display: inline-block;
  width: 0.33em; height: 1.11em;
  vertical-align: text-bottom;
  background: rgba(var(--tw-rule-rgb), 0.5);
  animation: tw-pulse 1s infinite;
}


@keyframes tw-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

@keyframes tw-feed {
  
  from {
    transform: rotate(var(--tw-card-rot)) scale(calc(var(--tw-card-scale) * 0.9)) translateY(300px);
    opacity: 0;
  }
  to {
    transform: rotate(var(--tw-card-rot)) scale(var(--tw-card-scale)) translateY(0);
    opacity: 1;
  }
}

:host(.dark) .tw-card-main { background: var(--rice-paper); color: var(--ink-dark); }
:host(.dark) .tw-card-edge { background: var(--rice-paper); }

.tw-card-resize {
  position: absolute;
  right: 0.15em;
  bottom: 0.15em;
  width: 1.5em;
  height: 1.5em;
  z-index: 40;
  cursor: nwse-resize;
  opacity: 0;
  transition: opacity 0.15s;
  touch-action: none;
}
.tw-card:hover .tw-card-resize,
.tw-card.is-resizing .tw-card-resize { opacity: 0.75; }

.tw-card-resize::before,
.tw-card-resize::after {
  content: "";
  position: absolute;
  right: 0.2em;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  border-bottom-right-radius: 1px;
}
.tw-card-resize::before { bottom: 0.85em; width: 0.45em; height: 0.45em; }
.tw-card-resize::after  { bottom: 0.2em;  width: 0.9em;  height: 0.9em; }


.tw-card-rotate {
  position: absolute;
  /* 【布局】原在「下方正中」(left:50%)，与翻到卡片下方的工具条 (.tw-tools-below) 重叠打架。
     现移到「左侧中部」，与右侧中部的连线锚点 (.tw-card-link) 严格对称（同一套写法）：
     下方正中整条通道让给工具条，二者纵向完全不重叠，任何缩放档位都不会再相遇。 */
  top: 50%;
  left: calc(-0.9em - 12px);
  width: clamp(26px, calc(30px * var(--tw-scale, 1)), 38px);
  height: clamp(26px, calc(30px * var(--tw-scale, 1)), 38px);
  /* 【尺寸】全局触控目标规则（base-foundation.css 的 :where([role="button"]…)）
     会把带 role 的元素地板到 min-width/min-height: var(--touch-target)=44px，
     且 min-width 压过一切 width（含内联）。仿工具条按钮（.tw-card-del 的
     min-width:15px）显式声明自己的最小尺寸，否则与另一钮不等大。 */
  min-width: 26px;
  min-height: 26px;
  transform: translate(0, -50%);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  border: 1.5px solid rgba(16, 24, 40, 0.16);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    0 8px 18px -6px rgba(16, 24, 40, 0.32);
  color: #46503f;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  
  opacity: 0;
  pointer-events: none;
  touch-action: none;
  transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}
.tw-card-rotate svg { width: clamp(15px, calc(17px * var(--tw-scale, 1)), 21px); height: clamp(15px, calc(17px * var(--tw-scale, 1)), 21px); }
.tw-card-rotate:hover { color: #2f3a2c; }
.tw-card-rotate:active { cursor: grabbing; }

.tw-links {
  position: absolute;
  inset: 0;
  overflow: visible;
  pointer-events: none;   
  z-index: 1;
}

/* 连线色令牌：必须【同时】声明在连线层与控件层上。
 * 二者是**兄弟**节点（都 append 进同一个容器），CSS 自定义属性不会横向继承——
 * 只写在 .tw-links 上时，控件层内的 var(--tw-link-stroke*) 全部解析失败
 * （invalid at computed-value time → 属性退回初始值）。而 .tw-link.is-temp 只靠
 * stroke 上色，stroke 的初始值正是 none，于是「拖锚点连线」全程看不到任何预览线，
 * 即连线过程不可见。便签与子弹两种模式共用这两个类名，故此处修复同时生效。 */
.tw-links,
.tw-links-ctl {
  --tw-link-stroke: rgba(46, 62, 40, 0.42);
  --tw-link-stroke-hi: rgba(46, 62, 40, 0.9);
}

/* 控件层：与 .tw-links 同坐标系（inset:0、无 viewBox），承载悬浮控件与拖拽预览线。
 * 默认与连线层同 z-index（便签大卡片场景下控件仍位于卡片之下，保持原有行为）；
 * 思维子弹模式在 mindmap.css 里把它抬到节点之上。 */
.tw-links-ctl {
  position: absolute;
  inset: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 1;
}

.tw-link {
  fill: none;
  stroke: var(--tw-link-stroke);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  /* 默认实线；虚线由 .tw-link.is-dashed 单独开启（见下方）。
   * 注意：不要把 dasharray 放在基础样式里，否则 solid 与 dashed 两种状态都会是虚线，
   * 导致实线切换失效。 */
  pointer-events: none;   
  transition: stroke 0.18s ease;
}

.tw-link-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 16;
  stroke-linecap: round;
  pointer-events: stroke;
  cursor: pointer;
}

.tw-link-ctl {
  fill: #fff;
  stroke: var(--tw-link-stroke-hi);
  stroke-width: 1.5;
  pointer-events: auto;
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: transform .15s ease, fill .15s ease;
}
.tw-link-ctl:hover { transform: scale(1.25); fill: var(--tw-link-stroke-hi); }
.tw-link-bend { cursor: grab; }
.tw-link-bend:active { cursor: grabbing; }

.tw-link-mode { fill: #4a90d9; stroke: #2f6fb0; }
.tw-link-mode:hover { fill: #3f7fc4; }
:host(.dark) .tw-link-mode { fill: #6fb0ef; stroke: #3f87c9; }
:host(.dark) .tw-link-mode:hover { fill: #8cc2f5; }

/* 虚线线身：与 .tw-link.is-temp 同一套 dash 节奏，保持视觉语言一致 */
.tw-link.is-dashed { stroke-dasharray: 5 5; }

.tw-link-ctl.tw-link-dash { cursor: pointer; }
.tw-link-dash-bg {
  fill: rgba(255, 255, 255, 0.92);
  stroke: rgba(46, 62, 40, 0.55);
  stroke-width: 1.5;
  transition: fill .14s ease, stroke .14s ease;
}
.tw-link-dash-ico {
  fill: none;
  stroke: rgba(46, 62, 40, 0.85);
  stroke-width: 1.6;
  stroke-linecap: round;
  transition: stroke .14s ease;
}
.tw-link-ctl.tw-link-dash:hover .tw-link-dash-bg { fill: rgba(46, 62, 40, 0.95); stroke: rgba(46, 62, 40, 0.95); }
.tw-link-ctl.tw-link-dash:hover .tw-link-dash-ico { stroke: #fff; }
/* 当前为虚线态时，钮底染蓝以提示「此线已虚线」 */
.tw-link-dash.is-on .tw-link-dash-bg { fill: rgba(74, 144, 217, 0.95); stroke: #2f6fb0; }
.tw-link-dash.is-on .tw-link-dash-ico { stroke: #fff; }
:host(.dark) .tw-link-dash-bg { fill: rgba(40, 46, 38, 0.92); stroke: rgba(206, 220, 190, 0.6); }
:host(.dark) .tw-link-dash-ico { stroke: rgba(206, 220, 190, 0.9); }
:host(.dark) .tw-link-ctl.tw-link-dash:hover .tw-link-dash-bg { fill: rgba(206, 220, 190, 0.95); }
:host(.dark) .tw-link-ctl.tw-link-dash:hover .tw-link-dash-ico { stroke: #1c1f1a; }
:host(.dark) .tw-link-dash.is-on .tw-link-dash-bg { fill: rgba(111, 176, 239, 0.95); stroke: #3f87c9; }

.tw-link-ctl.tw-link-del { cursor: pointer; }
.tw-link-del-bg {
  fill: rgba(255, 255, 255, 0.92);
  stroke: rgba(178, 78, 58, 0.65);
  stroke-width: 1.5;
  transition: fill .14s ease, stroke .14s ease;
}
.tw-link-del-x {
  fill: none;
  stroke: rgba(178, 78, 58, 0.9);
  stroke-width: 1.8;
  stroke-linecap: round;
  transition: stroke .14s ease;
}
.tw-link-ctl.tw-link-del:hover .tw-link-del-bg { fill: rgba(178, 78, 58, 0.95); stroke: rgba(178, 78, 58, 0.95); }
.tw-link-ctl.tw-link-del:hover .tw-link-del-x { stroke: #fff; }
:host(.dark) .tw-link-del-bg { fill: rgba(40, 46, 38, 0.92); stroke: rgba(214, 120, 96, 0.72); }
:host(.dark) .tw-link-del-x { stroke: rgba(214, 120, 96, 0.92); }
:host(.dark) .tw-link-ctl.tw-link-del:hover .tw-link-del-bg { fill: rgba(214, 120, 96, 0.95); }
:host(.dark) .tw-link-ctl.tw-link-del:hover .tw-link-del-x { stroke: #1c1f1a; }

.tw-link-dot {
  pointer-events: none;
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transition: fill .18s ease, transform .18s ease;
}
.tw-link-dot-src { fill: var(--tw-link-stroke); stroke: none; }
.tw-link-arrow-end { fill: var(--tw-link-stroke); stroke: none; pointer-events: none; transition: fill .18s ease; }

.tw-link.is-active { stroke: var(--tw-link-stroke-hi); }
.tw-link-dot.is-active { transform: scale(1.3); }
.tw-link-dot-src.is-active { fill: var(--tw-link-stroke-hi); }
.tw-link-arrow-end.is-active { fill: var(--tw-link-stroke-hi); }

.tw-link.is-temp { stroke-dasharray: 4 5; stroke: var(--tw-link-stroke-hi); opacity: .85; pointer-events: none; }
/* 已指向一个可连接的目标：预览线转实线并加粗，给出「此刻松手即成线」的明确信号。
 * 拖拽过程因此有「搜索中(虚线) → 已锁定(实线)」两个阶段，而不是全程一个样子。 */
.tw-link.is-temp.is-valid { stroke-dasharray: none; stroke-width: 2.2; opacity: 1; }

.tw-card.is-link-target { outline: 1.5px solid rgba(46, 62, 40, 0.45); outline-offset: 5px; }

.tw-card-link {
  position: absolute;
  top: 50%;
  right: calc(-0.9em - 12px);
  width: clamp(26px, calc(30px * var(--tw-scale, 1)), 38px);
  height: clamp(26px, calc(30px * var(--tw-scale, 1)), 38px);
  /* 【尺寸·真根因】本元素 role="button"，命中 base-foundation.css 全局触控目标规则
     :where([role="button"]…) { min-width/min-height: var(--touch-target)=44px }；
     min-width 压过一切 width（含内联样式）→ 本钮恒被撑到 44px，
     而旋转握柄 role="slider" 不命中 → 左右两钮一大一小。
     仿工具条按钮（.tw-card-del 的 min-width:15px）显式声明覆盖。 */
  min-width: 26px;
  min-height: 26px;
  transform: translate(0, -50%);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  border: 1.5px solid rgba(16, 24, 40, 0.16);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    0 8px 18px -6px rgba(16, 24, 40, 0.32);
  color: #46503f;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: crosshair;
  opacity: 0;
  pointer-events: none;
  touch-action: none;
  transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}
.tw-card-link svg { width: clamp(15px, calc(17px * var(--tw-scale, 1)), 21px); height: clamp(15px, calc(17px * var(--tw-scale, 1)), 21px); }
.tw-card-link:hover { color: #2f3a2c; }
.tw-card:hover .tw-card-link,
.tw-card:focus-within .tw-card-link,
.tw-card.is-pinned .tw-card-link {
  opacity: 1;
  pointer-events: auto;
}

/* ===== MD可视化写作档：自成体系的国际化卡片 =====
   写作档刻意不复用便签的纸样资产（齿边 / 纸纹 / 信笺色 / BAMBOO IMMORTALS 抬头 / 中式字体）：
   便签是「随手记」的中式信笺，写作是「成文」，需要中性、克制、国际通用的卡片语言。

   【为什么圆角与阴影挂在 .tw-card-main 而不是 .tw-card】
   工具条 .tw-card-tools（bottom: calc(100% + 2px)）与旋转/连线握柄都定位在卡片**外部**，
   若给 .tw-card 加 overflow:hidden 会把它们一并裁掉。故 .tw-card 只做定位容器，
   表面/圆角/阴影全部下移到 .tw-card-main —— 齿边隐藏后，main 的外框就是卡片的外框。

   【位置】必须排在所有 .tw-card[data-paper="x"] 之后：
   `.tw-card[data-paper="plain"] .tw-card-main`（0-3-0）与本段同特异度，靠源码顺序决胜。 */
.tw-canvas.tw-mode-write {
  --tw-write-ink: #1F2430;
  --tw-write-line: rgba(16, 24, 40, 0.10);
  /* 拉丁优先的国际化字体栈：拉丁文走各系统 UI 字体（SF / Segoe UI / Roboto），
     中文再回落苹方 / 思源。便签的 --tw-font-sans 是中文优先栈，会把英文也渲染成中文字形。 */
  --tw-font-global: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", sans-serif;
}
.tw-canvas.tw-mode-write .tw-card {
  background: transparent;   /* 表面交给 main，卡片本体只做定位容器 */
  border: 0;
  box-shadow: none;          /* 方形阴影不能留在圆角卡后面 → 一并下移到 main */
  aspect-ratio: auto;        /* 随内容长高，不套便签定版纸样的 600/300 固定比例 */
}
.tw-canvas.tw-mode-write .tw-card-main {
  background: var(--surface-solid);      /* 主题自适应纯色（亮色纯白 / 暗色深表面） */
  border: 1px solid var(--tw-write-line);
  border-radius: 14px;                   /* 圆角基准：克制耐看，接近 Apple / Notion */
  overflow: hidden;                      /* 只裁 main 内部，工具条在它之外不受影响 */
  padding: 0.9em 1.15em 1.15em;          /* 用 em：随卡片缩放联动 */
  box-shadow:
    0 1px 2px rgba(16, 24, 40, 0.06),
    0 8px 20px -6px rgba(16, 24, 40, 0.14);
  transition: box-shadow 0.18s ease;
}
.tw-canvas.tw-mode-write .tw-card:hover .tw-card-main {
  box-shadow:
    0 1px 2px rgba(16, 24, 40, 0.08),
    0 12px 26px -8px rgba(16, 24, 40, 0.18);
}
/* 卸掉便签的装饰资产：上下齿边与纸纹 */
.tw-canvas.tw-mode-write .tw-card-edge,
.tw-canvas.tw-mode-write .tw-card-noise { display: none; }
/* 写作档不需要旋转：卡片是平铺成文的「纸片」，旋转只会打乱阅读秩序。
   连线锚点（.tw-card-link）必须保留 —— 连线正是本模式的文章顺序来源。 */
.tw-canvas.tw-mode-write .tw-card-rotate { display: none; }
/* 去掉信笺抬头（BAMBOO IMMORTALS 属纸样资产）；纸样钮在写作档同样无意义 */
.tw-canvas.tw-mode-write .tw-card-head,
.tw-canvas.tw-mode-write .tw-card-paper { display: none; }

/* ===== 写作档专属工具：上移 / 下移（文章顺序）与层级 ± =====
   默认 display:none —— 便签档/导图档不出现；写作档由 .tw-mode-write 打开。
   同时隐藏便签档那套「字号 ± / 卡片缩放 ±」：写作档的字号由层级（字阶）决定，
   再给手动字号与卡片缩放，就是同一视觉属性的第二、第三个真值 —— 「这卡为什么这么大」
   将无从判断，正是配色段明确规避的「颜色与结构两个真值打架」的同款问题。 */
.tw-card-move,
.tw-card-lv { display: none; }
.tw-canvas.tw-mode-write .tw-card-move,
.tw-canvas.tw-mode-write .tw-card-lv { display: inline-flex; }
.tw-canvas.tw-mode-write .tw-card-font,
.tw-canvas.tw-mode-write .tw-card-zoom-out,
.tw-canvas.tw-mode-write .tw-card-zoom-in { display: none; }
/* 到边界置灰（首卡不能再上移、H1 不能再提升、引用/列表不参与升降）——
   别让「点了没反应」变成没有解释的失灵。 */
.tw-card-move[disabled],
.tw-card-lv[disabled] { opacity: 0.3; cursor: default; }
.tw-canvas.tw-mode-write .tw-card-text {
  font-family: var(--tw-font-global);
  color: var(--tw-write-ink);
  line-height: 1.65;
  letter-spacing: 0;
}
/* ---- 字阶：层级最主要的常驻信号 ----
   卡片纯白、无任何长条状装饰，层级靠排版本身说话（字号 + 字重 + 行高），
   与真实文档大纲的读法一致。字号用 em —— 相对卡片自身字号，随缩放/放大联动。
   大标题字距略收（大字号下默认字距会显散），行高同步收紧，与正文拉开节奏。 */
.tw-canvas.tw-mode-write .tw-card[data-level="h1"] .tw-card-text {
  font-size: 1.75em; font-weight: 700; line-height: 1.25; letter-spacing: -0.015em;
}
.tw-canvas.tw-mode-write .tw-card[data-level="h2"] .tw-card-text {
  font-size: 1.5em; font-weight: 700; line-height: 1.28; letter-spacing: -0.012em;
}
.tw-canvas.tw-mode-write .tw-card[data-level="h3"] .tw-card-text {
  font-size: 1.32em; font-weight: 650; line-height: 1.34; letter-spacing: -0.008em;
}
.tw-canvas.tw-mode-write .tw-card[data-level="h4"] .tw-card-text {
  font-size: 1.18em; font-weight: 650; line-height: 1.42;
}
.tw-canvas.tw-mode-write .tw-card[data-level="h5"] .tw-card-text {
  font-size: 1.08em; font-weight: 600; line-height: 1.5;
}
.tw-canvas.tw-mode-write .tw-card[data-level="h6"] .tw-card-text {
  font-size: 1em; font-weight: 600; line-height: 1.5;
}
/* 引用：不用斜体（中文斜体是合成字形，很难看），改用略弱的墨色与略松的行高，
   读起来像「旁白」；导出时逐行加 > 前缀才是它真正的身份标识。 */
.tw-canvas.tw-mode-write .tw-card[data-level="quote"] .tw-card-text {
  font-weight: 400; line-height: 1.75; opacity: 0.82;
}
/* ---- 层级配色 ----
   H1–H6 走靛蓝「有序色阶」：越深层级越高，扫一眼就能看出文档骨架（层级本质是序数，
   若用 6 个无关色相会丢掉这份顺序信息）。
   其余类型各给一个独立色相；正文例外——它是「无结构」的基底，保持中性，不参与配色竞争。
   【颜色由层级派生】用户只能改类型、不能单独调色，避免出现「这卡是 H1 但我刷成了正文灰」
   这种颜色与结构两个真值打架的情况。 */
/* 色板只在 :host 定义一次：卡片（--lv-color）与菜单圆点都引用这些变量。
   刻意不在 JS 里再存一份色值 —— 两处各存一份迟早改漏一处，颜色就开始说谎。 */
:host {
  /* --lv-src-* 是色阶【唯一真源】：只在这里定义一次，且永不覆盖。
     亮/暗两套 --lv-* 都从它派生。必须多这一层间接，是因为暗色要取亮色阶的「倒序」，
     若照直觉写 var(--lv-h6)，它指向的是同元素上被暗色块自己重写的 --lv-h6 ——
     h2↔h6、h3↔h5 立刻自引用成环，按 CSS 变量规范整组解析为 invalid，
     暗色下 H1–H3/H5/H6 的徽章底、描边、文字色与菜单圆点会一起失效。 */
  --lv-src-1: #3730A3;
  --lv-src-2: #4338CA;
  --lv-src-3: #4F46E5;
  --lv-src-4: #6366F1;
  --lv-src-5: #818CF8;
  --lv-src-6: #A5B4FC;
  --lv-h1: var(--lv-src-1);
  --lv-h2: var(--lv-src-2);
  --lv-h3: var(--lv-src-3);
  --lv-h4: var(--lv-src-4);
  --lv-h5: var(--lv-src-5);
  --lv-h6: var(--lv-src-6);
  --lv-p: #94A3B8;
  --lv-quote: #D97706;
  --lv-ul: #0D9488;
  --lv-ol: #0284C7;
  --lv-task: #16A34A;
}
.tw-canvas.tw-mode-write .tw-card { --lv-color: var(--lv-p); }   /* 兜底 = 正文的中性灰 */
.tw-canvas.tw-mode-write .tw-card[data-level="h1"] { --lv-color: var(--lv-h1); }
.tw-canvas.tw-mode-write .tw-card[data-level="h2"] { --lv-color: var(--lv-h2); }
.tw-canvas.tw-mode-write .tw-card[data-level="h3"] { --lv-color: var(--lv-h3); }
.tw-canvas.tw-mode-write .tw-card[data-level="h4"] { --lv-color: var(--lv-h4); }
.tw-canvas.tw-mode-write .tw-card[data-level="h5"] { --lv-color: var(--lv-h5); }
.tw-canvas.tw-mode-write .tw-card[data-level="h6"] { --lv-color: var(--lv-h6); }
.tw-canvas.tw-mode-write .tw-card[data-level="quote"] { --lv-color: var(--lv-quote); }
.tw-canvas.tw-mode-write .tw-card[data-level="ul"] { --lv-color: var(--lv-ul); }
.tw-canvas.tw-mode-write .tw-card[data-level="ol"] { --lv-color: var(--lv-ol); }
.tw-canvas.tw-mode-write .tw-card[data-level="task"] { --lv-color: var(--lv-task); }
/* 【已废弃·勿再加回】原先这里是「左侧 3px 色条 + 整卡 8% 同色底纹」。
   实测观感廉价：3px 边框渲染在 14px 圆角上会变成一段孤立的弯条，像贴上去的异物；
   8% 整卡铺色又把白卡糊成淡紫。层级色的表达方式改为只落在小范围元素上，
   卡片本体保持纯净白面（见下方 .tw-card-level 与类型菜单圆点）。 */
.tw-canvas.tw-mode-write .tw-card-level {
  color: var(--lv-color);
  border-color: color-mix(in srgb, var(--lv-color) 45%, transparent);
}
.tw-canvas.tw-mode-write .tw-card-level:hover {
  background: color-mix(in srgb, var(--lv-color) 26%, var(--surface-solid));
  color: var(--lv-color);
}

/* 写作档：H1 徽章常驻浮在卡片上方左端，工具条默认也浮在上方居中 ——
   卡片一窄（或被缩放）两者必然叠在一起互相挡点击，而徽章 z-index(61) 更高，会压住工具条。
   让工具条整体上抬一个徽章的高度，形成「卡片 → 徽章 → 工具条」两行，横向再宽也撞不上。
   :not(.tw-tools-below) 必需：卡片贴顶时工具条会翻到卡片下方，那时它与徽章分处卡片两侧，
   再上抬反而把它推离卡片（且该规则里的 bottom:auto 不能被本条覆盖）。 */
.tw-canvas.tw-mode-write .tw-card:not(.tw-tools-below) .tw-card-tools {
  bottom: calc(100% + 8px + var(--tw-tools-size));
}

/* 暗色：徽章浮在暗画布上，亮色那套「14% 淡底 + 深色投影」会糊成一片、失去「片」的轮廓 ——
   提高同色底占比，并把为亮底调的深色投影换成暗底投影，描边也加重一点。 */
:host(.dark) .tw-canvas.tw-mode-write .tw-card-level {
  background: color-mix(in srgb, var(--lv-color) 22%, var(--surface-solid));
  border-color: color-mix(in srgb, var(--lv-color) 55%, transparent);
  box-shadow: var(--shadow-surface);   /* 主题自适应：暗色版自动切 --black-rgb */
}
:host(.dark) .tw-canvas.tw-mode-write .tw-card-level:hover {
  background: color-mix(in srgb, var(--lv-color) 38%, var(--surface-solid));
  color: var(--lv-color);
}

/* ===== 写作档：卡片宽度贴合内容（不按级别一刀切）=====
   基础 .tw-card 对所有级别一律 min-width: 300px —— 于是「测试」这种两字标题、
   「哈哈哈」这种三字正文也被撑成大卡，右侧大片留白。
   写作档下放开这个下限：卡片按「最长一行」自适应收缩，内容真的长了才长到上限。
   便签档（无 .tw-mode-write）保持原 300px 下限，不动既有便签观感。 */
.tw-canvas.tw-mode-write .tw-card {
  min-width: min(calc(88px * var(--tw-card-zoom, 1)), calc(100% - 16px));
}

/* ===== 标题卡（H1–H6）：更像「标签」=====
   宽度：上限比正文更窄（300 vs 400），长标题也不铺开。
   视觉：更小圆角 + 层级色描边 + 收紧内边距 + 卸掉抬升阴影 —— 与正文的「纸片」明确区分。
   刻意不改底色：「整卡同色底纹」此前实测观感廉价，已废弃（见上方注释，勿加回）。
   层级的主信号仍然是字号/字重（见「字阶」段），这里只做形状上的辅助区分。 */
.tw-canvas.tw-mode-write .tw-card[data-level^="h"] {
  max-width: min(calc(300px * var(--tw-card-zoom, 1)), calc(100% - 16px));
}
.tw-canvas.tw-mode-write .tw-card[data-level^="h"] .tw-card-main {
  /* 对称内边距即可保证上下等距：之前"上下不等距"的真凶是 plain 纸样给文本加了
     margin-bottom(≈16px)，现已在根上解耦（写作档不进该纸样规则），无需兜底。
     标题卡做成"标签"而非又一张白卡：更实的层级色描边（加粗 + 提高色量），
     与纯白正文卡拉开身份。刻意不铺整卡底纹（此前实测廉价，已废弃，勿加回）。 */
  padding: 0.6em 0.85em;
  min-height: 0;
  border-radius: 9px;
  border-width: 1.5px;
  border-color: color-mix(in srgb, var(--lv-color) 55%, transparent);
  box-shadow: none;
}
/* 垂直空白的真正大头是「行高」：标题字号大（H1 1.75em），基础行高 1.65 / 各档 1.25–1.5
   会在上下各留半行距 —— 视觉上就是"文字下面空一截"。标题只当一行读，压到 1.12。
   （本规则与上方 per 级 .tw-card[data-level="h1"] 的 line-height 同特异度，靠源码顺序居后覆盖。） */
.tw-canvas.tw-mode-write .tw-card[data-level^="h"] .tw-card-text {
  line-height: 1.12;
}

@media (prefers-reduced-motion: no-preference) {

@keyframes breathePink {

}

/* ========== KPI Semantic States ========== */

/* 板块容器：统一控制各板块之间的间距 */
.sections-container {
    display: flex;
    flex-direction: column;
    gap: calc(var(--space-6) * var(--section-gap-scale));
}

/* 桌面端横向布局模式：在首页根容器 #reviewContainer（class .container）上加 .horizontal-layout 时，
   首页板块从纵向流式改为多列网格（按板块数均分列数）。
   沿用现有板块顺序，仅改变排版方向（多列换行），不触碰板块顺序逻辑。
   默认纵向；仅手动切到横向才生效（会话内临时视图，不持久化）。
   仅 ≥600px 生效（与 display-compact ≤600 窄栏语义对齐）：更窄时即使残留 class
   也强制纵向 + 隐藏入口，保证"桌面/宽栏专属"。 */
.desktop-only {
    display: none;
}
@media (min-width: 600px) {
    .desktop-only {
        display: inline-flex;
    }

    /* ===== 横向模式（独立规则）：交替入列瀑布流 ===== */
    .sections-container.horizontal-layout {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    .sections-container.horizontal-layout .layout-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    .sections-container.horizontal-layout .layout-col #themeEffectSection {
        width: 100%;
        min-width: 0;
    }

    /* ===== 看板模式（独立规则）：一行全排开，每板块一列 ===== */
    .sections-container.kanban-layout {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    .sections-container.kanban-layout .layout-col.kanban-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--space-6) * var(--section-gap-scale));
    }
    /* 看板：各板块顶部对齐，清除任何顶部外边距/内边距导致的错位 */
    .sections-container.kanban-layout .layout-col.kanban-col > section {
        margin-top: 0;
        padding-top: 0;
    }
    .sections-container.kanban-layout .layout-col.kanban-col > section > *:first-child {
        margin-top: 0;   /* 板块内第一个子元素的 margin-top 也会制造顶部留白 */
        padding-top: 0;  /* 以及它自身的 padding-top（如 .cultivation-header / .stats-section 标题行） */
    }
    /* 兜底：首子元素若是纯容器，再往里一层标题的 padding-top 也清掉 */
    .sections-container.kanban-layout .layout-col.kanban-col > section > *:first-child > *:first-child {
        margin-top: 0;
        padding-top: 0;
    }
    /* 例外：目标待办文案 .todo-stats 位于 #todoContent 内，被兜底规则清掉了顶部内边距而贴顶。
       只恢复它的 padding-top，板块卡片顶仍与其它板块对齐（不动 section 自身 padding）。 */
    .sections-container.kanban-layout .layout-col.kanban-col > section.todo-section .todo-stats {
        padding-top: var(--space-3);
    }

    .sections-container.kanban-layout .layout-col.kanban-col #themeEffectSection {
        width: 100%;
        min-width: 0;
    }
}

/* ===== 布局切换过渡 =====
   纵向/横向/看板互切时，分列会一次性重建 DOM，直接跳变会显得生硬。
   这里只动 opacity / transform（走合成层，不触发重排），成本极低。
   layout-switching 类由 LayoutMode 在切换后临时添加，动画结束自行移除。 */
.sections-container.layout-switching {
    animation: layoutSwitchIn 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes layoutSwitchIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

/* 尊重系统「减少动效」设置 */
@media (prefers-reduced-motion: reduce) {
    .sections-container.layout-switching {
        animation: none;
    }
}

 *   .btn-primary      → .bm-btn--primary

 *   .btn-outline      → .bm-btn--outline

 * 用法：<button class="bm-btn bm-btn--primary bm-btn--loading" aria-busy="true">保存</button>

 * 子节点 visibility:hidden 隐藏但保留布局宽度，避免按钮塌缩。

    color: var(--bamboo-primary);
    border: 1px solid var(--bamboo-primary);
}
.btn-outline:hover {
    background: var(--btn-outline-hover);
}
.btn-sm {
    padding: var(--space-2) var(--space-4);
    min-height: var(--touch-target);
    min-width: var(--touch-target);
    font-size: var(--type-xs);
    border-radius: var(--radius-sm);
}
.btn-block {
    width: 100%;
}
.btn:disabled,
.btn.disabled {
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
}

/* ========== 空状态样式 ========== */
.empty-state-card {
    text-align: center;
    padding: var(--space-6);
    min-height: var(--touch-target);
    border: 2px dashed rgba(var(--primary-rgb), 0.2);
    border-radius: var(--radius-card);
    background: var(--card-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    cursor: pointer;
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-normal);
    box-shadow: var(--shadow-surface);
}
.empty-state-card:hover {
    border-color: var(--bamboo-primary);
    box-shadow: var(--shadow-card);
}
.empty-state-icon {
    font-size: var(--type-display-big);
    margin-bottom: var(--space-3);
}
.empty-state-title {
    font-size: var(--type-lg);
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: var(--space-2);
}
.empty-state-desc {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    margin-bottom: var(--space-2);
}
.empty-state-hint {
    font-size: var(--type-xs);
    color: var(--text-secondary);
    margin-bottom: var(--space-3);
}
.empty-state-action {
    font-size: var(--type-sm);
    font-weight: 500;
    color: var(--bamboo-primary);
}

/* ========== 列表项样式 - 匹配 .bamboo-card ========== */
.item-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
}
.item-card {
    padding: var(--space-4);
    background: var(--card-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border-radius: var(--radius-card);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-surface);
    transition: transform, opacity, box-shadow, border-color, background-color 0.3s ease;
}
.item-card:hover {
    border-color: var(--bamboo-primary);
    box-shadow: var(--shadow-card);
    transform: translateY(-2px);
}
.item-card-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.item-card-title {
    font-weight: 600;
    color: var(--text-primary);
}
.item-card-subtitle {
    font-size: var(--type-sm);
    color: var(--text-secondary);
    margin-top: 4px;
}
.item-card-actions {
    display: flex;
    gap: var(--space-2);
}
.item-action-btn {
    min-width: var(--touch-target);
    min-height: var(--touch-target);
    border: none;
    border-radius: var(--radius-md);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform, opacity, box-shadow, border-color, background-color var(--transition-fast);
}
.item-action-btn:hover {
    background: rgba(var(--primary-rgb), 0.1);
}

/* ========== 进度条样式 ========== */
.progress-bar {
    height: 8px;
    background: rgba(var(--primary-rgb), 0.1);
    border-radius: var(--radius-4);
    overflow: hidden;
    position: relative;
}
.progress-fill {
    height: 100%;
    background: var(--btn-primary-bg);
    border-radius: var(--radius-4);
    transition: width var(--transition-smooth);
}

/* ========== 滑动提示 ========== */
.swipe-hint {
    position: fixed;
    top: var(--space-4);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: var(--white);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-lg);
    font-size: var(--type-sm);
    font-weight: 600;
    z-index: var(--z-layer-keyboard-hint);
    animation: slideDown 0.3s ease;
}
@keyframes slideDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
